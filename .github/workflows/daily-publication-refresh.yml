name: Manual publication refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: daily-publication-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Discover and archive publications
        run: python util/archive_articles.py --skip-cern --skip-developpez --skip-google-analytics

      - name: Refresh public DEV impact counters
        run: python util/collect_publication_impact.py --all-devto-public

      - name: Rebuild publication index and impact page
        run: python util/build_publication_map.py --skip-google-analytics

      - name: Rebuild database framing analysis
        run: python util/build_database_tone.py

      - name: Rebuild database minibooks
        run: python util/build_minibooks.py

      - name: Rebuild agent knowledge base
        run: python util/generate_db_skills.py

      - name: Validate publication updates
        run: |
          for test in util/test_*.py; do
            python "$test"
          done
          git diff --check

      - name: Commit and push publication updates
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- archive-manifest.json db-skills.md index.html impact.html \
            rss.xml sitemap.xml home dbi-services devto yugabyte javapro \
            microsoft-techcommunity impact minibook analysis/database-tone
          if git diff --cached --quiet; then
            echo "No publication updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh publications and impact metrics" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
