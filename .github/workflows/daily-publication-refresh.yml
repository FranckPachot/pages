name: Daily publication refresh

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: daily-publication-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Discover and archive publications
        run: python util/archive_articles.py --skip-google-analytics

      - name: Rebuild publication index
        run: python util/build_publication_map.py --skip-google-analytics

      - name: Rebuild database framing analysis
        run: python util/build_database_tone.py

      - name: Open publication review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/daily-publication-refresh
          delete-branch: true
          commit-message: Archive newly discovered publications
          title: Review newly discovered publications
          body: |
            Automated daily refresh of the public publication archive.

            This job reads public publication feeds and APIs, archives newly discovered articles,
            and rebuilds the publication index. It does not post to or modify any social account.

            LinkedIn publications still require the documented authenticated, localhost-only capture.
