"3050" data-next-head=""/><meta property="og:image:height" content="1024" data-next-head=""/><meta property="og:site_name" content="TECHCOMMUNITY.MICROSOFT.COM" data-next-head=""/><link rel="canonical" href="https://techcommunity.microsoft.com/blog/adforpostgresql/ai-powered-retrieval-in-postgresql-with-azure-horizondb/4540160" data-next-head=""/><style type="text/css" data-next-head="">:root:root { --lia-nav-bg-color: var(--lia-bs-white); --lia-nav-bg-opacity: 0.8; --lia-nav-pt: 15px; --lia-nav-pb: 15px; --lia-nav-border-bottom: 1px solid var(--lia-bs-border-color); --lia-nav-box-shadow: var(--lia-bs-box-shadow-sm); --lia-nav-brand-mr: 30px; --lia-nav-brand-mr-sm: 10px; --lia-nav-brand-logo-height: 30px; --lia-nav-link-gap: 10px; --lia-nav-link-justify-content: flex-start; --lia-nav-link-py: 5px; --lia-nav-link-px: 10px; --lia-nav-link-dropdown-py: 9px; --lia-nav-link-dropdown-px: var(--lia-nav-link-px); --lia-nav-link-color: var(--lia-bs-body-color); --lia-nav-link-hover-color: var(--lia-bs-body-color); --lia-nav-link-font-size: 14px; --lia-nav-link-font-style: NORMAL; --lia-nav-link-font-weight: 400; --lia-nav-link-text-transform: none; --lia-nav-link-letter-spacing: normal; --lia-nav-link-border-radius: var(--lia-bs-border-radius-sm); --lia-nav-link-bg-color: transparent; --lia-nav-link-bg-hover-color: transparent; --lia-nav-link-border: none; --lia-nav-link-border-hover: none; --lia-nav-link-box-shadow: none; --lia-nav-link-box-shadow-hover: none; --lia-nav-link-text-border-bottom: none; --lia-nav-link-text-border-bottom-hover: 2px solid var(--lia-bs-primary); --lia-nav-dropdown-pt: 10px; --lia-nav-dropdown-pb: 15px; --lia-nav-dropdown-px: 10px; --lia-nav-dropdown-menu-offset: 2px; --lia-nav-dropdown-divider-mt: 10px; --lia-nav-dropdown-divider-mb: 10px; --lia-nav-dropdown-border-color: hsla(var(--lia-bs-black-h), var(--lia-bs-black-s), var(--lia-bs-black-l), 0.08); --lia-nav-controller-bg-hover-color: hsla(var(--lia-bs-black-h), var(--lia-bs-black-s), var(--lia-bs-black-l), 0.1); --lia-nav-controller-icon-color: var(--lia-bs-body-color); --lia-nav-controller-icon-hover-color: var(--lia-bs-body-color); --lia-nav-controller-icon-highlight: hsla(30, 100%, 50%); --lia-nav-controller-icon-highlight-text: var(--lia-yiq-dark); --lia-nav-controller-text-color: var(--lia-nav-controller-icon-color); --lia-nav-controller-text-hover-color: var(--lia-nav-controller-icon-hover-color); --lia-nav-controller-border-radius: var(--lia-border-radius-50); --lia-nav-hamburger-color: var(--lia-nav-controller-icon-color); --lia-nav-hamburger-hover-color: var(--lia-nav-controller-icon-color); --lia-nav-hamburger-bg-color: transparent; --lia-nav-hamburger-bg-hover-color: transparent; --lia-nav-hamburger-border: none; --lia-nav-hamburger-border-hover: none; --lia-nav-collapse-menu-ml: 20px; --lia-nav-collapse-menu-divider-bg: var(--lia-nav-link-color); --lia-nav-collapse-menu-divider-opacity: 0.16; }</style><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":"https://techcommunity.microsoft.com","name":"Microsoft Community Hub"},{"@type":"ListItem","position":2,"item":"https://techcommunity.microsoft.com/category/communities","name":"Communities"},{"@type":"ListItem","position":3,"item":"https://techcommunity.microsoft.com/category/products-services","name":"Products"},{"@type":"ListItem","position":4,"item":"https://techcommunity.microsoft.com/category/AzureDatabases","name":"Azure Data"},{"@type":"ListItem","position":5,"item":"https://techcommunity.microsoft.com/category/AzureDatabases/blog/ADforPostgreSQL","name":"Microsoft Blog for PostgreSQL"}]}</script><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"BlogPosting","datePublished":"7/28/2026, 6:08:05 PM","description":"Developers need flexible, efficient item searches by description. Using a Wikipedia movie dataset, I started with full-text search, then created embeddings for descriptions, and performed semantic searches. Queries combined text or similarity searches with filters. Common questions arose: How to update embeddings as data changes? How to avoid reprocessing all data? How to make AI calls more efficient? I prefer to keep business logic in the app and data manipulation in SQL, but triggers and stored procedures complicate this.\nThis post explores keeping retrieval workflows inside the database, using data, indexes, filters, and rules already in place. Instead of external workers, I want SQL abstractions to handle operations like generating and maintaining embeddings as part of the data model. I begin with relational data, using BM25&amp;nbsp;text search, generating embeddings with&amp;nbsp;AI Model Management&amp;nbsp;(AIMM) and&amp;nbsp;AI Functions, storing them with&amp;nbsp;pgvector, indexing them with&amp;nbsp;DiskANN, and integrating AI into PostgreSQL. Then I define an&amp;nbsp;AI pipeline&amp;nbsp;to maintain consistency without extra procedural code.\nThe goal is to keep AI processing close to data with declarative SQL. I used a Kaggle movies dataset with 30,000 entries over 11 years, importing a subset for simplicity. Each file has title, description, director, country, year, and ID.\nHorizonDB and AI extensions\nI&apos;ve run this on&amp;nbsp;HorizonDB&amp;nbsp;preview, where I enabled pg_textsearch, pg_vector, DiskANN, and azure_ai extensions:\n\npostgres=&amp;gt; select name, current_setting(name)\n           from pg_settings \n           where name in (&apos;server_version&apos;, &apos;azure.extensions&apos;)\n;\n           \n       name       |                current_setting\n------------------+-----------------------------------------------\n azure.extensions | pg_diskann,vector,pg_textsearch,azure_ai\n server_version   | 17.9 (Azure HorizonDB (81895d42565)(release))\n \n(2 rows)\n\n\nI downloaded and unzipped the dataset files in the current directory:\n\n\n\\! curl -L -o movies-dataset-2016-2026.zip https://www.kaggle.com/api/v1/datasets/download/lakshyaupadhyaya/wikipedia-movies-dataset-2016-2026\n\n\\! unzip -o movies-dataset-2016-2026.zip\n\n\\! rm movies-dataset-2016-2026.zip\n\n\nI created a table where I can load this data and add embeddings later:\n\n\npostgres=&amp;gt; drop table if exists wikipedia_movies\n;\n\nDROP TABLE\n\npostgres=&amp;gt; create table wikipedia_movies (\n  year int,\n  id bigint,\n  title text,\n  description text,\n  directed_by text,\n  written_by text,\n  produced_by text,\n  starring text,\n  cinematography text,\n  edited_by text,\n  release_date text,\n  country text,\n  language text,\n  primary key (year, id)\n);\n\nCREATE TABLE\n\npostgres=&amp;gt; create index on wikipedia_movies (country)\n;\n\nCREATE INDEX\n\n\nI loaded data from 2026 using a one-liner that prepends the year from the filename.\n\npostgres=&amp;gt; \\copy wikipedia_movies from program &apos;awk &apos;&apos;FNR&amp;gt;1{print substr(FILENAME,1,4)&quot;,&quot;$0}&apos;&apos; {2026..2026}.csv&apos; with (format csv)\n\nCOPY 852\n\n\nSome rows have a NULL description. I updated them with the title so every row has something meaningful to embed or search, and make sure the description cannot be null:\n\npostgres=&amp;gt; update wikipedia_movies\n           set description = format(&apos;Title: %s&apos;, title)\n           where description is null\n;\n\nUPDATE 22\n\npostgres=&amp;gt; alter table wikipedia_movies\n           alter column description set not null\n;\n\nALTER TABLE\n\n\nSo far, there&apos;s nothing AI-specific here. It&apos;s simply PostgreSQL functioning as it always does: storing structured data, enforcing keys, and allowing me to load, clean, and query using SQL.\nTry full-text search first\nBefore generating embeddings for similarity search, I started with lexical search. Azure Database for PostgreSQL supports pg_textsearch, which provides BM25-based full-text search and scoring.\n\npostgres=&amp;gt; create extension if not exists pg_textsearch;\n\nCREATE EXTENSION\n\npostgres=&amp;gt; create index wikipedia_movies_description_idx\n           on wikipedia_movies\n           using bm25 (description)\n           with (text_config = &apos;english&apos;)\n;\n\nNOTICE:  BM25 index build started for relation wikipedia_movies_description_idx\nNOTICE:  Using text search configuration: english\nNOTICE:  Using index options: k1=1.20, b=0.75\nNOTICE:  BM25 index build completed: 852 documents, avg_length=35.95\nCREATE INDEX\n\n\nThen I can search the descriptions:\n\npostgres=&amp;gt; select \n            description &amp;lt;@&amp;gt; &apos;Spanish tragicomedy autofiction from 2026&apos; as score,\n            title,\n            description\n            from wikipedia_movies\n            where country = &apos;Spain&apos; and year = &apos;2026&apos;\n            order by score limit 2\n;\n            \n       score        |      title       |                                                                                                                                                   description                                          \n--------------------+------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n -17.06686845421791 | Bitter Christmas | Bitter Christmas (Spanish: Amarga Navidad) is a 2026 Spanish tragicomedy film written and directed by Pedro Almodóvar. It stars Bárbara Lennie and Leonardo Sbaraglia alongside Aitana Sánchez-Gijón, Victoria Luengo, Patrick Criado, Milena Smit, and Quim Gutiérrez. It incorporates elements of autofiction.\n -5.273793399333954 | Aida, the Movie  | Aida, the Movie (Spanish: Aída y vuelta) is a 2026 Spanish comedy film directed by Paco León serving as a meta-sequel to the sitcom Aída.\n(2 rows)\n\nTime: 31.024 ms\n\n\nThis is the appropriate initial step. When the query includes terms found in the text, BM25 provides search and scoring capabilities. It is transparent, efficient, and easy to combine with relational filters. Nevertheless, lexical search has its limitations. It works best when the query vocabulary matches the data. But what if the user searches by concept rather than exact words? Or if the query is in French while the descriptions are in English? In such situations, embeddings help capture the semantic meaning of the description rather than its words. They do not replace BM25 but serve as an additional signal for retrieval.\nAI Model Management\nAI Model Management (AIMM) includes pre-provisioned models, so manual registration is not required, and I&apos;ve just enabled the managed model:\n\nOnce successfully enabled, I can see three registered models, which are used by default by the AI functions:\n\npostgres=&amp;gt; select alias, model_name, status from model_registry.model_list_all();\n\n       alias       |       model_name        |   status\n-------------------+-------------------------+------------\n default-chat      | gpt-5.4                 | registered\n default-embedding | text-embedding-3-small  | registered\n default-reranker  | Cohere-rerank-v4.0-fast | registered\n(3 rows)\n\npostgres=&amp;gt;\n\n\nWithout AIMM, you would need to bring your own model, or deploy an OpenAI model in Azure AI Foundry, and register it:\n\npostgres=&amp;gt; create extension if not exists azure_ai\n;\n\nCREATE EXTENSION\n\npostgres=&amp;gt; select model_registry.model_add(&apos;default-embedding&apos;,...)\n;\n\n                               model_add\n------------------------------------------------------------------------\n Model &apos;default-embedding&apos; (text-embedding-3-small) added successfully.\n(1 row)\n\nTime: 40.762 ms\n\n\nGenerate embeddings manually\nI created a vector column and generated embeddings directly from the movie descriptions.\n\npostgres=&amp;gt; create extension if not exists azure_ai\n;\n\nCREATE EXTENSION\n\npostgres=&amp;gt; create extension if not exists vector;\n\nCREATE EXTENSION\n\npostgres=&amp;gt; alter table wikipedia_movies add column embedding vector(1536),\n           alter column embedding set storage external -- (it&apos;s the default)\n;\n\nALTER TABLE\n\npostgres=&amp;gt; update wikipedia_movies\n           set embedding = azure_openai.create_embeddings(\n               input =&amp;gt; description,\n               dimensions =&amp;gt; 1536\n              )::vector(1536)\n;\n\nINFO:  Using user-assigned managed identity authentication method.\n\nUPDATE 852\nTime: 200905.958 ms (03:20.906)\n\n\nThis approach invokes the embedding service separately for each row. These calls are visible if you set client_min_messages to &apos;log&apos;. Making external service calls asynchronously for each row is not optimal. Performance could be improved by batching the requests into a more complex query:\n\npostgres=&amp;gt; with numbered as (\n            select year, id, description,\n            (row_number() over() - 1) / 100 as batch_num\n            from wikipedia_movies\n           ),\n           batched AS (\n            select array_agg(year) as years,\n             array_agg(id) as ids,\n             array_agg(description) as texts,\n             batch_num\n            from numbered\n            group by batch_num\n          ),\n          embedded AS (\n           select unnest(years) as year,\n            unnest(ids) as id,\n            azure_openai.create_embeddings(\n             input =&amp;gt; texts,\n             dimensions =&amp;gt; 1536\n            ) as emb\n           from batched\n          )\n          update wikipedia_movies t\n          set  embedding = e.emb::vector(1536) from embedded e\n          where  t.year = e.year and t.id = e.id\n;\n\nUPDATE 852\nTime: 10892.871 ms (00:10.893)\n\n\nThis is precisely where an abstraction is needed to simplify and optimize embedding generation. I will add that later.\nAfter setting the vectors in the table, I can proceed to add a DiskANN index.\n\npostgres=&amp;gt; CREATE EXTENSION IF NOT EXISTS pg_diskann\n;\n\nCREATE EXTENSION\n\npostgres=&amp;gt; CREATE INDEX wikipedia_movies_embedding_idx\n           ON wikipedia_movies\n           USING diskann (embedding vector_cosine_ops)\n;\n\nCREATE INDEX\nTime: 5369.375 ms (00:05.369)\n\n\nThis allows me to perform a semantic query in French on English descriptions while continuing to filter using standard SQL:\n\npostgres=&amp;gt; select azure_openai.create_embeddings(\n             input =&amp;gt; &apos;une comédie amère sur le thème de l&apos;&apos;auto-fiction&apos;\n            )::vector(1536) &amp;lt;=&amp;gt; embedding as score,\n            title, description\n            from wikipedia_movies\n            where country = &apos;Spain&apos; and year = &apos;2026&apos;\n            order by score limit 2\n;\n\n       score       |      title       |                                                                                                                                                    description                                                                                                                  \n-------------------+------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n 0.692949073279717 | Bitter Christmas | Bitter Christmas (Spanish: Amarga Navidad) is a 2026 Spanish tragicomedy film written and directed by Pedro Almodóvar. It stars Bárbara Lennie and Leonardo Sbaraglia alongside Aitana Sánchez-Gijón, Victoria Luengo, Patrick Criado, Milena Smit, and Quim Gutiérrez. It incorporates elements of autofiction.\n 0.757078099513101 | Cool Books       | Cool Books (Spanish: Casi todo bien)[1] is a 2026 Spanish comedy-drama film directed by Andrés Salmoyraghi and Rafael López Saubidet and written by López Saubidet and Ricardo Uhagón Vivas. It stars Marcel Borràs and Silma López alongside Lorenzo Ferro, Julián Villagrán, Secun de la Rosa, and Adelfa Calvo.\n(2 rows)\n\nTime: 269.598 ms\n\n\nThe query goes beyond simple token matching: it searches based on the description&apos;s meaning across different languages, while PostgreSQL continues to enforce relational filters on the year and country.\nThe execution plan shows a filtered scan through the DiskANN index:\n\n                                    QUERY PLAN\n-----------------------------------------------------------------------------------\n Limit (actual time=1.622..1.642 rows=2 loops=1)\n   -&amp;gt;  Custom Scan (DiskANNFilteredScan) (actual time=1.620..1.639 rows=2 loops=1)\n         Strategy: Filter(BitmapHeapScan) -&amp;gt; Vector\n         Rows Retrieved: 2 count\n         TIDs Collected: 31 count\n Planning Time: 250.003 ms\n Execution Time: 1.789 ms\n(7 rows)\n\nTime: 283.231 ms\n\n\nThis approach is efficient: the &quot;country&quot; predicate leverages the b-tree index for pre-filtering, narrowing the search to 31 rows identified by their TID—tuple identifiers stored in the b-tree leaf nodes. The Approximate Nearest Neighbors search then considers only this pre-filtered list when navigating the vector index, finding the best candidates, and subsequently retrieving the top two. Although I could have used pgvector&apos;s HNSW index instead of DiskANN, it lacks pre-filtering capabilities.\nI now face a maintenance issue: the embeddings remain correct only until the next insert or update of the description. In SQL, I expect indexes to be maintained synchronously by the database rather than by the application, but embedding generation is a step in between.\nEmbedding becomes a pipeline\nFor a one-time load, manually running the UPDATE is sufficient. However, for regular applications, this approach isn&apos;t practical. I don&apos;t want to remember to run an embedding update whenever new movies arrive, nor do I want an extra worker polling the table, additional queues, retry loops, or extra status tables that can cause data to get out of sync. Instead, I prefer the embedding workflow to be directly linked to the data, with AI pipelines in the AI Functions. A pipeline consists of a source, steps, a trigger, and a sink. In this case, the source is the movie table, the step is embedding generation, the trigger is an on_change event, and the sink is the same table with the embeddings stored as a column within each row’s description.\n\npostgres=&amp;gt; SELECT ai.create_pipeline(\n            name =&amp;gt; &apos;movie_embeddings&apos;,\n            source =&amp;gt; ai.table_source(&apos;wikipedia_movies&apos;),\n            steps =&amp;gt; ARRAY[\n              ai.embed(\n                model =&amp;gt; &apos;default-embedding&apos;,\n                input =&amp;gt; &apos;description&apos;,\n                dimensions =&amp;gt; 1536\n              )\n            ],\n            trigger =&amp;gt; &apos;on_change&apos;,\n            sink =&amp;gt; ai.table_sink(\n              &apos;wikipedia_movies&apos;,\n              on_conflict =&amp;gt; ARRAY[&apos;year&apos;, &apos;id&apos;],\n              on_conflict_action =&amp;gt; &apos;DO UPDATE SET embedding = EXCLUDED.embedding&apos;\n           )\n);\n\nNOTICE:  trigger &quot;_ai_pipeline_movie_embeddings_trigger&quot; for relation &quot;public.wikipedia_movies&quot; does not exist, skipping\n\n                 create_pipeline\n--------------------------------------------------\n Pipeline &apos;movie_embeddings&apos; created successfully\n(1 row)\n\n\nThe AI pipeline is configured to insert embeddings into a sink table, with an on-conflict clause that updates the existing row rather than inserts a new one when the key already exists. When the sink table is the source table, this always leads to an insert conflict because the row already exists when the pipeline runs, making it an update. The pipeline creates an internal batch from the source, generates embeddings, and writes them back with ON CONFLICT DO UPDATE. The trigger verifies whether the pipeline is already running in the same transaction to prevent an infinite recursion when it writes back to the same table.\nI can validate my pipeline by updating all embeddings for each description using the AI model and requesting a backfill:\n\npostgres=&amp;gt; select ai.backfill(&apos;movie_embeddings&apos;)\n;\n\nNOTICE:  table &quot;_ai_batch_d03946bdb634_chunks&quot; does not exist, skipping\n\n                         backfill\n-----------------------------------------------------------\n Pipeline &apos;movie_embeddings&apos; completed: 852 rows processed\n(1 row)\n\nTime: 10653.393 ms (00:10.65)\n\n\nThis was as quick as my batching query because the default batch size is 100.\nUnder the hood: triggers and batches\nI like to understand what is executed behind the abstraction. The call to ai.create_pipeline() has created an internal trigger on my table:\n\npostgres=&amp;gt; \\d wikipedia_movies\n\n                Table &quot;public.wikipedia_movies&quot;\n\n      Column      |    Type      | Collation | Nullable | Default\n------------------+--------------+-----------+----------+---------\n year             | integer      |           | not null |\n id               | bigint       |           | not null |\n title            | text         |           |          |\n description      | text         |           |          |\n directed_by      | text         |           |          |\n written_by       | text         |           |          |\n produced_by      | text         |           |          |\n starring         | text         |           |          |\n cinematography   | text         |           |          |\n edited_by        | text         |           |          |\n release_date     | text         |           |          |\n country          | text         |           |          |\n language         | text         |           |          |\n embedding        | vector(1536) |           |          |\n\nIndexes:\n\n    &quot;wikipedia_movies_pkey&quot; PRIMARY KEY, btree (year, id)\n    &quot;wikipedia_movies_country_idx&quot; btree (country)\n    &quot;wikipedia_movies_description_idx&quot; bm25 (description) WITH (text_config=english)\n    &quot;wikipedia_movies_embedding_idx&quot; diskann (embedding vector_cosine_ops)\n\nTriggers:\n\n    _ai_pipeline_movie_embeddings_trigger AFTER INSERT OR UPDATE ON wikipedia_movies FOR EACH STATEMENT EXECUTE FUNCTION ai._pipeline_trigger_movie_embeddings()\n\npostgres=&amp;gt; \\sf ai._pipeline_trigger_movie_embeddings\n\nCREATE OR REPLACE FUNCTION ai._pipeline_trigger_movie_embeddings()\n RETURNS trigger\n LANGUAGE plpgsql\nAS $function$ \n DECLARE running BOOLEAN; \n BEGIN\n  SELECT EXISTS(SELECT 1 FROM ai.pipeline_runs WHERE pipeline_name = &apos;movie_embeddings&apos; AND status = &apos;running&apos;) INTO running; \n  IF NOT running THEN PERFORM ai.run(&apos;movie_embeddings&apos;); END IF; \n  RETURN NULL; \n END;\n$function$\n\n\nThis trigger function is called after each INSERT or UPDATE statement, not after individual rows, and runs the pipeline if it&apos;s not already active. The FOR EACH STATEMENT option ensures it triggers once per DML statement rather than per row, enabling batching. By default, it behaves like my previous ai.backfill(), updating all embeddings regardless of description changes. Interestingly, it calls ai.run() instead of ai.backfill(), which can operate incrementally if a tracking column exists in the source table.\nOnly process what changed: incremental pipelines\nWithout an incremental_column specified in the pipeline, it replicates the source table as its batch table and re-embeds all data each time. Generating embeddings again for the unchanged description is inefficient. To prevent this, I should add a timestamp column to indicate each row&apos;s last modification time and configure the pipeline to use it as a watermark:\n\npostgres=&amp;gt; -- add the tracking column\n            alter table wikipedia_movies\n            add column updated_at timestamptz not null default clock_timestamp()\n;\n\npostgres=&amp;gt; -- function to set the update_at to now()\n           create or replace function update_timestamp()\n           returns trigger as $$\n             begin new.updated_at = clock_timestamp(); return new; end;\n           $$ language plpgsql\n;\n\npostgres=&amp;gt; -- trigger to call the function on insert or update\n           create trigger wikipedia_movies_updated\n           before insert or update on wikipedia_movies\n           for each row execute function update_timestamp()\n;\n\n\nLots of PostgreSQL examples use&amp;nbsp;now()&amp;nbsp;to set the update time, but&amp;nbsp;now()&amp;nbsp;returns the time when the transaction began, not the time when the update occurred, so using it for an incremental approach could miss the changes if a concurrent session ran the pipeline between those two in Read Committed isolation. I use&amp;nbsp;clock_timestamp()&amp;nbsp;which gets the time after the verification that no concurrent pipeline is running.\nNow I can re-create the pipeline with the incremental column defined:\n\npostgres=&amp;gt; select ai.drop_pipeline( &apos;movie_embeddings&apos; );\n\n            drop_pipeline\n-------------------------------------\n Pipeline &apos;movie_embeddings&apos; dropped\n(1 row)\n\npostgres=&amp;gt; select ai.create_pipeline(\n            name =&amp;gt; &apos;movie_embeddings&apos;,\n            source =&amp;gt; ai.table_source(\n              &apos;wikipedia_movies&apos;,\n              incremental_column =&amp;gt; &apos;updated_at&apos;\n            ),\n            steps =&amp;gt; ARRAY[\n              ai.embed(\n                model =&amp;gt; &apos;default-embedding&apos;,\n                input =&amp;gt; &apos;description&apos;,\n                dimensions =&amp;gt; 1536\n              )\n            ],\n            trigger =&amp;gt; &apos;on_change&apos;,\n            sink =&amp;gt; ai.table_sink(\n              &apos;wikipedia_movies&apos;,\n              on_conflict =&amp;gt; ARRAY[&apos;year&apos;, &apos;id&apos;],\n              on_conflict_action =&amp;gt; &apos;DO UPDATE SET embedding = EXCLUDED.embedding&apos;\n           )\n);\n\nNOTICE:  trigger &quot;_ai_pipeline_movie_embeddings_trigger&quot; for relation &quot;public.wikipedia_movies&quot; does not exist, skipping\n                 create_pipeline\n--------------------------------------------------\n Pipeline &apos;movie_embeddings&apos; created successfully\n(1 row)\n\n\nWhen using incremental_column =&amp;gt; &apos;updated_at&apos;, the batch records the last execution time as a checkpoint, so the next run only processes rows with an updated_at value higher than that checkpoint.\nThe next run will then process all rows again:\n\npostgres=&amp;gt; select ai.run(&apos;movie_embeddings&apos;);\n\nNOTICE:  table &quot;_ai_batch_ef762cbb918f_chunks&quot; does not exist, skipping\n                            run\n-----------------------------------------------------------\n Pipeline &apos;movie_embeddings&apos; completed: 852 rows processed\n(1 row)\n\nTime: 12231.656 ms (00:12.232)\n\n\nHowever, a new execution will process only incrementally:\n\npostgres=&amp;gt; select ai.run(&apos;movie_embeddings&apos;);\n\n                         run\n-----------------------------------------------------\n Pipeline &apos;movie_embeddings&apos;: no new rows to process\n(1 row)\n\npostgres=&amp;gt; update wikipedia_movies\n           set description = description || &apos; (film Français)&apos;\n           where country = &apos;France&apos;\n;\n\nNOTICE:  table &quot;_ai_batch_9769bddf6224_chunks&quot; does not exist, skipping\nUPDATE 7\nTime: 477.686 ms\n\npostgres=&amp;gt; select ai.run(&apos;movie_embeddings&apos;);\n\n                         run\n-----------------------------------------------------\n Pipeline &apos;movie_embeddings&apos;: no new rows to process\n(1 row)\n\nTime: 33.692 ms\n\n\nThe 7 updated rows have been handled by the trigger, which set the checkpoint timestamp, ensuring that the next run has no further processing to perform.\nI loaded only 2026 movies to save AI model tokens. I insert more movies from previous years and specific countries:\n\n\\copy wikipedia_movies from program &apos;awk &apos;&apos;FNR&amp;gt;1{print substr(FILENAME,1,4)&quot;,&quot;$0&quot;,,&quot;}&apos;&apos; {2016..2025}.csv&apos; with (format csv) where description is not null and country like &apos;%France%&apos;\n\nCOPY 1730\nTime: 24935.910 ms (00:24.936)\n\n\nThe insert has automatically generated 1730 embeddings from the model. The new rows are immediately accessible and can be retrieved using a new query.\n\npostgres=&amp;gt; select azure_openai.create_embeddings(\n             input =&amp;gt; &apos;a movie based on a novel from A. Camus&apos;\n            )::vector(1536) &amp;lt;=&amp;gt; embedding as score,\n            year, title, country\n            from wikipedia_movies\n            order by score limit 2\n;\n\n       score        | year |      title       |     country\n--------------------+------+------------------+-----------------\n 0.4765376989279472 | 2025 | The Stranger     | France, Belgium\n 0.5485678715584099 | 2024 | An Ordinary Case | France\n(2 rows)\n\nTime: 448.648 ms\n\n\nThe result includes the newly inserted movies from previous years. The index remains strongly consistent when the “embedding” column is modified, and the AI pipeline ensures this consistency also applies to changes in the “description” column. It behaves exactly like indexes in SQL: transparent to the application, consistent in the database.\nMore AI functions\nGenerating the embeddings is not the only feature of AI functions. Previously I&apos;ve updated the description for the movies that didn&apos;t have one, simply putting the title in it. However, I can use generate() to get a real description:\n\npostgres=&amp;gt; \\x\nExpanded display is on.\n\npostgres=&amp;gt; select azure_ai.generate(format(\n            &apos;Write a short description for the movie %s, directed by %s&apos;,\n            title, directed_by\n           )), title\n           from wikipedia_movies\n           where description like &apos;Title: %&apos;\n           limit 3\n;\n\n-[ RECORD 1 ]---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\ngenerate | Billie Eilish – Hit Me Hard and Soft: The Tour (Live in 3D) is a concert film directed by James Cameron and Billie Eilish, capturing the energy and emotion of Eilish’s live tour in immersive 3D. Blending striking visuals with powerful performances, the film brings audiences into the heart of the show and offers a vivid celebration of her music and stage presence.\ntitle    | Billie Eilish – Hit Me Hard and Soft: The Tour (Live in 3D)\n-[ RECORD 2 ]---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\ngenerate | Border 2 is an upcoming Indian war drama directed by Anurag Singh. Serving as a sequel to the iconic film Border, it is expected to bring a powerful story of patriotism, courage, and sacrifice, set against the backdrop of military conflict.\ntitle    | Border 2\n-[ RECORD 3 ]---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\ngenerate | *February* (2022) is a drama film directed by Kamen Kalev. The story follows a quiet man through different stages of his life, using minimal dialogue and striking imagery to reflect on solitude, routine, and the passage of time.\ntitle    | (February 2022)\n\n\nThe generate() function doesn&apos;t simply repeat the title. Using the title and director as context, it generates a richer description that can be stored in the table, indexed with BM25, embedded for semantic search.\nInstead of generating text from structured column, with the generate() function, I can do the opposite: create new columns from the description with the extract() function:\n\npostgres=&amp;gt; select azure_ai.extract(\n  description,\n  array[&apos;genre&apos;]\n), title\nfrom wikipedia_movies limit 3\n;\n\n-[ RECORD 1 ]--------------------------------------\nextract | {&quot;genre&quot;: &quot;coming-of-age romantic drama&quot;}\ntitle   | 18th Rose\n-[ RECORD 2 ]--------------------------------------\nextract | {&quot;genre&quot;: &quot;drama&quot;}\ntitle   | Animol\n-[ RECORD 3 ]--------------------------------------\nextract | {&quot;genre&quot;: &quot;documentary film&quot;}\ntitle   | The Best Summer\n\n\nLike embeddings, extracted attributes or additional columns could be maintained automatically through an AI Pipeline when descriptions change.\nAnother function,&amp;nbsp;azure_ai.rank(), can use the re-ranker model on the set of candidates (AIMM installed the Cohere Rerank model).\nHybrid search in one query\nOnce the table has both a BM25 index and embeddings, there is no need to choose between lexical and semantic retrieval. For many real applications, the best answer is to get candidates from both approaches and combine them to retrieve the best overall score.\nA classic way to combine them is Reciprocal Rank Fusion:\n\npostgres=&amp;gt; with semantic as (\n             select year, id,\n                  rank() over (\n                    order by embedding &amp;lt;=&amp;gt;\n                      azure_openai.create_embeddings(\n                        input =&amp;gt; &apos;space opera produced or directed by luc besson&apos;,\n                        dimensions =&amp;gt; 1536\n                      )::vector(1536)\n                  ) as r\n             from wikipedia_movies\n             where year between 2016 and 2026\n         ),\n         lexical as (\n             select year, id,\n                    rank() over (\n                      order by description &amp;lt;@&amp;gt;\n                        &apos;space opera produced or directed by luc besson&apos;\n                    ) as r\n             from wikipedia_movies \n             where year between 2016 and 2026\n         )\n         select m.year, m.title\n         from wikipedia_movies m\n          join semantic s using (year, id)\n          -- Join both result sets (full join to keep all)\n          full join lexical l using (year, id)\n          -- Reciprocal Rank Fusion (RRF):\n          order by coalesce(1.0 / (60 + s.r), 0)\n                + coalesce(1.0 / (60 + l.r), 0) desc\n          limit 5\n;\n         \nNOTICE:  pg_diskann: Filter selectivity too high (1.0000), skipping filtered vector scan\n\n year |                    title\n------+---------------------------------------------\n 2017 | Valerian and the City of a Thousand Planets\n 2025 | Dracula\n 2016 | Ballerina\n 2024 | Meanwhile on Earth\n 2016 | The Warriors Gate\n(5 rows)\n\nTime: 410.727 ms\n\n\nThe data and filters remain relational, with both BM25 and vector search options available. Ranking is handled through SQL, embeddings are synchronized through a pipeline, and reranking can be delegated to an AI model when additional precision is required. The notable aspect isn&apos;t just PostgreSQL&apos;s ability to invoke AI models, but that the entire retrieval workflow, from indexing and filtering to ranking and reranking, remains close to the data and can be expressed declaratively in SQL.\nConclusion\nThis example started with a simple retrieval problem: searching movie descriptions, combining lexical and semantic relevance, and keeping embeddings synchronized as data changes. Along the way, it used AI Functions, BM25 full-text search, vector embeddings, DiskANN indexes, and AI Pipelines, all from within PostgreSQL.\nThose capabilities are part of a broader set of multi-model features in HorizonDB, including built-in AI models and functions, graph queries with Apache AGE, and durable workflow execution. What interested me here was not any individual feature, but how they fit together around the data. Search, embeddings, indexing, and synchronization can be expressed in SQL and managed alongside the application data they depend on.\nAI applications still need models, prompts, and business logic in the application layer. But retrieval remains a critical foundation. By combining relational data, keyword search, vector search, and automated embedding pipelines within a single PostgreSQL database, HorizonDB reduces the infrastructure required to keep that foundation accurate, consistent, and up to date.\nIf you&apos;d like to try these capabilities yourself, visit the&amp;nbsp;PostgreSQL Hub&amp;nbsp;for sample applications, learning paths, and solution accelerators. The&amp;nbsp;PostgreSQL Developer Forum&amp;nbsp;is also the best place to share feedback, ask questions, and participate in the community.","mainEntityOfPage":{"@type":"WebPage","@id":"https://techcommunity.microsoft.com/blog/adforpostgresql/ai-powered-retrieval-in-postgresql-with-azure-horizondb/4540160"},"headline":"AI-Powered Retrieval in PostgreSQL with Azure HorizonDB","image":["https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTQwMTYwLW1USTY0eg?revision=21"],"dateModified":"7/28/2026, 6:36:53 AM","author":{"@type":"Person","name":"FranckPachot","url":"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/dS0zNTk1MjU3LWRGM2FHTg?image-coordinates=0%2C0%2C400%2C400"},"publisher":{"@type":"Organization","name":"TECHCOMMUNITY.MICROSOFT.COM"}}</script><noscript id="__next_css__DO_NOT_USE__"></noscript><script id="prism-bootstrap" data-nscript="beforeInteractive" crossorigin="anonymous">window.Prism = window.Prism || {};Prism.manual = true;</script><link rel="preload" href="/_next/static/css/e380712fc1c35b8b.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/e380712fc1c35b8b.css" crossorigin="anonymous" data-n-g=""/><link rel="preload" href="/_next/static/css/16ca3aa1e91dea46.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/16ca3aa1e91dea46.css" crossorigin="anonymous" data-n-p=""/><link rel="preload" href="/_next/static/css/5ffe639e00adc788.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/5ffe639e00adc788.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/8ed17267209fce19.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/8ed17267209fce19.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/af4f72a0a5873a2a.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/af4f72a0a5873a2a.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/96e83c4412cdcd6d.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/96e83c4412cdcd6d.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/b90ed3dcf17a88eb.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" h gs":[]}},"canModerateEntity":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.moderation.action.moderatableentity.moderate_entity.allow.accessDenied","key":"error.lithium.policies.moderation.action.moderatableentity.moderate_entity.allow.accessDenied","args":[]}},"canDelete":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.delete_message_view.delete_message.allow.accessDenied","key":"error.lithium.policies.forums.action.delete_message_view.delete_message.allow.accessDenied","args":[]}},"canMoveMessage":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.message.move_message.allow.accessDenied","key":"error.lithium.policies.forums.action.message.move_message.allow.accessDenied","args":[]}},"canMarkMessageReadOnly":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.feature.forums.action.mark_message_readonly.allowed.accessDenied","key":"error.lithium.policies.feature.forums.action.mark_message_readonly.allowed.accessDenied","args":[]}},"canFreezeTkbArticle":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.tkb.action_can_freeze_article.accessDenied","key":"error.lithium.policies.tkb.action_can_freeze_article.accessDenied","args":[]}},"canReportAbuse":{"__typename":"PolicyResult","failureReason":null},"canDeleteDraft":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.delete_drafts.accessDenied","key":"error.lithium.policies.delete_drafts.accessDenied","args":[]}}},"contentWorkflow":{"__typename":"ContentWorkflow","state":"PUBLISH","scheduledPublishTime":null,"scheduledTimezone":null,"userContext":{"__typename":"MessageWorkflowContext","canSubmitForReview":null,"canEdit":false,"canRecall":null,"canSubmitForPublication":null,"canReturnToAuthor":null,"canPublish":null,"canReturnToReview":null,"canSchedule":false},"shortScheduledTimezone":null},"readOnly":false,"editFrozen":false,"showMoveIndicator":false,"moderationData":{"__ref":"ModerationData:moderation_data:4540160"},"teaser":"","body":"\u003cP\u003eDevelopers need flexible, efficient item searches by description. Using a Wikipedia movie dataset, I started with full-text search, then created embeddings for descriptions, and performed semantic searches. Queries combined text or similarity searches with filters. Common questions arose: How to update embeddings as data changes? How to avoid reprocessing all data? How to make AI calls more efficient? I prefer to keep business logic in the app and data manipulation in SQL, but triggers and stored procedures complicate this.\u003c/P\u003e\n\u003cP\u003eThis post explores keeping retrieval workflows inside the database, using data, indexes, filters, and rules already in place. Instead of external workers, I want SQL abstractions to handle operations like generating and maintaining embeddings as part of the data model. I begin with relational data, using BM25\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/ai/full-text-search\" target=\"_blank\" rel=\"noopener noreferrer\"\u003etext search\u003c/A\u003e, generating embeddings with\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/ai/ai-model-management\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eAI Model Management\u003c/A\u003e\u0026nbsp;(AIMM) and\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/ai/ai-functions\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eAI Functions\u003c/A\u003e, storing them with\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/ai/vector-search-pgvector\" target=\"_blank\" rel=\"noopener noreferrer\"\u003epgvector\u003c/A\u003e, indexing them with\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/ai/vector-index-diskann\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eDiskANN\u003c/A\u003e, and integrating AI into PostgreSQL. Then I define an\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/ai/ai-pipelines\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eAI pipeline\u003c/A\u003e\u0026nbsp;to maintain consistency without extra procedural code.\u003c/P\u003e\n\u003cP\u003eThe goal is to keep AI processing close to data with declarative SQL. I used a Kaggle movies dataset with 30,000 entries over 11 years, importing a subset for simplicity. Each file has title, description, director, country, year, and ID.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId-1364256494\"\u003eHorizonDB and AI extensions\u003c/H2\u003e\n\u003cP\u003eI've run this on\u0026nbsp;\u003cA href=\"https://learn.microsoft.com/en-us/azure/horizondb/overview\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHorizonDB\u003c/A\u003e\u0026nbsp;preview, where I enabled pg_textsearch, pg_vector, DiskANN, and azure_ai extensions:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select name, current_setting(name)\n           from pg_settings \n           where name in ('server_version', 'azure.extensions')\n;\n           \n       name       |                current_setting\n------------------+-----------------------------------------------\n azure.extensions | pg_diskann,vector,pg_textsearch,azure_ai\n server_version   | 17.9 (Azure HorizonDB (81895d42565)(release))\n \n(2 rows)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eI downloaded and unzipped the dataset files in the current directory:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\n\n\\! curl -L -o movies-dataset-2016-2026.zip https://www.kaggle.com/api/v1/datasets/download/lakshyaupadhyaya/wikipedia-movies-dataset-2016-2026\n\n\\! unzip -o movies-dataset-2016-2026.zip\n\n\\! rm movies-dataset-2016-2026.zip\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eI created a table where I can load this data and add embeddings later:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\n\npostgres=\u0026gt; drop table if exists wikipedia_movies\n;\n\nDROP TABLE\n\npostgres=\u0026gt; create table wikipedia_movies (\n  year int,\n  id bigint,\n  title text,\n  description text,\n  directed_by text,\n  written_by text,\n  produced_by text,\n  starring text,\n  cinematography text,\n  edited_by text,\n  release_date text,\n  country text,\n  language text,\n  primary key (year, id)\n);\n\nCREATE TABLE\n\npostgres=\u0026gt; create index on wikipedia_movies (country)\n;\n\nCREATE INDEX\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eI loaded data from 2026 using a one-liner that prepends the year from the filename.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; \\copy wikipedia_movies from program 'awk ''FNR\u0026gt;1{print substr(FILENAME,1,4)\",\"$0}'' {2026..2026}.csv' with (format csv)\n\nCOPY 852\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eSome rows have a NULL description. I updated them with the title so every row has something meaningful to embed or search, and make sure the description cannot be null:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; update wikipedia_movies\n           set description = format('Title: %s', title)\n           where description is null\n;\n\nUPDATE 22\n\npostgres=\u0026gt; alter table wikipedia_movies\n           alter column description set not null\n;\n\nALTER TABLE\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eSo far, there's nothing AI-specific here. It's simply PostgreSQL functioning as it always does: storing structured data, enforcing keys, and allowing me to load, clean, and query using SQL.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId--443197969\"\u003eTry full-text search first\u003c/H2\u003e\n\u003cP\u003eBefore generating embeddings for similarity search, I started with lexical search. Azure Database for PostgreSQL supports \u003cCODE\u003epg_textsearch\u003c/CODE\u003e, which provides BM25-based full-text search and scoring.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; create extension if not exists pg_textsearch;\n\nCREATE EXTENSION\n\npostgres=\u0026gt; create index wikipedia_movies_description_idx\n           on wikipedia_movies\n           using bm25 (description)\n           with (text_config = 'english')\n;\n\nNOTICE:  BM25 index build started for relation wikipedia_movies_description_idx\nNOTICE:  Using text search configuration: english\nNOTICE:  Using index options: k1=1.20, b=0.75\nNOTICE:  BM25 index build completed: 852 documents, avg_length=35.95\nCREATE INDEX\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThen I can search the descriptions:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select \n            description \u0026lt;@\u0026gt; 'Spanish tragicomedy autofiction from 2026' as score,\n            title,\n            description\n            from wikipedia_movies\n            where country = 'Spain' and year = '2026'\n            order by score limit 2\n;\n            \n       score        |      title       |                                                                                                                                                   description                                          \n--------------------+------------------+------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n -17.06686845421791 | Bitter Christmas | Bitter Christmas (Spanish: Amarga Navidad) is a 2026 Spanish tragicomedy film written and directed by Pedro Almodóvar. It stars Bárbara Lennie and Leonardo Sbaraglia alongside Aitana Sánchez-Gijón, Victoria Luengo, Patrick Criado, Milena Smit, and Quim Gutiérrez. It incorporates elements of autofiction.\n -5.273793399333954 | Aida, the Movie  | Aida, the Movie (Spanish: Aída y vuelta) is a 2026 Spanish comedy film directed by Paco León serving as a meta-sequel to the sitcom Aída.\n(2 rows)\n\nTime: 31.024 ms\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis is the appropriate initial step. When the query includes terms found in the text, BM25 provides search and scoring capabilities. It is transparent, efficient, and easy to combine with relational filters. Nevertheless, lexical search has its limitations. It works best when the query vocabulary matches the data. But what if the user searches by concept rather than exact words? Or if the query is in French while the descriptions are in English? In such situations, embeddings help capture the semantic meaning of the description rather than its words. They do not replace BM25 but serve as an additional signal for retrieval.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId-2044314864\"\u003eAI Model Management\u003c/H2\u003e\n\u003cP\u003eAI Model Management (AIMM) includes pre-provisioned models, so manual registration is not required, and I've just enabled the managed model:\u003c/P\u003e\n\u003cspan class=\"lia-media-object lia-media-is-center lia-media-size-default\" data-image-alt=\"\"\u003e\u003cbutton class=\"lia-media-unstyled-btn\" type=\"button\" aria-haspopup=\"true\" aria-label=\"Enlarge Image\"\u003e\u003cimg src=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTQwMTYwLUs2UzNKNA?image-dimensions=999x550\u0026amp;revision=21\" width=\"999\" height=\"550\" alt=\"\" /\u003e\u003c/button\u003e\u003c/span\u003e\n\u003cP\u003eOnce successfully enabled, I can see three registered models, which are used by default by the AI functions:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select alias, model_name, status from model_registry.model_list_all();\n\n       alias       |       model_name        |   status\n-------------------+-------------------------+------------\n default-chat      | gpt-5.4                 | registered\n default-embedding | text-embedding-3-small  | registered\n default-reranker  | Cohere-rerank-v4.0-fast | registered\n(3 rows)\n\npostgres=\u0026gt;\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eWithout AIMM, you would need to bring your own model, or deploy an OpenAI model in Azure AI Foundry, and register it:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; create extension if not exists azure_ai\n;\n\nCREATE EXTENSION\n\npostgres=\u0026gt; select model_registry.model_add('default-embedding',...)\n;\n\n                               model_add\n------------------------------------------------------------------------\n Model 'default-embedding' (text-embedding-3-small) added successfully.\n(1 row)\n\nTime: 40.762 ms\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cH2 id=\"community-4540160-toc-hId-236860401\"\u003eGenerate embeddings manually\u003c/H2\u003e\n\u003cP\u003eI created a vector column and generated embeddings directly from the movie descriptions.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; create extension if not exists azure_ai\n;\n\nCREATE EXTENSION\n\npostgres=\u0026gt; create extension if not exists vector;\n\nCREATE EXTENSION\n\npostgres=\u0026gt; alter table wikipedia_movies add column embedding vector(1536),\n           alter column embedding set storage external -- (it's the default)\n;\n\nALTER TABLE\n\npostgres=\u0026gt; update wikipedia_movies\n           set embedding = azure_openai.create_embeddings(\n               input =\u0026gt; description,\n               dimensions =\u0026gt; 1536\n              )::vector(1536)\n;\n\nINFO:  Using user-assigned managed identity authentication method.\n\nUPDATE 852\nTime: 200905.958 ms (03:20.906)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis approach invokes the embedding service separately for each row. These calls are visible if you \u003cCODE\u003eset client_min_messages to 'log'\u003c/CODE\u003e. Making external service calls asynchronously for each row is not optimal. Performance could be improved by batching the requests into a more complex query:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; with numbered as (\n            select year, id, description,\n            (row_number() over() - 1) / 100 as batch_num\n            from wikipedia_movies\n           ),\n           batched AS (\n            select array_agg(year) as years,\n             array_agg(id) as ids,\n             array_agg(description) as texts,\n             batch_num\n            from numbered\n            group by batch_num\n          ),\n          embedded AS (\n           select unnest(years) as year,\n            unnest(ids) as id,\n            azure_openai.create_embeddings(\n             input =\u0026gt; texts,\n             dimensions =\u0026gt; 1536\n            ) as emb\n           from batched\n          )\n          update wikipedia_movies t\n          set  embedding = e.emb::vector(1536) from embedded e\n          where  t.year = e.year and t.id = e.id\n;\n\nUPDATE 852\nTime: 10892.871 ms (00:10.893)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis is precisely where an abstraction is needed to simplify and optimize embedding generation. I will add that later.\u003c/P\u003e\n\u003cP\u003eAfter setting the vectors in the table, I can proceed to add a DiskANN index.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; CREATE EXTENSION IF NOT EXISTS pg_diskann\n;\n\nCREATE EXTENSION\n\npostgres=\u0026gt; CREATE INDEX wikipedia_movies_embedding_idx\n           ON wikipedia_movies\n           USING diskann (embedding vector_cosine_ops)\n;\n\nCREATE INDEX\nTime: 5369.375 ms (00:05.369)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis allows me to perform a semantic query in French on English descriptions while continuing to filter using standard SQL:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select azure_openai.create_embeddings(\n             input =\u0026gt; 'une comédie amère sur le thème de l''auto-fiction'\n            )::vector(1536) \u0026lt;=\u0026gt; embedding as score,\n            title, description\n            from wikipedia_movies\n            where country = 'Spain' and year = '2026'\n            order by score limit 2\n;\n\n       score       |      title       |                                                                                                                                                    description                                                                                                                  \n-------------------+------------------+--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n 0.692949073279717 | Bitter Christmas | Bitter Christmas (Spanish: Amarga Navidad) is a 2026 Spanish tragicomedy film written and directed by Pedro Almodóvar. It stars Bárbara Lennie and Leonardo Sbaraglia alongside Aitana Sánchez-Gijón, Victoria Luengo, Patrick Criado, Milena Smit, and Quim Gutiérrez. It incorporates elements of autofiction.\n 0.757078099513101 | Cool Books       | Cool Books (Spanish: Casi todo bien)[1] is a 2026 Spanish comedy-drama film directed by Andrés Salmoyraghi and Rafael López Saubidet and written by López Saubidet and Ricardo Uhagón Vivas. It stars Marcel Borràs and Silma López alongside Lorenzo Ferro, Julián Villagrán, Secun de la Rosa, and Adelfa Calvo.\n(2 rows)\n\nTime: 269.598 ms\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe query goes beyond simple token matching: it searches based on the description's meaning across different languages, while PostgreSQL continues to enforce relational filters on the year and country.\u003c/P\u003e\n\u003cP\u003eThe execution plan shows a filtered scan through the DiskANN index:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\n                                    QUERY PLAN\n-----------------------------------------------------------------------------------\n Limit (actual time=1.622..1.642 rows=2 loops=1)\n   -\u0026gt;  Custom Scan (DiskANNFilteredScan) (actual time=1.620..1.639 rows=2 loops=1)\n         Strategy: Filter(BitmapHeapScan) -\u0026gt; Vector\n         Rows Retrieved: 2 count\n         TIDs Collected: 31 count\n Planning Time: 250.003 ms\n Execution Time: 1.789 ms\n(7 rows)\n\nTime: 283.231 ms\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis approach is efficient: the \"country\" predicate leverages the b-tree index for pre-filtering, narrowing the search to 31 rows identified by their TID—tuple identifiers stored in the b-tree leaf nodes. The Approximate Nearest Neighbors search then considers only this pre-filtered list when navigating the vector index, finding the best candidates, and subsequently retrieving the top two. Although I could have used pgvector's HNSW index instead of DiskANN, it lacks pre-filtering capabilities.\u003c/P\u003e\n\u003cP\u003eI now face a maintenance issue: the embeddings remain correct only until the next insert or update of the description. In SQL, I expect indexes to be maintained synchronously by the database rather than by the application, but embedding generation is a step in between.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId--1570594062\"\u003eEmbedding becomes a pipeline\u003c/H2\u003e\n\u003cP\u003eFor a one-time load, manually running the UPDATE is sufficient. However, for regular applications, this approach isn't practical. I don't want to remember to run an embedding update whenever new movies arrive, nor do I want an extra worker polling the table, additional queues, retry loops, or extra status tables that can cause data to get out of sync. Instead, I prefer the embedding workflow to be directly linked to the data, with AI pipelines in the AI Functions. A pipeline consists of a source, steps, a trigger, and a sink. In this case, the source is the movie table, the step is embedding generation, the trigger is an \u003cCODE\u003eon_change\u003c/CODE\u003e event, and the sink is the same table with the embeddings stored as a column within each row’s description.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; SELECT ai.create_pipeline(\n            name =\u0026gt; 'movie_embeddings',\n            source =\u0026gt; ai.table_source('wikipedia_movies'),\n            steps =\u0026gt; ARRAY[\n              ai.embed(\n                model =\u0026gt; 'default-embedding',\n                input =\u0026gt; 'description',\n                dimensions =\u0026gt; 1536\n              )\n            ],\n            trigger =\u0026gt; 'on_change',\n            sink =\u0026gt; ai.table_sink(\n              'wikipedia_movies',\n              on_conflict =\u0026gt; ARRAY['year', 'id'],\n              on_conflict_action =\u0026gt; 'DO UPDATE SET embedding = EXCLUDED.embedding'\n           )\n);\n\nNOTICE:  trigger \"_ai_pipeline_movie_embeddings_trigger\" for relation \"public.wikipedia_movies\" does not exist, skipping\n\n                 create_pipeline\n--------------------------------------------------\n Pipeline 'movie_embeddings' created successfully\n(1 row)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe AI pipeline is configured to insert embeddings into a sink table, with an on-conflict clause that updates the existing row rather than inserts a new one when the key already exists. When the sink table is the source table, this always leads to an insert conflict because the row already exists when the pipeline runs, making it an update. The pipeline creates an internal batch from the source, generates embeddings, and writes them back with ON CONFLICT DO UPDATE. The trigger verifies whether the pipeline is already running in the same transaction to prevent an infinite recursion when it writes back to the same table.\u003c/P\u003e\n\u003cP\u003eI can validate my pipeline by updating all embeddings for each description using the AI model and requesting a backfill:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select ai.backfill('movie_embeddings')\n;\n\nNOTICE:  table \"_ai_batch_d03946bdb634_chunks\" does not exist, skipping\n\n                         backfill\n-----------------------------------------------------------\n Pipeline 'movie_embeddings' completed: 852 rows processed\n(1 row)\n\nTime: 10653.393 ms (00:10.65)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis was as quick as my batching query because the default batch size is 100.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId-916918771\"\u003eUnder the hood: triggers and batches\u003c/H2\u003e\n\u003cP\u003eI like to understand what is executed behind the abstraction. The call to \u003cCODE\u003eai.create_pipeline()\u003c/CODE\u003e has created an internal trigger on my table:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; \\d wikipedia_movies\n\n                Table \"public.wikipedia_movies\"\n\n      Column      |    Type      | Collation | Nullable | Default\n------------------+--------------+-----------+----------+---------\n year             | integer      |           | not null |\n id               | bigint       |           | not null |\n title            | text         |           |          |\n description      | text         |           |          |\n directed_by      | text         |           |          |\n written_by       | text         |           |          |\n produced_by      | text         |           |          |\n starring         | text         |           |          |\n cinematography   | text         |           |          |\n edited_by        | text         |           |          |\n release_date     | text         |           |          |\n country          | text         |           |          |\n language         | text         |           |          |\n embedding        | vector(1536) |           |          |\n\nIndexes:\n\n    \"wikipedia_movies_pkey\" PRIMARY KEY, btree (year, id)\n    \"wikipedia_movies_country_idx\" btree (country)\n    \"wikipedia_movies_description_idx\" bm25 (description) WITH (text_config=english)\n    \"wikipedia_movies_embedding_idx\" diskann (embedding vector_cosine_ops)\n\nTriggers:\n\n    _ai_pipeline_movie_embeddings_trigger AFTER INSERT OR UPDATE ON wikipedia_movies FOR EACH STATEMENT EXECUTE FUNCTION ai._pipeline_trigger_movie_embeddings()\n\npostgres=\u0026gt; \\sf ai._pipeline_trigger_movie_embeddings\n\nCREATE OR REPLACE FUNCTION ai._pipeline_trigger_movie_embeddings()\n RETURNS trigger\n LANGUAGE plpgsql\nAS $function$ \n DECLARE running BOOLEAN; \n BEGIN\n  SELECT EXISTS(SELECT 1 FROM ai.pipeline_runs WHERE pipeline_name = 'movie_embeddings' AND status = 'running') INTO running; \n  IF NOT running THEN PERFORM ai.run('movie_embeddings'); END IF; \n  RETURN NULL; \n END;\n$function$\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis trigger function is called after each INSERT or UPDATE statement, not after individual rows, and runs the pipeline if it's not already active. The FOR EACH STATEMENT option ensures it triggers once per DML statement rather than per row, enabling batching. By default, it behaves like my previous \u003cCODE\u003eai.backfill()\u003c/CODE\u003e, updating all embeddings regardless of description changes. Interestingly, it calls \u003cCODE\u003eai.run()\u003c/CODE\u003e instead of \u003cCODE\u003eai.backfill()\u003c/CODE\u003e, which can operate incrementally if a tracking column exists in the source table.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId--890535692\"\u003eOnly process what changed: incremental pipelines\u003c/H2\u003e\n\u003cP\u003eWithout an \u003cCODE\u003eincremental_column\u003c/CODE\u003e specified in the pipeline, it replicates the source table as its batch table and re-embeds all data each time. Generating embeddings again for the unchanged description is inefficient. To prevent this, I should add a timestamp column to indicate each row's last modification time and configure the pipeline to use it as a watermark:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; -- add the tracking column\n            alter table wikipedia_movies\n            add column updated_at timestamptz not null default clock_timestamp()\n;\n\npostgres=\u0026gt; -- function to set the update_at to now()\n           create or replace function update_timestamp()\n           returns trigger as $$\n             begin new.updated_at = clock_timestamp(); return new; end;\n           $$ language plpgsql\n;\n\npostgres=\u0026gt; -- trigger to call the function on insert or update\n           create trigger wikipedia_movies_updated\n           before insert or update on wikipedia_movies\n           for each row execute function update_timestamp()\n;\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eLots of PostgreSQL examples use\u0026nbsp;\u003cCODE\u003enow()\u003c/CODE\u003e\u0026nbsp;to set the update time, but\u0026nbsp;\u003cCODE\u003enow()\u003c/CODE\u003e\u0026nbsp;returns the time when the transaction began, not the time when the update occurred, so using it for an incremental approach could miss the changes if a concurrent session ran the pipeline between those two in Read Committed isolation. I use\u0026nbsp;\u003cCODE\u003eclock_timestamp()\u003c/CODE\u003e\u0026nbsp;which gets the time after the verification that no concurrent pipeline is running.\u003c/P\u003e\n\u003cP\u003eNow I can re-create the pipeline with the incremental column defined:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select ai.drop_pipeline( 'movie_embeddings' );\n\n            drop_pipeline\n-------------------------------------\n Pipeline 'movie_embeddings' dropped\n(1 row)\n\npostgres=\u0026gt; select ai.create_pipeline(\n            name =\u0026gt; 'movie_embeddings',\n            source =\u0026gt; ai.table_source(\n              'wikipedia_movies',\n              incremental_column =\u0026gt; 'updated_at'\n            ),\n            steps =\u0026gt; ARRAY[\n              ai.embed(\n                model =\u0026gt; 'default-embedding',\n                input =\u0026gt; 'description',\n                dimensions =\u0026gt; 1536\n              )\n            ],\n            trigger =\u0026gt; 'on_change',\n            sink =\u0026gt; ai.table_sink(\n              'wikipedia_movies',\n              on_conflict =\u0026gt; ARRAY['year', 'id'],\n              on_conflict_action =\u0026gt; 'DO UPDATE SET embedding = EXCLUDED.embedding'\n           )\n);\n\nNOTICE:  trigger \"_ai_pipeline_movie_embeddings_trigger\" for relation \"public.wikipedia_movies\" does not exist, skipping\n                 create_pipeline\n--------------------------------------------------\n Pipeline 'movie_embeddings' created successfully\n(1 row)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eWhen using \u003cCODE\u003eincremental_column =\u0026gt; 'updated_at'\u003c/CODE\u003e, the batch records the last execution time as a checkpoint, so the next run only processes rows with an \u003cCODE\u003eupdated_at\u003c/CODE\u003e value higher than that checkpoint.\u003c/P\u003e\n\u003cP\u003eThe next run will then process all rows again:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select ai.run('movie_embeddings');\n\nNOTICE:  table \"_ai_batch_ef762cbb918f_chunks\" does not exist, skipping\n                            run\n-----------------------------------------------------------\n Pipeline 'movie_embeddings' completed: 852 rows processed\n(1 row)\n\nTime: 12231.656 ms (00:12.232)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eHowever, a new execution will process only incrementally:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select ai.run('movie_embeddings');\n\n                         run\n-----------------------------------------------------\n Pipeline 'movie_embeddings': no new rows to process\n(1 row)\n\npostgres=\u0026gt; update wikipedia_movies\n           set description = description || ' (film Français)'\n           where country = 'France'\n;\n\nNOTICE:  table \"_ai_batch_9769bddf6224_chunks\" does not exist, skipping\nUPDATE 7\nTime: 477.686 ms\n\npostgres=\u0026gt; select ai.run('movie_embeddings');\n\n                         run\n-----------------------------------------------------\n Pipeline 'movie_embeddings': no new rows to process\n(1 row)\n\nTime: 33.692 ms\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe 7 updated rows have been handled by the trigger, which set the checkpoint timestamp, ensuring that the next run has no further processing to perform.\u003c/P\u003e\n\u003cP\u003eI loaded only 2026 movies to save AI model tokens. I insert more movies from previous years and specific countries:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\n\\copy wikipedia_movies from program 'awk ''FNR\u0026gt;1{print substr(FILENAME,1,4)\",\"$0\",,\"}'' {2016..2025}.csv' with (format csv) where description is not null and country like '%France%'\n\nCOPY 1730\nTime: 24935.910 ms (00:24.936)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe insert has automatically generated 1730 embeddings from the model. The new rows are immediately accessible and can be retrieved using a new query.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select azure_openai.create_embeddings(\n             input =\u0026gt; 'a movie based on a novel from A. Camus'\n            )::vector(1536) \u0026lt;=\u0026gt; embedding as score,\n            year, title, country\n            from wikipedia_movies\n            order by score limit 2\n;\n\n       score        | year |      title       |     country\n--------------------+------+------------------+-----------------\n 0.4765376989279472 | 2025 | The Stranger     | France, Belgium\n 0.5485678715584099 | 2024 | An Ordinary Case | France\n(2 rows)\n\nTime: 448.648 ms\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe result includes the newly inserted movies from previous years. The index remains strongly consistent when the “embedding” column is modified, and the AI pipeline ensures this consistency also applies to changes in the “description” column. It behaves exactly like indexes in SQL: transparent to the application, consistent in the database.\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId-1596977141\"\u003eMore AI functions\u003c/H2\u003e\n\u003cP\u003eGenerating the embeddings is not the only feature of AI functions. Previously I've updated the description for the movies that didn't have one, simply putting the title in it. However, I can use \u003cCODE\u003egenerate()\u003c/CODE\u003e to get a real description:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; \\x\nExpanded display is on.\n\npostgres=\u0026gt; select azure_ai.generate(format(\n            'Write a short description for the movie %s, directed by %s',\n            title, directed_by\n           )), title\n           from wikipedia_movies\n           where description like 'Title: %'\n           limit 3\n;\n\n-[ RECORD 1 ]---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\ngenerate | Billie Eilish – Hit Me Hard and Soft: The Tour (Live in 3D) is a concert film directed by James Cameron and Billie Eilish, capturing the energy and emotion of Eilish’s live tour in immersive 3D. Blending striking visuals with powerful performances, the film brings audiences into the heart of the show and offers a vivid celebration of her music and stage presence.\ntitle    | Billie Eilish – Hit Me Hard and Soft: The Tour (Live in 3D)\n-[ RECORD 2 ]---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\ngenerate | Border 2 is an upcoming Indian war drama directed by Anurag Singh. Serving as a sequel to the iconic film Border, it is expected to bring a powerful story of patriotism, courage, and sacrifice, set against the backdrop of military conflict.\ntitle    | Border 2\n-[ RECORD 3 ]---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\ngenerate | *February* (2022) is a drama film directed by Kamen Kalev. The story follows a quiet man through different stages of his life, using minimal dialogue and striking imagery to reflect on solitude, routine, and the passage of time.\ntitle    | (February 2022)\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe \u003cCODE\u003egenerate()\u003c/CODE\u003e function doesn't simply repeat the title. Using the title and director as context, it generates a richer description that can be stored in the table, indexed with BM25, embedded for semantic search.\u003c/P\u003e\n\u003cP\u003eInstead of generating text from structured column, with the \u003cCODE\u003egenerate()\u003c/CODE\u003e function, I can do the opposite: create new columns from the description with the \u003cCODE\u003eextract()\u003c/CODE\u003e function:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; select azure_ai.extract(\n  description,\n  array['genre']\n), title\nfrom wikipedia_movies limit 3\n;\n\n-[ RECORD 1 ]--------------------------------------\nextract | {\"genre\": \"coming-of-age romantic drama\"}\ntitle   | 18th Rose\n-[ RECORD 2 ]--------------------------------------\nextract | {\"genre\": \"drama\"}\ntitle   | Animol\n-[ RECORD 3 ]--------------------------------------\nextract | {\"genre\": \"documentary film\"}\ntitle   | The Best Summer\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eLike embeddings, extracted attributes or additional columns could be maintained automatically through an AI Pipeline when descriptions change.\u003c/P\u003e\n\u003cP\u003eAnother function,\u0026nbsp;\u003cCODE\u003eazure_ai.rank()\u003c/CODE\u003e, can use the re-ranker model on the set of candidates (AIMM installed the Cohere Rerank model).\u003c/P\u003e\n\u003cH2 id=\"community-4540160-toc-hId--210477322\"\u003eHybrid search in one query\u003c/H2\u003e\n\u003cP\u003eOnce the table has both a BM25 index and embeddings, there is no need to choose between lexical and semantic retrieval. For many real applications, the best answer is to get candidates from both approaches and combine them to retrieve the best overall score.\u003c/P\u003e\n\u003cP\u003eA classic way to combine them is Reciprocal Rank Fusion:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e\npostgres=\u0026gt; with semantic as (\n             select year, id,\n                  rank() over (\n                    order by embedding \u0026lt;=\u0026gt;\n                      azure_openai.create_embeddings(\n                        input =\u0026gt; 'space opera produced or directed by luc besson',\n                        dimensions =\u0026gt; 1536\n                      )::vector(1536)\n                  ) as r\n             from wikipedia_movies\n             where year between 2016 and 2026\n         ),\n         lexical as (\n             select year, id,\n                    rank() over (\n                      order by description \u0026lt;@\u0026gt;\n                        'space opera produced or directed by luc besson'\n                    ) as r\n             from wikipedia_movies \n             where year between 2016 and 2026\n         )\n         select m.year, m.title\n         from wikipedia_movies m\n          join semantic s using (year, id)\n          -- Join both result sets (full join to keep all)\n          full join lexical l using (year, id)\n          -- Reciprocal Rank Fusion (RRF):\n          order by coalesce(1.0 / (60 + s.r), 0)\n                + coalesce(1.0 / (60 + l.r), 0) desc\n          limit 5\n;\n         \nNOTICE:  pg_diskann: Filter selectivity too high (1.0000), skipping filtered vector scan\n\n year |                    title\n------+--------------------------------
