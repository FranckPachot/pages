ented the package procedures as PostgreSQL functions to preserve their callable API, but a PostgreSQL function cannot commit or roll back its surrounding transaction. The generated \u003cCODE\u003eoecommit\u003c/CODE\u003e can preserve the instrumentation, not the transaction boundary. PostgreSQL procedures invoked with \u003cCODE\u003eCALL\u003c/CODE\u003e can perform transaction control in specific contexts, but changing these package entry points into procedures would also change how the application calls them and how return values are handled.\u003c/P\u003e\n\u003cP\u003eFor this migration, I chose to disable package-side commits. The Python driver calls \u003cCODE\u003eorderentry$setplsqlcommit('false')\u003c/CODE\u003e, commits each successful mutating call, and rolls back a failed call. Transaction ownership therefore moved from the stored package to the application. That is an intentional adaptation, not an equivalent syntax translation. Multi-call atomicity, retries, error handling, and connection-pool behavior must be reviewed with that new boundary in mind.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-2143475601\"\u003e6. Copy the reference data separately\u003c/H2\u003e\n\u003cP\u003eWithout leaving VS Code, I first checked the migrated schema, including its tables, views, and converted \u003cCODE\u003eORDERENTRY\u003c/CODE\u003e routines:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/23-migrated-soe-schema-routines.png\" alt=\"Migrated SOE schema and ORDERENTRY routines in VS Code\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe migration extension converted the schema and code but did not copy the Swingbench data. For this small, specific task, it was faster to guide GitHub Copilot to generate a Python program than to switch to another migration tool. The script stayed in the repository with the connection setup and commands, making the copy reproducible and documented rather than a one-time manual operation.\u003c/P\u003e\n\u003cP\u003eI installed its dependencies (Python 3.10 or later required) and exposed connection information through environment variables rather than embedding credentials:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003epython3 -m pip install -r scripts-postgres/requirements.txt\n\nexport ORACLE_DSN='localhost:1521/FREEPDB1'\nexport ORACLE_USER='soe'\nexport ORACLE_PASSWORD='\u0026lt;soe-password\u0026gt;'\nexport PG_DSN='host=\u0026lt;host\u0026gt; port=5432 dbname=\u0026lt;db\u0026gt; user=\u0026lt;user\u0026gt; sslmode=require'\nexport PG_SCHEMA='_mig_scratch_soe'\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThe \u003cCODE\u003ePG_SCHEMA\u003c/CODE\u003e variable names the PostgreSQL schema created by the migration extension during validation. The scripts set \u003cCODE\u003esearch_path\u003c/CODE\u003e to this schema automatically before executing any SQL.\u003c/P\u003e\n\u003cP\u003eI ran a clean copy with:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003ebash scripts-postgres/copy_soe_data.sh --truncate\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/24-copy-soe-data-progress.png\" alt=\"Copying SOE table data from Oracle to PostgreSQL\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe program uses dependency order and PostgreSQL binary \u003cCODE\u003eCOPY\u003c/CODE\u003e. It also handles Oracle intervals and numeric values, preserves the intent of \u003cCODE\u003eENABLE NOVALIDATE\u003c/CODE\u003e checks, and advances the PostgreSQL sequences after loading.\u003c/P\u003e\n\u003cP\u003eI then verified that the Oracle and PostgreSQL row counts matched:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/25-oracle-postgresql-row-counts.png\" alt=\"Oracle and PostgreSQL workload table row-count comparison\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe complete implementation is available in \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/copy_soe_data.py\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ecopy_soe_data.py\u003c/A\u003e.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-336021138\"\u003e7. Recover and reproduce the Swingbench workload\u003c/H2\u003e\n\u003cP\u003eSwingbench is a free load generator, but it is not open source. It is distributed as compiled Java, so porting its client to PostgreSQL was neither practical nor the goal. For this server-side workload, the business logic is in the \u003cCODE\u003eSOE.ORDERENTRY\u003c/CODE\u003e package. The Java client primarily chooses transactions, generates parameters, and calls the package.\u003c/P\u003e\n\u003cP\u003eCalling the migrated routines with arbitrary values would test invocation, but not the real workload. I guided GitHub Copilot to inspect the files in the Swingbench container. The XML configuration provided the enabled transactions, weights, user count, delays, and timeout. I used \u003cCODE\u003ejavap\u003c/CODE\u003e to confirm the externally observable call signatures and runtime behavior needed to build a compatible validation workload. GitHub Copilot documented those findings under my direction in \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/swingbench_calls.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003escripts-postgres/swingbench_calls.md\u003c/A\u003e.\u003c/P\u003e\n\u003cP\u003eI then guided GitHub Copilot to create \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/run_swingbench_workload.py\" target=\"_blank\" rel=\"noopener noreferrer\"\u003erun_swingbench_workload.py\u003c/A\u003e. It follows the same weighted transaction selection with four persistent user connections, a start barrier, copied customer data, and the configured timeout. It reports throughput, latency, and errors without trying to reproduce the Swingbench GUI or Oracle-specific connection pool.\u003c/P\u003e\n\u003cP\u003eAs described in Section 5, transaction ownership had to change. The driver disables package-side commits, commits successful mutating calls through Psycopg, and rolls back failed calls. I ran it with:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003eexport PG_DSN='host=\u0026lt;host\u0026gt; port=5432 dbname=\u0026lt;db\u0026gt; user=\u0026lt;user\u0026gt; sslmode=require'\nexport PG_SCHEMA='_mig_scratch_soe'\n\nbash scripts-postgres/run_swingbench_workload.sh --duration 300\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eBefore creating load, the program verifies that the public workload API is complete. It exits early rather than report misleading performance results for an incomplete deployment.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId--1471433325\"\u003e8. Validate in layers\u003c/H2\u003e\n\u003cP\u003eValidation is part of the migration, not a final smoke test. Compilation proves that PostgreSQL accepts the generated objects, but not that they return the right results or preserve business effects. I directed GitHub Copilot to build four validation layers so each failure could be isolated before adding more workload complexity.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId-1145162227\"\u003eLayer 1: catalog and query validation\u003c/H3\u003e\n\u003cP\u003eThe \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/run_orderentry_tests.py\" target=\"_blank\" rel=\"noopener noreferrer\"\u003erollback-safe test harness\u003c/A\u003e begins with a preflight that checks the PostgreSQL version, required tables, five sequences, and all public workload routines. It also submits the two analytical queries to PostgreSQL with \u003cCODE\u003eEXPLAIN\u003c/CODE\u003e before proceeding to routine calls. I separately ran those \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/test-some-queries.sql\" target=\"_blank\" rel=\"noopener noreferrer\"\u003etwo analytical queries\u003c/A\u003e with \u003cCODE\u003eEXPLAIN ANALYZE\u003c/CODE\u003e against 106,583 customers, 160,684 orders, and 482,752 order items. Both executed successfully.\u003c/P\u003e\n\u003cP\u003eThe top-customer query completed in 424 ms. Its sequential scans were reasonable because it consumed almost all orders and items, although the aggregate spilled to temporary disk:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-text\"\u003e\u003ccode\u003eSort (actual time=423.274..423.277 rows=20 loops=1)\n  Sort Key: (rank() OVER (?))\n  Sort Method: quicksort  Memory: 26kB\n  Buffers: shared hit=11220, temp read=1792 written=1953\n  -\u0026gt; WindowAgg (actual time=423.242..423.255 rows=20 loops=1)\n    Run Condition: (rank() OVER (?) \u0026lt;= 20)\n    -\u0026gt; Sort (actual time=423.236..423.240 rows=21 loops=1)\n      Sort Key: sum(oi.quantity * oi.unit_price) DESC\n      Sort Method: quicksort  Memory: 1929kB\n      -\u0026gt; HashAggregate (actual time=402.740..415.533 rows=24968 loops=1)\n        Group Key: c.customer_id\n        Batches: 9  Memory Usage: 8273kB  Disk Usage: 1480kB\n        -\u0026gt; Hash Join (actual time=60.363..279.582 rows=482718 loops=1)\n          Hash Cond: (o.customer_id = c.customer_id)\n          -\u0026gt; Hash Join (actual time=34.192..176.799 rows=482752 loops=1)\n            Hash Cond: (oi.order_id = o.order_id)\n            -\u0026gt; Seq Scan on order_items oi (rows=482752 loops=1)\n            -\u0026gt; Hash\n              -\u0026gt; Seq Scan on orders o (rows=160684 loops=1)\n          -\u0026gt; Hash\n            -\u0026gt; Seq Scan on customers c (rows=106583 loops=1)\nPlanning Time: 0.742 ms\nExecution Time: 423.895 ms\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eVS Code with the PostgreSQL extension can visualize the plan, including buffers read by each node and the flow of rows between nodes: \u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/26-top-customers-graphical-plan.png\" alt=\"PostgreSQL graphical plan for the top-customers query\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe monthly revenue query completed in 627 ms. Its aggregate spilled into 33 batches before two in-memory window sorts, making \u003cCODE\u003ework_mem\u003c/CODE\u003e the first tuning candidate rather than an index:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-text\"\u003e\u003ccode\u003eWindowAgg (actual time=615.702..626.031 rows=27472 loops=1)\n  Buffers: shared hit=11211, temp read=1965 written=2208\n  -\u0026gt; Sort (actual time=615.698..617.253 rows=27472 loops=1)\n    Sort Key: customer_sales.customer_id, customer_sales.month_start\n    Sort Method: quicksort  Memory: 2352kB\n    -\u0026gt; WindowAgg (actual time=600.739..610.404 rows=27472 loops=1)\n      -\u0026gt; Sort (actual time=600.708..602.149 rows=27472 loops=1)\n        Sort Key: customer_sales.month_start, customer_sales.revenue\n        Sort Method: quicksort  Memory: 2137kB\n        -\u0026gt; Subquery Scan on customer_sales\n          (actual time=570.611..587.861 rows=27472 loops=1)\n          -\u0026gt; HashAggregate\n            (actual time=570.610..586.090 rows=27472 loops=1)\n            Group Key: c.customer_id,\n                 date_trunc('month', o.order_date)\n            Batches: 33  Memory Usage: 8209kB  Disk Usage: 2040kB\n            -\u0026gt; Hash Join\n              (actual time=54.823..392.870 rows=482718 loops=1)\n              Hash Cond: (o.customer_id = c.customer_id)\n              -\u0026gt; Hash Join\n                (actual time=31.672..208.840 rows=482752 loops=1)\n                Hash Cond: (oi.order_id = o.order_id)\n                -\u0026gt; Seq Scan on order_items oi (rows=482752)\n                -\u0026gt; Hash\n                  -\u0026gt; Seq Scan on orders o (rows=160684)\n              -\u0026gt; Hash\n                -\u0026gt; Seq Scan on customers c (rows=106583)\nPlanning Time: 0.266 ms\nExecution Time: 627.065 ms\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThese execution plans establish a PostgreSQL baseline and identify possible tuning work, such as aggregate spills and \u003cCODE\u003ework_mem\u003c/CODE\u003e pressure. I kept those observations for the physical-design review after correctness and concurrent workload validation rather than tuning from isolated queries too early.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId--662292236\"\u003eLayer 2: call every public workload routine\u003c/H3\u003e\n\u003cP\u003eAfter the preflight, the same harness discovers viable values and calls all nine workload transactions plus \u003cCODE\u003esetPLSQLCOMMIT\u003c/CODE\u003e:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003ebash scripts-postgres/run_orderentry_tests.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eEach call is isolated and reports its SQLSTATE on failure. The first run exposed defects that compilation could not: composite return types did not match some rows, internal and public customer-ID types differed, package settings lacked defaults, and \u003cCODE\u003enewOrder\u003c/CODE\u003e retained an Oracle \u003cCODE\u003e%TYPE\u003c/CODE\u003e cast. GitHub Copilot generated schema-relative repairs, which I reviewed and applied. The implementation is available in \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/apply_orderentry_runtime_fixes.py\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eapply_orderentry_runtime_fixes.py\u003c/A\u003e:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003ebash scripts-postgres/apply_orderentry_runtime_fixes.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eI then ran the harness again, and all ten checks passed.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId-1825220597\"\u003eLayer 3: verify business effects\u003c/H3\u003e\n\u003cP\u003eA successful call does not prove the correct business effect. GitHub Copilot generated a \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/run_swingbench_workload.py\" target=\"_blank\" rel=\"noopener noreferrer\"\u003erollback-safe order workflow\u003c/A\u003e:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003ebash scripts-postgres/run_swingbench_workload.sh --verify-only\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eIt creates two orders for a copied customer, verifies their fields and item rows, then checks that \u003cCODE\u003ebrowseandupdateorders\u003c/CODE\u003e changes one item quantity and the matching order total together. It rolls back, reconnects, and proves that both orders are absent. Only sequence values may advance because PostgreSQL sequences are nontransactional.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId-17766134\"\u003eLayer 4: weighted concurrent load\u003c/H3\u003e\n\u003cP\u003eOnly after the first three layers passed did I run concurrent load. Four users executed 287 calls across all nine transaction types with zero errors. This ordering separated migration defects from performance observations and avoided assuming that copied customer IDs were contiguous.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId--1789688329\"\u003eAfter validation: review physical design\u003c/H3\u003e\n\u003cP\u003eAfter validating the migration and ensuring data accuracy, it is time to look at the physical layer, using the execution plans captured in Layer 1 together with observations from the concurrent workload. Oracle and PostgreSQL handle data patterns differently, so blindly copying Oracle optimizations can degrade performance. PostgreSQL's MVCC architecture adds write overhead to updates, so the table \u003cCODE\u003eFILLFACTOR\u003c/CODE\u003e strategy needs a fresh look compared with Oracle's \u003cCODE\u003ePCTFREE\u003c/CODE\u003e. PostgreSQL also provides different tuning options, including partial indexes, specialized index types, and incremental sorting.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-568741785\"\u003eReproduce the complete validation\u003c/H2\u003e\n\u003cP\u003eAt the end of my run, the test setup contained:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003eall ten workload tables populated\u003c/LI\u003e\n\u003cLI\u003eall five required sequences deployed and advanced\u003c/LI\u003e\n\u003cLI\u003etwo analytical queries accepted by PostgreSQL under \u003cCODE\u003eEXPLAIN\u003c/CODE\u003e\u003c/LI\u003e\n\u003cLI\u003ea complete invocation harness\u003c/LI\u003e\n\u003cLI\u003ea weighted Swingbench-like concurrent driver\u003c/LI\u003e\n\u003cLI\u003ea rollback-safe semantic order test\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eAfter deploying the converted schema and its \u003cCODE\u003eORDERENTRY\u003c/CODE\u003e routines, I applied the reviewed runtime fixes and ran the checks in increasing order of scope:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003ebash scripts-postgres/apply_orderentry_runtime_fixes.sh\nbash scripts-postgres/run_orderentry_tests.sh\nbash scripts-postgres/run_swingbench_workload.sh --verify-only\nbash scripts-postgres/run_swingbench_workload.sh --duration 300\n\u003c/code\u003e\u003c/pre\u003e\n\u003cH2 id=\"community-4544728-toc-hId--1238712678\"\u003eConclusion\u003c/H2\u003e\n\u003cP\u003eAI did not make this migration a one-click operation. The Oracle application combined packages, private helpers, collections, package state, bulk operations, transaction control, and behavior that only appears under realistic calls. A credible migration had to understand those interactions rather than only produce PostgreSQL syntax.\u003c/P\u003e\n\u003cP\u003eThe useful change is that the migration can be approached as an integrated project from one place. In VS Code, the migration extension converted and compiled the schema. I inspected the generated code and reports, directed GitHub Copilot to generate the supporting data-copy and workload programs, reviewed and applied runtime fixes, and validated data, API calls, business effects, and concurrent load. The model accelerated code conversion and the creation of focused tools, while PostgreSQL, executable tests, and my knowledge of the application provided the evidence.\u003c/P\u003e\n\u003cP\u003eThis is the method I would carry from assessment into a real migration: use AI to drive more of the conversion, diagnosis, repair, and validation iterations, not to hide complexity. Keep source behavior, converted code, data movement, test programs, findings, and fixes together in a reproducible workspace. This makes the first prototype useful evidence for estimating the remaining effort. A migration report measures one pipeline stage; the application is migrated only when its data, transactions, business effects, and workload work together on PostgreSQL.\u003c/P\u003e\n\u003cP\u003eThis validation is necessary but not sufficient for production. A real go-live also requires review of edge cases, collation, NULL handling, error paths, security, and sustained performance under representative data volumes.\u003c/P\u003e\n\u003cP\u003eBecause this walkthrough exercises preview functionality, experience reports are especially valuable. Readers trying it on other Oracle applications or PostgreSQL targets can share what converts well, what requires intervention, and which findings would make the assessment more useful in the \u003cA class=\"lia-external-url\" href=\"https://github.com/Azure-Samples/postgres-hub/discussions\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePostgreSQL Hub Developer Forum\u003c/A\u003e\u003c/P\u003e","body@stringLength":"49210","rawBody":"\u003cP\u003eThis article explores the possibilities opened by the\u0026nbsp;\u003cSTRONG\u003eMigrations (Preview)\u003c/STRONG\u003e workflow. It is an early evaluation, using the source and target systems I had available, rather than documentation of a supported production configuration. Preview features benefit from concrete tests and feedback: the results below show both what worked and what still needed attention, with the goal of helping the workflow evolve. They should not be read as a product support or roadmap commitment for the specific databases used here.\u003c/P\u003e\n\u003cP\u003eThe goal is to evaluate how AI assistance changes the first phases of a migration: assessing the effort, creating a first working prototype, and making the remaining technical gaps visible. This is where an integrated development environment is particularly effective. Source artifacts, generated PostgreSQL code, reports, database connections, tests, findings, and repairs can remain in one reproducible VS Code workspace.\u003c/P\u003e\n\u003cP\u003eMigrating a database is not finished when the tables compile. A useful test must also answer three harder questions:\u003c/P\u003e\n\u003cOL\u003e\n\u003cLI\u003eWas the reference data copied correctly?\u003c/LI\u003e\n\u003cLI\u003eWere the application-facing stored routines actually deployed?\u003c/LI\u003e\n\u003cLI\u003eDo those routines produce the same business effects under a realistic load?\u003c/LI\u003e\n\u003c/OL\u003e\n\u003cP\u003eThis is particularly important when business logic is embedded in proprietary database constructs such as PL/SQL packages, which are in scope for this migration. \u003cA href=\"https://www.dominicgiles.com/swingbench/#about-swingbench\" target=\"_blank\" rel=\"noopener\"\u003eSwingbench Order Entry\u003c/A\u003e is a good example. It has two versions: one uses pure JDBC, with the business logic in Java, and the other places the logic in a PL/SQL package that uses advanced Oracle Database features. The server-side version illustrates the migration challenges found in many critical legacy applications.\u003c/P\u003e\n\u003cP\u003eIn this article, I walk through those questions using Swingbench's Sales Order Entry (SOE) schema. I ran Oracle Database and Swingbench in Docker containers and used the PostgreSQL extension for Visual Studio Code to convert the schema against an Azure HorizonDB (preview) scratch database. I then used GitHub Copilot to build the data-copy, workload-emulation, and validation programs needed to test PostgreSQL.\u003c/P\u003e\n\u003cP\u003eThis article follows the migration end to end. Readers can use individual sections independently, but I keep the complete sequence because each stage exposed issues that schema conversion alone could not reveal.\u003c/P\u003e\n\u003cP\u003eThroughout this project, I made the architectural decisions, directed the investigation, and validated results. The migration extension performed the model-assisted schema and PL/SQL conversion, while GitHub Copilot generated supporting code and tests under my direction. PostgreSQL compilation and the executable tests provided the evidence. Instead of replacing deterministic extraction, dependency analysis, and type mappings, AI participated in the iterations that traditionally follow them: contextual translation, review, diagnosis, repair, and validation. GitHub Copilot also produced the first draft of this article, which I reviewed and refined so it accurately describes what I ran, observed, and concluded.\u003c/P\u003e\n\u003cH2\u003eWhat was migrated\u003c/H2\u003e\n\u003cP\u003eSwingbench SOE is a compact but realistic migration target. It includes:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003ecustomers, addresses, cards, products, inventory, orders, and order items\u003c/LI\u003e\n\u003cLI\u003eprimary keys, foreign keys, checks, indexes, and sequences\u003c/LI\u003e\n\u003cLI\u003eviews and analytical queries\u003c/LI\u003e\n\u003cLI\u003ethe Oracle \u003cCODE\u003eSOE.ORDERENTRY\u003c/CODE\u003e PL/SQL package used by Swingbench, with all the application logic, leaving only the presentation layer to the frontend\u003c/LI\u003e\n\u003cLI\u003epackage state, collection types, helper routines, random choices, sleeps, transaction control, and business transactions\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eThe test environment was:\u003c/P\u003e\n\u003cDIV class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"\u003e\u003cLI-TABLE border=\"1\"\u003e\u003cLI-TSECTION name=\"thead\"\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"th\"\u003eComponent\u003c/LI-TD\u003e\u003cLI-TD name=\"th\"\u003eVersion or image\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003c/LI-TSECTION\u003e\u003cLI-TSECTION name=\"tbody\"\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003eOracle Database 26ai\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003egvenzl/oracle-free:slim\u003c/CODE\u003e (23.26.2)\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003eSwingbench\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003edomgiles/swingbench:latest\u003c/CODE\u003e (2.6.1118)\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePostgreSQL\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eAzure HorizonDB (PostgreSQL 17.9)\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePostgreSQL extension for Visual Studio Code\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e1.27.3\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003eFoundry model\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003egpt-5.2\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003c/LI-TSECTION\u003e\u003cLI-TCOLS cols=\"50.00%,50.00%\"\u003e\u003c/LI-TCOLS\u003e\u003c/LI-TABLE\u003e\u003c/DIV\u003e\n\u003cH2\u003e1. Build the Oracle source environment\u003c/H2\u003e\n\u003cP\u003eI used the following \u003cCODE\u003edocker-compose.yaml\u003c/CODE\u003e to start Oracle and keep a Swingbench container available for schema creation and testing:\u003c/P\u003e\n\u003cLI-CODE lang=\"yaml\"\u003eservices:\n  oracle:\n    image: gvenzl/oracle-free:slim\n    environment:\n      ORACLE_PASSWORD: \"\u0026lt;oracle-system-password\u0026gt;\"\n    ports:\n      - \"1521:1521\"\n    healthcheck:\n      test: [\"CMD\", \"healthcheck.sh\"]\n      interval: 10s\n      timeout: 5s\n      retries: 30\n\n  swingbench:\n    image: domgiles/swingbench:latest\n    platform: linux/amd64\n    depends_on:\n      oracle:\n        condition: service_healthy\n    entrypoint: [\"sleep\", \"infinity\"]\n\u003c/LI-CODE\u003e\n\u003cP\u003eI started both containers with:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003edocker compose up -d\n\u003c/LI-CODE\u003e\n\u003cP\u003eOnce Oracle was healthy, I created a small SOE database with Swingbench's command-line wizard. I chose scale \u003cCODE\u003e0.1\u003c/CODE\u003e: large enough to exercise the relationships while remaining convenient for repeated migrations.\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003edocker compose exec swingbench oewizard -cl -create \\\n  -cs //oracle:1521/FREEPDB1 \\\n  -dba \"sys as sysdba\" -dbap '\u0026lt;oracle-system-password\u0026gt;' \\\n  -df /opt/oracle/oradata/FREE/FREEPDB1/soe01.dbf \\\n  -u soe -p '\"\u0026lt;soe-password\u0026gt;\"' \\\n  -scale 0.1 -tc 1 -v\n\u003c/LI-CODE\u003e\n\u003cP\u003eSwingbench substitutes the SOE password into \u003cCODE\u003eCREATE USER ... IDENTIFIED BY\u003c/CODE\u003e. A password containing characters that require Oracle's quoted-password syntax must be passed with the literal double quotes expected by that SQL statement.\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/01-swingbench-oewizard-soe-data-load.png\" alt=\"Swingbench OEWizard creating the SOE schema and loading data\" /\u003e\u003c/P\u003e\n\u003cP\u003eBefore migrating anything, I compiled the source package and checked for Oracle errors:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003edocker compose exec -T oracle \\\n  sqlplus -s / as sysdba \u0026lt;\u0026lt;'SQL'\nalter session set container=FREEPDB1;\nalter package SOE.ORDERENTRY compile;\nalter package SOE.ORDERENTRY compile body;\nshow errors package body SOE.ORDERENTRY\nSQL\n\u003c/LI-CODE\u003e\n\u003cP\u003eI then tested the environment to be migrated by running the original Swingbench application for one minute:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003edocker compose exec -it swingbench charbench \\\n  -cs //oracle:1521/FREEPDB1 \\\n  -dbau system -dbap '\u0026lt;oracle-system-password\u0026gt;' \\\n  -u soe -p '\u0026lt;soe-password\u0026gt;' \\\n  -rt 00:01:00 -c ../configs/SOE_Server_Side_V2.xml\n\u003c/LI-CODE\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/02-swingbench-charbench-baseline-workload.png\" alt=\"Swingbench charbench baseline workload running with four users\" /\u003e\u003c/P\u003e\n\u003cH2\u003e2. Prepare VS Code, HorizonDB, and Foundry\u003c/H2\u003e\n\u003cP\u003eI installed \u003cA href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\"\u003eVS Code\u003c/A\u003e and the \u003cA href=\"https://marketplace.visualstudio.com/items?itemName=ms-ossdata.vscode-pgsql\" target=\"_blank\" rel=\"noopener\"\u003ePostgreSQL extension for Visual Studio Code, authored by Microsoft\u003c/A\u003e. The migration workflow is exposed under \u003cSTRONG\u003eMigrations (Preview)\u003c/STRONG\u003e in the PostgreSQL view:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/03-vscode-postgresql-migrations-create-project.png\" alt=\"PostgreSQL extension Migrations view with Create Migration Project\" /\u003e\u003c/P\u003e\n\u003cP\u003eI opened \u003cSTRONG\u003eMigrations (Preview)\u003c/STRONG\u003e and created a project.\u003c/P\u003e\n\u003cP\u003eThe first step was to name the migration project. I generated all screenshots while reviewing this article and replaying the walkthrough, so the project identifier for this run was \u003cCODE\u003ewalkthrough-validation\u003c/CODE\u003e:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/04-new-oracle-postgresql-migration-project.png\" alt=\"New Oracle to Azure Database for PostgreSQL migration project\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe second step was to connect to the source Oracle Database as a user with the DBA role and select the schema:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/05-oracle-source-connection.png\" alt=\"Connect to Oracle\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe third step was to define the destination PostgreSQL database:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/06-postgresql-scratch-database-selection.png\" alt=\"Choose an Azure Database for PostgreSQL scratch database\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe migration tool executes generated DDL there, so this must not be an application or production database.\u003c/P\u003e\n\u003cP\u003eAt the time of this test, the migration workflow expected an Azure PostgreSQL connection for compilation, either Flexible Server or HorizonDB. I used an \u003cA href=\"https://azure.microsoft.com/en-us/products/horizondb\" target=\"_blank\" rel=\"noopener\"\u003eAzure HorizonDB (preview)\u003c/A\u003e database as a dedicated scratch target. This was an exploratory use of the preview workflow, not a statement of official HorizonDB support. The generated code targets PostgreSQL rather than HorizonDB-specific APIs; portability to another PostgreSQL deployment still depends on its PostgreSQL version, available features, and managed-service restrictions.\u003c/P\u003e\n\u003cP\u003eI created the database service beforehand from VS Code:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/07-vscode-create-postgresql-server-connection.png\" alt=\"Create a PostgreSQL server connection\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe conversion also needed a Microsoft Foundry resource and a deployed model. I created the resource, opened Foundry, deployed \u003cCODE\u003egpt-5.2\u003c/CODE\u003e, and recorded the resource endpoint and deployment name.\u003c/P\u003e\n\u003cP\u003eI created the resource from the Azure portal:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/08-azure-openai-resource-creation.png\" alt=\"Create an Azure OpenAI resource\" /\u003e\u003c/P\u003e\n\u003cP\u003eI noted its endpoint and key:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/09-azure-openai-keys-endpoint.png\" alt=\"Keys and endpoint\" /\u003e\u003c/P\u003e\n\u003cP\u003eFrom VS Code, I opened the Foundry portal:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/10-open-microsoft-foundry-portal.png\" alt=\"Open the Foundry portal\" /\u003e\u003c/P\u003e\n\u003cP\u003eI selected GPT-5.2:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/11-select-gpt-5-2-model.png\" alt=\"Select GPT-5.2\" /\u003e\u003c/P\u003e\n\u003cP\u003eI chose to use the selected model:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/12-use-selected-foundry-model.png\" alt=\"Use the selected model\" /\u003e\u003c/P\u003e\n\u003cP\u003eI deployed the model (I used the model name as the deployment name here):\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/13-deploy-foundry-model.png\" alt=\"Deploy the model\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe fourth configuration step was to select the model deployment using its name, endpoint, and API key:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/14-select-foundry-model-deployment.png\" alt=\"Choose a Microsoft Foundry Model\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe migration project was created: \u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/15-migration-project-dashboard.png\" alt=\"Migration project dashboard before schema migration\" /\u003e\u003c/P\u003e\n\u003cP\u003eAll files, configuration, logs, and reports were stored under \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation\" target=\"_blank\" rel=\"noopener\"\u003e.github/postgres-migrations\u003c/A\u003e.\u003c/P\u003e\n\u003cH2\u003e3. Run the migration project\u003c/H2\u003e\n\u003cP\u003eThe migration workflow extracted Oracle metadata, created a dependency graph, divided the objects into dependency-aware chunks, converted each chunk, reviewed the generated SQL, compiled it against PostgreSQL, and assembled deployment artifacts.\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/16-migration-pipeline-stage-details.png\" alt=\"Migration pipeline stages from extraction through deployment\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe process resembles a compiler pipeline more than a text translator:\u003c/P\u003e\n\u003cLI-IMAGE id=\"iarRZY\" caption=\"false\" alt=\"\" align=\"center\" resized=\"false\" size=\"default\" layout=\"stretch\" name=\"\" src=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTQ0NzI4LWlhclJaWQ?image-dimensions=750x750\u0026amp;revision=3\"\u003e\u003c/LI-IMAGE\u003e\n\u003cP\u003eIt started by extracting the metadata into\u0026nbsp;\u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/extract/ddl/SOE\" target=\"_blank\" rel=\"noopener\"\u003eartifacts/oracle/SOE/extract/ddl\u003c/A\u003e:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/17-oracle-schema-extraction-progress.png\" alt=\"Schema extraction progress for the SOE ORDERENTRY package\" /\u003e\u003c/P\u003e\n\u003cP\u003eA \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/extract/reports/oracle_extraction_report.md\" target=\"_blank\" rel=\"noopener\"\u003ereport\u003c/A\u003e provides all details when completed:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/18-oracle-extraction-report.png\" alt=\"Oracle extraction report showing 42 extracted objects\" /\u003e\u003c/P\u003e\n\u003cP\u003eIt then started the conversion, one chunk at a time:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/19-schema-conversion-progress.png\" alt=\"Schema conversion progress after extraction completed\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/internal/logs/conversion.log\" target=\"_blank\" rel=\"noopener\"\u003econversion log\u003c/A\u003e shows the cycle of conversion, compilation, review, test, and validation using the LLM.\u003c/P\u003e\n\u003cP\u003eHere is an example showing the level of detail the log provides:\u003c/P\u003e\n\u003cLI-CODE lang=\"sql\"\u003e16:50:16 [INFO] ossdbtoolsservice.conversion_v2.pipeline.chunk_converter.package_converter: Package ORDERENTRY: member processOrders -\u0026gt; converted in 80.0s (tokens=5232, notes=Oracle ROWNUM \u0026lt; 10 translated to LIMIT 9 (no ORDER BY in source, so row choice remains arbitrary).; Oracle (+) outer joi)\n\u003c/LI-CODE\u003e\n\u003cP\u003eThis is a good example because it goes beyond syntax, where \u003cCODE\u003eROWNUM \u0026lt; 10\u003c/CODE\u003e translates to \u003cCODE\u003eLIMIT 9\u003c/CODE\u003e. It warns that a \u003cCODE\u003eLIMIT\u003c/CODE\u003e without \u003cCODE\u003eORDER BY\u003c/CODE\u003e has a nondeterministic result that can differ between Oracle and PostgreSQL. Applications should not rely on physical row order, but a migration must still consider behavior validated by years of production use, even when that behavior originated as a side effect of an application bug.\u003c/P\u003e\n\u003cP\u003eThe PostgreSQL DDL goes into \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/postgres_ddl\" target=\"_blank\" rel=\"noopener\"\u003eartifacts/oracle/SOE/convert/sessions\u003c/A\u003e.\u003c/P\u003e\n\u003cP\u003eA \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/reports\" target=\"_blank\" rel=\"noopener\"\u003ereport\u003c/A\u003e provides all details:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/20-conversion-report-object-types.png\" alt=\"Conversion report by object type with no failed objects\" /\u003e\u003c/P\u003e\n\u003cP\u003eSimple objects can follow deterministic paths, while complex PL/SQL receives model-assisted conversion and review. PostgreSQL compilation, rather than the model, is intended to be the final syntax and dependency check. Once the migration is complete, it lists the review tasks. The counts and classifications shown here are observations from version 1.27.3 of an evolving preview workflow. Future versions may present fewer review tasks as their focus evolves in response to feedback, including a stronger emphasis on syntax and conversion completeness:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/21-migration-complete-review-tasks.png\" alt=\"Completed migration and pending schema review tasks\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe summary also lists extensions that should be installed in the target database:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/22-required-postgresql-extensions.png\" alt=\"Required PostgreSQL extensions\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe \u003cA href=\"https://github.com/orafce/orafce\" target=\"_blank\" rel=\"noopener\"\u003eorafce\u003c/A\u003e extension implements many functions familiar to Oracle users, including functions from Oracle DBMS packages. It can reduce the amount of code that must change during a migration. Extensions such as \u003cCODE\u003eorafce\u003c/CODE\u003e and \u003cCODE\u003eplpgsql_check\u003c/CODE\u003e can improve conversion and validation when they are available. For this experiment, however, I deliberately used a vanilla PostgreSQL target without them. I wanted to see what the workflow could produce without tying the converted application to extensions that may not be available from every managed PostgreSQL service. This makes portability a design goal of the prototype, not a claim that every PostgreSQL deployment is identical or that omitting extensions always produces the most accurate conversion.\u003c/P\u003e\n\u003cP\u003eBefore proceeding to the manual review, I inspected the fresh conversion log to separate what the pipeline had repaired automatically from what it had only flagged for attention.\u003c/P\u003e\n\u003cH2\u003e4. What the migration workflow corrected, and what it could not prove\u003c/H2\u003e\n\u003cP\u003eI used GitHub Copilot to parse the \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/internal/logs/conversion.log\" target=\"_blank\" rel=\"noopener\"\u003econversion log\u003c/A\u003e and distinguish initial conversion, model review, compiler-driven repair, and warnings left for application review. The analysis found 37 automatic correction events: 33 during the second-pass review and four after PostgreSQL rejected generated SQL during compilation. The run finished with zero failed objects and zero fallback objects.\u003c/P\u003e\n\u003cP\u003eThe second-pass reviewer corrected 20 of the 35 generated package artifacts. The interesting changes included:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003eguarding \u003cCODE\u003ecurrent_setting()\u003c/CODE\u003e results against missing or empty values before casting them\u003c/LI\u003e\n\u003cLI\u003echanging the DML counter helpers from transaction-local to session-level GUC writes so their state can survive a commit on the same connection\u003c/LI\u003e\n\u003cLI\u003ereplacing invalid Oracle \u003cCODE\u003e%TYPE\u003c/CODE\u003e references in PostgreSQL signatures and expressions\u003c/LI\u003e\n\u003cLI\u003ereplacing invalid \u003cCODE\u003ePERFORM * FROM\u003c/CODE\u003e and Oracle cursor syntax\u003c/LI\u003e\n\u003cLI\u003eschema-qualifying table references and limiting a \u003cCODE\u003eSELECT INTO\u003c/CODE\u003e that could otherwise return multiple rows\u003c/LI\u003e\n\u003cLI\u003erepairing an incomplete generated type-creation block\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eThese were code changes, not only warnings. This is where model-assisted conversion goes beyond a fixed syntax rulebook: it reviews generated code in context and revises interactions between types, state, queries, and control flow. PostgreSQL compilation then found four remaining defects. The repair loop removed unsupported \u003cCODE\u003eDEFERRABLE\u003c/CODE\u003e clauses from two check constraints and repaired two routines before recompiling them. This is an important distinction: model review can anticipate defects, while the target database provides the exact SQLSTATE and failing statement. The pipeline then fixes and retries, much like a developer working until the code compiles.\u003c/P\u003e\n\u003cP\u003eChunking did not leave dependencies to the user. When a referenced table, index, or routine was produced by another chunk, the pipeline deferred the dependent operation and retried it after the required object existed. All such operations completed automatically in this run.\u003c/P\u003e\n\u003cH3\u003eStructural translations\u003c/H3\u003e\n\u003cP\u003eThe conversion itself also made deliberate structural changes that were not compiler repairs:\u003c/P\u003e\n\u003cDIV class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"\u003e\u003cLI-TABLE border=\"1\"\u003e\u003cLI-TSECTION name=\"thead\"\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"th\"\u003eOracle behavior\u003c/LI-TD\u003e\u003cLI-TD name=\"th\"\u003ePostgreSQL translation\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003c/LI-TSECTION\u003e\u003cLI-TSECTION name=\"tbody\"\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePackage members\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eSchema routines named \u003cCODE\u003eorderentry$\u0026lt;member\u0026gt;\u003c/CODE\u003e (PostgreSQL has no packages)\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePackage records and collections\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eComposite types, array domains, and set-returning functions\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePackage variables\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eCustom settings accessed through \u003cCODE\u003eset_config()\u003c/CODE\u003e and \u003cCODE\u003ecurrent_setting()\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eDBMS_RANDOM.VALUE\u003c/CODE\u003e\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003erandom()\u003c/CODE\u003e with range arithmetic (without the \u003cCODE\u003eDBMS_RANDOM\u003c/CODE\u003e emulation provided by \u003cCODE\u003eorafce\u003c/CODE\u003e)\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eDBMS_LOCK.SLEEP\u003c/CODE\u003e\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003epg_sleep()\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eDBMS_APPLICATION_INFO\u003c/CODE\u003e\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eapplication_name\u003c/CODE\u003e or custom settings\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eBULK COLLECT\u003c/CODE\u003e\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eRETURNS TABLE\u003c/CODE\u003e, \u003cCODE\u003eSETOF\u003c/CODE\u003e, or \u003cCODE\u003eRETURN QUERY\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eROWNUM \u0026lt; n\u003c/CODE\u003e\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eLIMIT n - 1\u003c/CODE\u003e or \u003cCODE\u003erow_number()\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eCONNECT BY\u003c/CODE\u003e row generation\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eRecursive CTE\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eFORALL\u003c/CODE\u003e inventory updates\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eRow-by-row PL/pgSQL loop (PostgreSQL runs PL and SQL in the same engine)\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eSYSDATE\u003c/CODE\u003e and \u003cCODE\u003eSYSTIMESTAMP\u003c/CODE\u003e\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003e\u003cCODE\u003eCURRENT_TIMESTAMP\u003c/CODE\u003e, \u003cCODE\u003eclock_timestamp()\u003c/CODE\u003e, and \u003cCODE\u003edate_trunc()\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePackage procedures\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003eFunctions returning \u003cCODE\u003evoid\u003c/CODE\u003e\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003cLI-TR\u003e\u003cLI-TD name=\"td\"\u003ePackage overloads\u003c/LI-TD\u003e\u003cLI-TD name=\"td\"\u003ePostgreSQL overloads with the same flattened name\u003c/LI-TD\u003e\u003c/LI-TR\u003e\u003c/LI-TSECTION\u003e\u003cLI-TCOLS cols=\"50.00%,50.00%\"\u003e\u003c/LI-TCOLS\u003e\u003c/LI-TABLE\u003e\u003c/DIV\u003e\n\u003cH3\u003eWhat still requires attention\u003c/H3\u003e\n\u003cP\u003eSuccessful compilation proves syntax and dependency consistency, not behavioral equivalence. The fresh review report classifies 34 of 78 objects as auto-approved and leaves 44 non-blocking behavioral divergences for application review. The most important are:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003eOracle \u003cCODE\u003eENABLE NOVALIDATE\u003c/CODE\u003e primary keys do not validate existing rows, while PostgreSQL primary-key creation does. Eight tables therefore require clean source data before deployment.\u003c/LI\u003e\n\u003cLI\u003eFive Oracle reverse-key indexes became normal PostgreSQL btree indexes, which can change insertion hot spots and access behavior.\u003c/LI\u003e\n\u003cLI\u003ePackage state is stored as text in custom GUCs. Although the reviewer changed the counter helpers to session-level writes, the emitted routines still use different key prefixes and a mixture of session-level and transaction-local settings. Initialization, pooling, commits, and casts need runtime tests.\u003c/LI\u003e\n\u003cLI\u003ePostgreSQL functions cannot reproduce Oracle package-side \u003cCODE\u003eCOMMIT\u003c/CODE\u003e. The caller must own transaction boundaries.\u003c/LI\u003e\n\u003cLI\u003e\u003cCODE\u003eROWNUM\u003c/CODE\u003e conversions without \u003cCODE\u003eORDER BY\u003c/CODE\u003e preserve nondeterministic selection, but they do not guarantee that Oracle and PostgreSQL choose the same rows.\u003c/LI\u003e\n\u003cLI\u003e\u003cCODE\u003eBULK COLLECT\u003c/CODE\u003e collections became row sets, and \u003cCODE\u003eFORALL\u003c/CODE\u003e became a loop. Empty collection behavior, ordering, locking, and performance can differ.\u003c/LI\u003e\n\u003cLI\u003eRandom-number boundaries, numeric casts, exception behavior, and \u003cCODE\u003eSYSDATE\u003c/CODE\u003e/\u003cCODE\u003eSYSTIMESTAMP\u003c/CODE\u003e timing and timezone semantics remain database-specific.\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eNone of these 44 findings blocked deployment in this run. They define the work for the runtime validation in the following sections rather than automatic fixes that the migration report can prove.\u003c/P\u003e\n\u003cH2\u003e5. Examples from the generated \u003cCODE\u003eORDERENTRY\u003c/CODE\u003e package\u003c/H2\u003e\n\u003cP\u003eThe package conversion shows why this is more than syntax replacement. The pipeline emitted all 34 executable package-body members, including private helpers, and represented Oracle procedures as PostgreSQL functions returning \u003cCODE\u003evoid\u003c/CODE\u003e. Because PostgreSQL has no equivalent of package visibility, every member became a schema routine named \u003cCODE\u003eorderentry$\u0026lt;member\u0026gt;\u003c/CODE\u003e. Applications should keep calling only the former public API, with privileges used to preserve the old visibility boundary.\u003c/P\u003e\n\u003cP\u003eThe harder transformations preserved the shape of the business logic without pretending that Oracle and PostgreSQL use the same programming model. For example, \u003cCODE\u003eBULK COLLECT\u003c/CODE\u003e collections became set-returning functions. Indexed collection access became operations over those row sets. The \u003cCODE\u003eFORALL\u003c/CODE\u003e inventory update in \u003cCODE\u003eorderentry$neworder\u003c/CODE\u003e became a PL/pgSQL loop, and the \u003cCODE\u003eCONNECT BY\u003c/CODE\u003e row generator used for warehouse activity became a recursive CTE. Package helpers using \u003cCODE\u003eDBMS_RANDOM\u003c/CODE\u003e, \u003cCODE\u003eDBMS_LOCK.SLEEP\u003c/CODE\u003e, and \u003cCODE\u003eDBMS_APPLICATION_INFO\u003c/CODE\u003e became calls to \u003cCODE\u003erandom()\u003c/CODE\u003e, \u003cCODE\u003epg_sleep()\u003c/CODE\u003e, and PostgreSQL settings.\u003c/P\u003e\n\u003cH3\u003eA small conversion with a large consequence\u003c/H3\u003e\n\u003cP\u003eI verified that \u003cCODE\u003efrom_mills_to_secs\u003c/CODE\u003e was already a private Oracle function rather than a helper invented during migration:\u003c/P\u003e\n\u003cLI-CODE lang=\"sql\"\u003efunction from_mills_to_secs(value integer) return float is\n  real_value float := 0;\nbegin\n  real_value := value/1000;\n  return real_value;\nexception\n  when zero_divide then\n    real_value := 0;\n    return real_value;\nend from_mills_to_secs;\n\u003c/LI-CODE\u003e\n\u003cP\u003eDespite the shortened name, “mills” means milliseconds here. The \u003cCODE\u003eZERO_DIVIDE\u003c/CODE\u003e branch is defensive but cannot normally be reached because the divisor is the constant 1000.\u003c/P\u003e\n\u003cP\u003eI compared it with the generated PostgreSQL function, which keeps the operation but explicitly converts to floating point to avoid integer division:\u003c/P\u003e\n\u003cLI-CODE lang=\"sql\"\u003eCREATE OR REPLACE FUNCTION soe.orderentry$from_mills_to_secs(value integer)\nRETURNS double precision\nLANGUAGE plpgsql\nIMMUTABLE\nAS $$\nDECLARE\n  real_value double precision := 0;\nBEGIN\n  real_value := value::double precision / 1000.0;\n  RETURN real_value;\nEXCEPTION\n  WHEN division_by_zero THEN\n    real_value := 0;\n    RETURN real_value;\nEND;\n$$;\n\u003c/LI-CODE\u003e\n\u003cP\u003e\u003cCODE\u003eorderentry$sleep\u003c/CODE\u003e calls this helper for the fixed or randomly selected delay, maps \u003cCODE\u003eDBMS_LOCK.SLEEP\u003c/CODE\u003e to \u003cCODE\u003epg_sleep\u003c/CODE\u003e, and updates a package counter. Here the review found a subtle semantic issue: the generated helper calculates elapsed milliseconds but adds the selected delay in seconds to the counter. The supplied workload uses zero delays, so it did not affect this run. With nonzero delays, the code could compile and execute while returning the wrong value. This is the kind of small conversion detail that is easy to miss and appears much later as an application error.\u003c/P\u003e\n\u003cH3\u003eTransaction control changes ownership\u003c/H3\u003e\n\u003cP\u003eThe largest architectural difference is transaction control. In Oracle Database, \u003cCODE\u003eoecommit\u003c/CODE\u003e can issue \u003cCODE\u003eCOMMIT\u003c/CODE\u003e from inside the package when the session-level \u003cCODE\u003ePLSQLCOMMIT\u003c/CODE\u003e flag is true. The package therefore decides when its changes become durable and increments its own commit counter at that point.\u003c/P\u003e\n\u003cP\u003eThe converter represented the package procedures as PostgreSQL functions to preserve their callable API, but a PostgreSQL function cannot commit or roll back its surrounding transaction. The generated \u003cCODE\u003eoecommit\u003c/CODE\u003e can preserve the instrumentation, not the transaction boundary. PostgreSQL procedures invoked with \u003cCODE\u003eCALL\u003c/CODE\u003e can perform transaction control in specific contexts, but changing these package entry points into procedures would also change how the application calls them and how return values are handled.\u003c/P\u003e\n\u003cP\u003eFor this migration, I chose to disable package-side commits. The Python driver calls \u003cCODE\u003eorderentry$setplsqlcommit('false')\u003c/CODE\u003e, commits each successful mutating call, and rolls back a failed call. Transaction ownership therefore moved from the stored package to the application. That is an intentional adaptation, not an equivalent syntax translation. Multi-call atomicity, retries, error handling, and connection-pool behavior must be reviewed with that new boundary in mind.\u003c/P\u003e\n\u003cH2\u003e6. Copy the reference data separately\u003c/H2\u003e\n\u003cP\u003eWithout leaving VS Code, I first checked the migrated schema, including its tables, views, and converted \u003cCODE\u003eORDERENTRY\u003c/CODE\u003e routines:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/23-migrated-soe-schema-routines.png\" alt=\"Migrated SOE schema and ORDERENTRY routines in VS Code\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe migration extension converted the schema and code but did not copy the Swingbench data. For this small, specific task, it was faster to guide GitHub Copilot to generate a Python program than to switch to another migration tool. The script stayed in the repository with the connection setup and commands, making the copy reproducible and documented rather than a one-time manual operation.\u003c/P\u003e\n\u003cP\u003eI installed its dependencies (Python 3.10 or later required) and exposed connection information through environment variables rather than embedding credentials:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003epython3 -m pip install -r scripts-postgres/requirements.txt\n\nexport ORACLE_DSN='localhost:1521/FREEPDB1'\nexport ORACLE_USER='soe'\nexport ORACLE_PASSWORD='\u0026lt;soe-password\u0026gt;'\nexport PG_DSN='host=\u0026lt;host\u0026gt; port=5432 dbname=\u0026lt;db\u0026gt; user=\u0026lt;user\u0026gt; sslmode=require'\nexport PG_SCHEMA='_mig_scratch_soe'\n\u003c/LI-CODE\u003e\n\u003cP\u003eThe \u003cCODE\u003ePG_SCHEMA\u003c/CODE\u003e variable names the PostgreSQL schema created by the migration extension during validation. The scripts set \u003cCODE\u003esearch_path\u003c/CODE\u003e to this schema automatically before executing any SQL.\u003c/P\u003e\n\u003cP\u003eI ran a clean copy with:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003ebash scripts-postgres/copy_soe_data.sh --truncate\n\u003c/LI-CODE\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/24-copy-soe-data-progress.png\" alt=\"Copying SOE table data from Oracle to PostgreSQL\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe program uses dependency order and PostgreSQL binary \u003cCODE\u003eCOPY\u003c/CODE\u003e. It also handles Oracle intervals and numeric values, preserves the intent of \u003cCODE\u003eENABLE NOVALIDATE\u003c/CODE\u003e checks, and advances the PostgreSQL sequences after loading.\u003c/P\u003e\n\u003cP\u003eI then verified that the Oracle and PostgreSQL row counts matched:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/25-oracle-postgresql-row-counts.png\" alt=\"Oracle and PostgreSQL workload table row-count comparison\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe complete implementation is available in \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/copy_soe_data.py\" target=\"_blank\" rel=\"noopener\"\u003ecopy_soe_data.py\u003c/A\u003e.\u003c/P\u003e\n\u003cH2\u003e7. Recover and reproduce the Swingbench workload\u003c/H2\u003e\n\u003cP\u003eSwingbench is a free load generator, but it is not open source. It is distributed as compiled Java, so porting its client to PostgreSQL was neither practical nor the goal. For this server-side workload, the business logic is in the \u003cCODE\u003eSOE.ORDERENTRY\u003c/CODE\u003e package. The Java client primarily chooses transactions, generates parameters, and calls the package.\u003c/P\u003e\n\u003cP\u003eCalling the migrated routines with arbitrary values would test invocation, but not the real workload. I guided GitHub Copilot to inspect the files in the Swingbench container. The XML configuration provided the enabled transactions, weights, user count, delays, and timeout. I used \u003cCODE\u003ejavap\u003c/CODE\u003e to confirm the externally observable call signatures and runtime behavior needed to build a compatible validation workload. GitHub Copilot documented those findings under my direction in \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/swingbench_calls.md\" target=\"_blank\" rel=\"noopener\"\u003escripts-postgres/swingbench_calls.md\u003c/A\u003e.\u003c/P\u003e\n\u003cP\u003eI then guided GitHub Copilot to create \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/run_swingbench_workload.py\" target=\"_blank\" rel=\"noopener\"\u003erun_swingbench_workload.py\u003c/A\u003e. It follows the same weighted transaction selection with four persistent user connections, a start barrier, copied customer data, and the configured timeout. It reports throughput, latency, and errors without trying to reproduce the Swingbench GUI or Oracle-specific connection pool.\u003c/P\u003e\n\u003cP\u003eAs described in Section 5, transaction ownership had to change. The driver disables package-side commits, commits successful mutating calls through Psycopg, and rolls back failed calls. I ran it with:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003eexport PG_DSN='host=\u0026lt;host\u0026gt; port=5432 dbname=\u0026lt;db\u0026gt; user=\u0026lt;user\u0026gt; sslmode=require'\nexport PG_SCHEMA='_mig_scratch_soe'\n\nbash scripts-postgres/run_swingbench_workload.sh --duration 300\n\u003c/LI-CODE\u003e\n\u003cP\u003eBefore creating load, the program verifies that the public workload API is complete. It exits early rather than report misleading performance results for an incomplete deployment.\u003c/P\u003e\n\u003cH2\u003e8. Validate in layers\u003c/H2\u003e\n\u003cP\u003eValidation is part of the migration, not a final smoke test. Compilation proves that PostgreSQL accepts the generated objects, but not that they return the right results or preserve business effects. I directed GitHub Copilot to build four validation layers so each failure could be isolated before adding more workload complexity.\u003c/P\u003e\n\u003cH3\u003eLayer 1: catalog and query validation\u003c/H3\u003e\n\u003cP\u003eThe \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/run_orderentry_tests.py\" target=\"_blank\" rel=\"noopener\"\u003erollback-safe test harness\u003c/A\u003e begins with a preflight that checks the PostgreSQL version, required tables, five sequences, and all public workload routines. It also submits the two analytical queries to PostgreSQL with \u003cCODE\u003eEXPLAIN\u003c/CODE\u003e before proceeding to routine calls. I separately ran those \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/test-some-queries.sql\" target=\"_blank\" rel=\"noopener\"\u003etwo analytical queries\u003c/A\u003e with \u003cCODE\u003eEXPLAIN ANALYZE\u003c/CODE\u003e against 106,583 customers, 160,684 orders, and 482,752 order items. Both executed successfully.\u003c/P\u003e\n\u003cP\u003eThe top-customer query completed in 424 ms. Its sequential scans were reasonable because it consumed almost all orders and items, although the aggregate spilled to temporary disk:\u003c/P\u003e\n\u003cLI-CODE lang=\"text\"\u003eSort (actual time=423.274..423.277 rows=20 loops=1)\n  Sort Key: (rank() OVER (?))\n  Sort Method: quicksort  Memory: 26kB\n  Buffers: shared hit=11220, temp read=1792 written=1953\n  -\u0026gt; WindowAgg (actual time=423.242..423.255 rows=20 loops=1)\n    Run Condition: (rank() OVER (?) \u0026lt;= 20)\n    -\u0026gt; Sort (actual time=423.236..423.240 rows=21 loops=1)\n      Sort Key: sum(oi.quantity * oi.unit_price) DESC\n      Sort Method: quicksort  Memory: 1929kB\n      -\u0026gt; HashAggregate (actual time=402.740..415.533 rows=24968 loops=1)\n        Group Key: c.customer_id\n        Batches: 9  Memory Usage: 8273kB  Disk Usage: 1480kB\n        -\u0026gt; Hash Join (actual time=60.363..279.582 rows=482718 loops=1)\n          Hash Cond: (o.customer_id = c.customer_id)\n          -\u0026gt; Hash Join (actual time=34.192..176.799 rows=482752 loops=1)\n            Hash Cond: (oi.order_id = o.order_id)\n            -\u0026gt; Seq Scan on order_items oi (rows=482752 loops=1)\n            -\u0026gt; Hash\n              -\u0026gt; Seq Scan on orders o (rows=160684 loops=1)\n          -\u0026gt; Hash\n            -\u0026gt; Seq Scan on customers c (rows=106583 loops=1)\nPlanning Time: 0.742 ms\nExecution Time: 423.895 ms\n\u003c/LI-CODE\u003e\n\u003cP\u003eVS Code with the PostgreSQL extension can visualize the plan, including buffers read by each node and the flow of rows between nodes: \u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/26-top-customers-graphical-plan.png\" alt=\"PostgreSQL graphical plan for the top-customers query\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe monthly revenue query completed in 627 ms. Its aggregate spilled into 33 batches before two in-memory window sorts, making \u003cCODE\u003ework_mem\u003c/CODE\u003e the first tuning candidate rather than an index:\u003c/P\u003e\n\u003cLI-CODE lang=\"text\"\u003eWindowAgg (actual time=615.702..626.031 rows=27472 loops=1)\n  Buffers: shared hit=11211, temp read=1965 written=2208\n  -\u0026gt; Sort (actual time=615.698..617.253 rows=27472 loops=1)\n    Sort Key: customer_sales.customer_id, customer_sales.month_start\n    Sort Method: quicksort  Memory: 2352kB\n    -\u0026gt; WindowAgg (actual time=600.739..610.404 rows=27472 loops=1)\n      -\u0026gt; Sort (actual time=600.708..602.149 rows=27472 loops=1)\n        Sort Key: customer_sales.month_start, customer_sales.revenue\n        Sort Method: quicksort  Memory: 2137kB\n        -\u0026gt; Subquery Scan on customer_sales\n          (actual time=570.611..587.861 rows=27472 loops=1)\n          -\u0026gt; HashAggregate\n            (actual time=570.610..586.090 rows=27472 loops=1)\n            Group Key: c.customer_id,\n                 date_trunc('month', o.order_date)\n            Batches: 33  Memory Usage: 8209kB  Disk Usage: 2040kB\n            -\u0026gt; Hash Join\n              (actual time=54.823..392.870 rows=482718 loops=1)\n              Hash Cond: (o.customer_id = c.customer_id)\n              -\u0026gt; Hash Join\n                (actual time=31.672..208.840 rows=482752 loops=1)\n                Hash Cond: (oi.order_id = o.order_id)\n                -\u0026gt; Seq Scan on order_items oi (rows=482752)\n                -\u0026gt; Hash\n                  -\u0026gt; Seq Scan on orders o (rows=160684)\n              -\u0026gt; Hash\n                -\u0026gt; Seq Scan on customers c (rows=106583)\nPlanning Time: 0.266 ms\nExecution Time: 627.065 ms\n\u003c/LI-CODE\u003e\n\u003cP\u003eThese execution plans establish a PostgreSQL baseline and identify possible tuning work, such as aggregate spills and \u003cCODE\u003ework_mem\u003c/CODE\u003e pressure. I kept those observations for the physical-design review after correctness and concurrent workload validation rather than tuning from isolated queries too early.\u003c/P\u003e\n\u003cH3\u003eLayer 2: call every public workload routine\u003c/H3\u003e\n\u003cP\u003eAfter the preflight, the same harness discovers viable values and calls all nine workload transactions plus \u003cCODE\u003esetPLSQLCOMMIT\u003c/CODE\u003e:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003ebash scripts-postgres/run_orderentry_tests.sh\n\u003c/LI-CODE\u003e\n\u003cP\u003eEach call is isolated and reports its SQLSTATE on failure. The first run exposed defects that compilation could not: composite return types did not match some rows, internal and public customer-ID types differed, package settings lacked defaults, and \u003cCODE\u003enewOrder\u003c/CODE\u003e retained an Oracle \u003cCODE\u003e%TYPE\u003c/CODE\u003e cast. GitHub Copilot generated schema-relative repairs, which I reviewed and applied. The implementation is available in \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/apply_orderentry_runtime_fixes.py\" target=\"_blank\" rel=\"noopener\"\u003eapply_orderentry_runtime_fixes.py\u003c/A\u003e:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003ebash scripts-postgres/apply_orderentry_runtime_fixes.sh\n\u003c/LI-CODE\u003e\n\u003cP\u003eI then ran the harness again, and all ten checks passed.\u003c/P\u003e\n\u003cH3\u003eLayer 3: verify business effects\u003c/H3\u003e\n\u003cP\u003eA successful call does not prove the correct business effect. GitHub Copilot generated a \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/scripts-postgres/run_swingbench_workload.py\" target=\"_blank\" rel=\"noopener\"\u003erollback-safe order workflow\u003c/A\u003e:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003ebash scripts-postgres/run_swingbench_workload.sh --verify-only\n\u003c/LI-CODE\u003e\n\u003cP\u003eIt creates two orders for a copied customer, verifies their fields and item rows, then checks that \u003cCODE\u003ebrowseandupdateorders\u003c/CODE\u003e changes one item quantity and the matching order total together. It rolls back, reconnects, and proves that both orders are absent. Only sequence values may advance because PostgreSQL sequences are nontransactional.\u003c/P\u003e\n\u003cH3\u003eLayer 4: weighted concurrent load\u003c/H3\u003e\n\u003cP\u003eOnly after the first three layers passed did I run concurrent load. Four users executed 287 calls across all nine transaction types with zero errors. This ordering separated migration defects from performance observations and avoided assuming that copied customer IDs were contiguous.\u003c/P\u003e\n\u003cH3\u003eAfter validation: review physical design\u003c/H3\u003e\n\u003cP\u003eAfter validating the migration and ensuring data accuracy, it is time to look at the physical layer, using the execution plans captured in Layer 1 together with observations from the concurrent workload. Oracle and PostgreSQL handle data patterns differently, so blindly copying Oracle optimizations can degrade performance. PostgreSQL's MVCC architecture adds write overhead to updates, so the table \u003cCODE\u003eFILLFACTOR\u003c/CODE\u003e strategy needs a fresh look compared with Oracle's \u003cCODE\u003ePCTFREE\u003c/CODE\u003e. PostgreSQL also provides different tuning options, including partial indexes, specialized index types, and incremental sorting.\u003c/P\u003e\n\u003cH2\u003eReproduce the complete validation\u003c/H2\u003e\n\u003cP\u003eAt the end of my run, the test setup contained:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003eall ten workload tables populated\u003c/LI\u003e\n\u003cLI\u003eall five required sequences deployed and advanced\u003c/LI\u003e\n\u003cLI\u003etwo analytical queries accepted by PostgreSQL under \u003cCODE\u003eEXPLAIN\u003c/CODE\u003e\u003c/LI\u003e\n\u003cLI\u003ea complete invocation harness\u003c/LI\u003e\n\u003cLI\u003ea weighted Swingbench-like concurrent driver\u003c/LI\u003e\n\u003cLI\u003ea rollback-safe semantic order test\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eAfter deploying the converted schema and its \u003cCODE\u003eORDERENTRY\u003c/CODE\u003e routines, I applied the reviewed runtime fixes and ran the checks in increasing order of scope:\u003c/P\u003e\n\u003cLI-CODE lang=\"bash\"\u003ebash scripts-postgres/apply_orderentry_runtime_fixes.sh\nbash scripts-postgres/run_orderentry_tests.sh\nbash scripts-postgres/run_swingbench_workload.sh --verify-only\nbash scripts-postgres/run_swingbench_workload.sh --duration 300\n\u003c/LI-CODE\u003e\n\u003cH2\u003eConclusion\u003c/H2\u003e\n\u003cP\u003eAI did not make this migration a one-click operation. The Oracle application combined packages, private helpers, collections, package state, bulk operations, transaction control, and behavior that only appears under realistic calls. A credible migration had to understand those interactions rather than only produce PostgreSQL syntax.\u003c/P\u003e\n\u003cP\u003eThe useful change is that the migration can be approached as an integrated project from one place. In VS Code, the migration extension converted and compiled the schema. I inspected the generated code and reports, directed GitHub Copilot to generate the supporting data-copy and workload programs, reviewed and applied runtime fixes, and validated data, API calls, business effects, and concurrent load. The model accelerated code conversion and the creation of focused tools, while PostgreSQL, executable tests, and my knowledge of the application provided the evidence.\u003c/P\u003e\n\u003cP\u003eThis is the method I would carry from assessment into a real migration: use AI to drive more of the conversion, diagnosis, repair, and validation iterations, not to hide complexity. Keep source behavior, converted code, data movement, test programs, findings, and fixes together in a reproducible workspace. This makes the first prototype useful evidence for estimating the remaining effort. A migration report measures one pipeline stage; the application is migrated only when its data, transactions, business effects, and workload work together on PostgreSQL.\u003c/P\u003e\n\u003cP\u003eThis validation is necessary but not sufficient for production. A real go-live also requires review of edge cases, collation, NULL handling, error paths, security, and sustained performance under representative data volumes.\u003c/P\u003e\n\u003cP\u003eBecause this walkthrough exercises preview functionality, experience reports are especially valuable. Readers trying it on other Oracle applications or PostgreSQL targets can share what converts well, what requires intervention, and which findings would make the assessment more useful in the \u003cA class=\"lia-external-url\" href=\"https://github.com/Azure-Samples/postgres-hub/discussions\" target=\"_blank\" rel=\"noopener\"\u003ePostgreSQL Hub Developer Forum\u003c/A\u003e\u003c/P\u003e","kudosSumWeight":0,"postTime":"2026-08-13T06:51:14.962-07:00","images":{"__typename":"AssociatedImageConnection","edges":[{"__typename":"AssociatedImageEdge","cursor":"MjYuM3wyLjF8b3wyNXxfTlZffDE","node":{"__ref":"AssociatedImage:{\"url\":\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTQ0NzI4LXBPMGtlNg?revision=3\"}"}},{"__typename":"AssociatedImageEdge","cursor"
