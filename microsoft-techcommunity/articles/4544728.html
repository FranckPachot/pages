he&amp;nbsp;Migrations (Preview) workflow. It is an early evaluation, using the source and target systems I had available, rather than documentation of a supported production configuration. Preview features benefit from concrete tests and feedback: the results below show both what worked and what still needed attention, with the goal of helping the workflow evolve. They should not be read as a product support or roadmap commitment for the specific databases used here.\nThe goal is to evaluate how AI assistance changes the first phases of a migration: assessing the effort, creating a first working prototype, and making the remaining technical gaps visible. This is where an integrated development environment is particularly effective. Source artifacts, generated PostgreSQL code, reports, database connections, tests, findings, and repairs can remain in one reproducible VS Code workspace.\nMigrating a database is not finished when the tables compile. A useful test must also answer three harder questions:\n\nWas the reference data copied correctly?\nWere the application-facing stored routines actually deployed?\nDo those routines produce the same business effects under a realistic load?\n\nThis is particularly important when business logic is embedded in proprietary database constructs such as PL/SQL packages, which are in scope for this migration. Swingbench Order Entry is a good example. It has two versions: one uses pure JDBC, with the business logic in Java, and the other places the logic in a PL/SQL package that uses advanced Oracle Database features. The server-side version illustrates the migration challenges found in many critical legacy applications.\nIn this article, I walk through those questions using Swingbench&apos;s Sales Order Entry (SOE) schema. I ran Oracle Database and Swingbench in Docker containers and used the PostgreSQL extension for Visual Studio Code to convert the schema against an Azure HorizonDB (preview) scratch database. I then used GitHub Copilot to build the data-copy, workload-emulation, and validation programs needed to test PostgreSQL.\nThis article follows the migration end to end. Readers can use individual sections independently, but I keep the complete sequence because each stage exposed issues that schema conversion alone could not reveal.\nThroughout this project, I made the architectural decisions, directed the investigation, and validated results. The migration extension performed the model-assisted schema and PL/SQL conversion, while GitHub Copilot generated supporting code and tests under my direction. PostgreSQL compilation and the executable tests provided the evidence. Instead of replacing deterministic extraction, dependency analysis, and type mappings, AI participated in the iterations that traditionally follow them: contextual translation, review, diagnosis, repair, and validation. GitHub Copilot also produced the first draft of this article, which I reviewed and refined so it accurately describes what I ran, observed, and concluded.\nWhat was migrated\nSwingbench SOE is a compact but realistic migration target. It includes:\n\ncustomers, addresses, cards, products, inventory, orders, and order items\nprimary keys, foreign keys, checks, indexes, and sequences\nviews and analytical queries\nthe Oracle SOE.ORDERENTRY PL/SQL package used by Swingbench, with all the application logic, leaving only the presentation layer to the frontend\npackage state, collection types, helper routines, random choices, sleeps, transaction control, and business transactions\n\nThe test environment was:\nComponentVersion or imageOracle Database 26aigvenzl/oracle-free:slim (23.26.2)Swingbenchdomgiles/swingbench:latest (2.6.1118)PostgreSQLAzure HorizonDB (PostgreSQL 17.9)PostgreSQL extension for Visual Studio Code1.27.3Foundry modelgpt-5.2\n1. Build the Oracle source environment\nI used the following docker-compose.yaml to start Oracle and keep a Swingbench container available for schema creation and testing:\nservices:\n  oracle:\n    image: gvenzl/oracle-free:slim\n    environment:\n      ORACLE_PASSWORD: &quot;&amp;lt;oracle-system-password&amp;gt;&quot;\n    ports:\n      - &quot;1521:1521&quot;\n    healthcheck:\n      test: [&quot;CMD&quot;, &quot;healthcheck.sh&quot;]\n      interval: 10s\n      timeout: 5s\n      retries: 30\n\n  swingbench:\n    image: domgiles/swingbench:latest\n    platform: linux/amd64\n    depends_on:\n      oracle:\n        condition: service_healthy\n    entrypoint: [&quot;sleep&quot;, &quot;infinity&quot;]\n\nI started both containers with:\ndocker compose up -d\n\nOnce Oracle was healthy, I created a small SOE database with Swingbench&apos;s command-line wizard. I chose scale 0.1: large enough to exercise the relationships while remaining convenient for repeated migrations.\ndocker compose exec swingbench oewizard -cl -create \\\n  -cs //oracle:1521/FREEPDB1 \\\n  -dba &quot;sys as sysdba&quot; -dbap &apos;&amp;lt;oracle-system-password&amp;gt;&apos; \\\n  -df /opt/oracle/oradata/FREE/FREEPDB1/soe01.dbf \\\n  -u soe -p &apos;&quot;&amp;lt;soe-password&amp;gt;&quot;&apos; \\\n  -scale 0.1 -tc 1 -v\n\nSwingbench substitutes the SOE password into CREATE USER ... IDENTIFIED BY. A password containing characters that require Oracle&apos;s quoted-password syntax must be passed with the literal double quotes expected by that SQL statement.\n\nBefore migrating anything, I compiled the source package and checked for Oracle errors:\ndocker compose exec -T oracle \\\n  sqlplus -s / as sysdba &amp;lt;&amp;lt;&apos;SQL&apos;\nalter session set container=FREEPDB1;\nalter package SOE.ORDERENTRY compile;\nalter package SOE.ORDERENTRY compile body;\nshow errors package body SOE.ORDERENTRY\nSQL\n\nI then tested the environment to be migrated by running the original Swingbench application for one minute:\ndocker compose exec -it swingbench charbench \\\n  -cs //oracle:1521/FREEPDB1 \\\n  -dbau system -dbap &apos;&amp;lt;oracle-system-password&amp;gt;&apos; \\\n  -u soe -p &apos;&amp;lt;soe-password&amp;gt;&apos; \\\n  -rt 00:01:00 -c ../configs/SOE_Server_Side_V2.xml\n\n\n2. Prepare VS Code, HorizonDB, and Foundry\nI installed VS Code and the PostgreSQL extension for Visual Studio Code, authored by Microsoft. The migration workflow is exposed under Migrations (Preview) in the PostgreSQL view:\n\nI opened Migrations (Preview) and created a project.\nThe first step was to name the migration project. I generated all screenshots while reviewing this article and replaying the walkthrough, so the project identifier for this run was walkthrough-validation:\n\nThe second step was to connect to the source Oracle Database as a user with the DBA role and select the schema:\n\nThe third step was to define the destination PostgreSQL database:\n\nThe migration tool executes generated DDL there, so this must not be an application or production database.\nAt the time of this test, the migration workflow expected an Azure PostgreSQL connection for compilation, either Flexible Server or HorizonDB. I used an Azure HorizonDB (preview) database as a dedicated scratch target. This was an exploratory use of the preview workflow, not a statement of official HorizonDB support. The generated code targets PostgreSQL rather than HorizonDB-specific APIs; portability to another PostgreSQL deployment still depends on its PostgreSQL version, available features, and managed-service restrictions.\nI created the database service beforehand from VS Code:\n\nThe conversion also needed a Microsoft Foundry resource and a deployed model. I created the resource, opened Foundry, deployed gpt-5.2, and recorded the resource endpoint and deployment name.\nI created the resource from the Azure portal:\n\nI noted its endpoint and key:\n\nFrom VS Code, I opened the Foundry portal:\n\nI selected GPT-5.2:\n\nI chose to use the selected model:\n\nI deployed the model (I used the model name as the deployment name here):\n\nThe fourth configuration step was to select the model deployment using its name, endpoint, and API key:\n\nThe migration project was created: \nAll files, configuration, logs, and reports were stored under .github/postgres-migrations.\n3. Run the migration project\nThe migration workflow extracted Oracle metadata, created a dependency graph, divided the objects into dependency-aware chunks, converted each chunk, reviewed the generated SQL, compiled it against PostgreSQL, and assembled deployment artifacts.\n\nThe process resembles a compiler pipeline more than a text translator:\n\nIt started by extracting the metadata into&amp;nbsp;artifacts/oracle/SOE/extract/ddl:\n\nA report provides all details when completed:\n\nIt then started the conversion, one chunk at a time:\n\nThe conversion log shows the cycle of conversion, compilation, review, test, and validation using the LLM.\nHere is an example showing the level of detail the log provides:\n16:50:16 [INFO] ossdbtoolsservice.conversion_v2.pipeline.chunk_converter.package_converter: Package ORDERENTRY: member processOrders -&amp;gt; converted in 80.0s (tokens=5232, notes=Oracle ROWNUM &amp;lt; 10 translated to LIMIT 9 (no ORDER BY in source, so row choice remains arbitrary).; Oracle (+) outer joi)\n\nThis is a good example because it goes beyond syntax, where ROWNUM &amp;lt; 10 translates to LIMIT 9. It warns that a LIMIT without ORDER BY has a nondeterministic result that can differ between Oracle and PostgreSQL. Applications should not rely on physical row order, but a migration must still consider behavior validated by years of production use, even when that behavior originated as a side effect of an application bug.\nThe PostgreSQL DDL goes into artifacts/oracle/SOE/convert/sessions.\nA report provides all details:\n\nSimple objects can follow deterministic paths, while complex PL/SQL receives model-assisted conversion and review. PostgreSQL compilation, rather than the model, is intended to be the final syntax and dependency check. Once the migration is complete, it lists the review tasks. The counts and classifications shown here are observations from version 1.27.3 of an evolving preview workflow. Future versions may present fewer review tasks as their focus evolves in response to feedback, including a stronger emphasis on syntax and conversion completeness:\n\nThe summary also lists extensions that should be installed in the target database:\n\nThe orafce extension implements many functions familiar to Oracle users, including functions from Oracle DBMS packages. It can reduce the amount of code that must change during a migration. Extensions such as orafce and plpgsql_check can improve conversion and validation when they are available. For this experiment, however, I deliberately used a vanilla PostgreSQL target without them. I wanted to see what the workflow could produce without tying the converted application to extensions that may not be available from every managed PostgreSQL service. This makes portability a design goal of the prototype, not a claim that every PostgreSQL deployment is identical or that omitting extensions always produces the most accurate conversion.\nBefore proceeding to the manual review, I inspected the fresh conversion log to separate what the pipeline had repaired automatically from what it had only flagged for attention.\n4. What the migration workflow corrected, and what it could not prove\nI used GitHub Copilot to parse the conversion log and distinguish initial conversion, model review, compiler-driven repair, and warnings left for application review. The analysis found 37 automatic correction events: 33 during the second-pass review and four after PostgreSQL rejected generated SQL during compilation. The run finished with zero failed objects and zero fallback objects.\nThe second-pass reviewer corrected 20 of the 35 generated package artifacts. The interesting changes included:\n\nguarding current_setting() results against missing or empty values before casting them\nchanging the DML counter helpers from transaction-local to session-level GUC writes so their state can survive a commit on the same connection\nreplacing invalid Oracle %TYPE references in PostgreSQL signatures and expressions\nreplacing invalid PERFORM * FROM and Oracle cursor syntax\nschema-qualifying table references and limiting a SELECT INTO that could otherwise return multiple rows\nrepairing an incomplete generated type-creation block\n\nThese were code changes, not only warnings. This is where model-assisted conversion goes beyond a fixed syntax rulebook: it reviews generated code in context and revises interactions between types, state, queries, and control flow. PostgreSQL compilation then found four remaining defects. The repair loop removed unsupported DEFERRABLE clauses from two check constraints and repaired two routines before recompiling them. This is an important distinction: model review can anticipate defects, while the target database provides the exact SQLSTATE and failing statement. The pipeline then fixes and retries, much like a developer working until the code compiles.\nChunking did not leave dependencies to the user. When a referenced table, index, or routine was produced by another chunk, the pipeline deferred the dependent operation and retried it after the required object existed. All such operations completed automatically in this run.\nStructural translations\nThe conversion itself also made deliberate structural changes that were not compiler repairs:\nOracle behaviorPostgreSQL translationPackage membersSchema routines named orderentry$&amp;lt;member&amp;gt; (PostgreSQL has no packages)Package records and collectionsComposite types, array domains, and set-returning functionsPackage variablesCustom settings accessed through set_config() and current_setting()DBMS_RANDOM.VALUErandom() with range arithmetic (without the DBMS_RANDOM emulation provided by orafce)DBMS_LOCK.SLEEPpg_sleep()DBMS_APPLICATION_INFOapplication_name or custom settingsBULK COLLECTRETURNS TABLE, SETOF, or RETURN QUERYROWNUM &amp;lt; nLIMIT n - 1 or row_number()CONNECT BY row generationRecursive CTEFORALL inventory updatesRow-by-row PL/pgSQL loop (PostgreSQL runs PL and SQL in the same engine)SYSDATE and SYSTIMESTAMPCURRENT_TIMESTAMP, clock_timestamp(), and date_trunc()Package proceduresFunctions returning voidPackage overloadsPostgreSQL overloads with the same flattened name\nWhat still requires attention\nSuccessful compilation proves syntax and dependency consistency, not behavioral equivalence. The fresh review report classifies 34 of 78 objects as auto-approved and leaves 44 non-blocking behavioral divergences for application review. The most important are:\n\nOracle ENABLE NOVALIDATE primary keys do not validate existing rows, while PostgreSQL primary-key creation does. Eight tables therefore require clean source data before deployment.\nFive Oracle reverse-key indexes became normal PostgreSQL btree indexes, which can change insertion hot spots and access behavior.\nPackage state is stored as text in custom GUCs. Although the reviewer changed the counter helpers to session-level writes, the emitted routines still use different key prefixes and a mixture of session-level and transaction-local settings. Initialization, pooling, commits, and casts need runtime tests.\nPostgreSQL functions cannot reproduce Oracle package-side COMMIT. The caller must own transaction boundaries.\nROWNUM conversions without ORDER BY preserve nondeterministic selection, but they do not guarantee that Oracle and PostgreSQL choose the same rows.\nBULK COLLECT collections became row sets, and FORALL became a loop. Empty collection behavior, ordering, locking, and performance can differ.\nRandom-number boundaries, numeric casts, exception behavior, and SYSDATE/SYSTIMESTAMP timing and timezone semantics remain database-specific.\n\nNone of these 44 findings blocked deployment in this run. They define the work for the runtime validation in the following sections rather than automatic fixes that the migration report can prove.\n5. Examples from the generated ORDERENTRY package\nThe package conversion shows why this is more than syntax replacement. The pipeline emitted all 34 executable package-body members, including private helpers, and represented Oracle procedures as PostgreSQL functions returning void. Because PostgreSQL has no equivalent of package visibility, every member became a schema routine named orderentry$&amp;lt;member&amp;gt;. Applications should keep calling only the former public API, with privileges used to preserve the old visibility boundary.\nThe harder transformations preserved the shape of the business logic without pretending that Oracle and PostgreSQL use the same programming model. For example, BULK COLLECT collections became set-returning functions. Indexed collection access became operations over those row sets. The FORALL inventory update in orderentry$neworder became a PL/pgSQL loop, and the CONNECT BY row generator used for warehouse activity became a recursive CTE. Package helpers using DBMS_RANDOM, DBMS_LOCK.SLEEP, and DBMS_APPLICATION_INFO became calls to random(), pg_sleep(), and PostgreSQL settings.\nA small conversion with a large consequence\nI verified that from_mills_to_secs was already a private Oracle function rather than a helper invented during migration:\nfunction from_mills_to_secs(value integer) return float is\n  real_value float := 0;\nbegin\n  real_value := value/1000;\n  return real_value;\nexception\n  when zero_divide then\n    real_value := 0;\n    return real_value;\nend from_mills_to_secs;\n\nDespite the shortened name, “mills” means milliseconds here. The ZERO_DIVIDE branch is defensive but cannot normally be reached because the divisor is the constant 1000.\nI compared it with the generated PostgreSQL function, which keeps the operation but explicitly converts to floating point to avoid integer division:\nCREATE OR REPLACE FUNCTION soe.orderentry$from_mills_to_secs(value integer)\nRETURNS double precision\nLANGUAGE plpgsql\nIMMUTABLE\nAS $$\nDECLARE\n  real_value double precision := 0;\nBEGIN\n  real_value := value::double precision / 1000.0;\n  RETURN real_value;\nEXCEPTION\n  WHEN division_by_zero THEN\n    real_value := 0;\n    RETURN real_value;\nEND;\n$$;\n\norderentry$sleep calls this helper for the fixed or randomly selected delay, maps DBMS_LOCK.SLEEP to pg_sleep, and updates a package counter. Here the review found a subtle semantic issue: the generated helper calculates elapsed milliseconds but adds the selected delay in seconds to the counter. The supplied workload uses zero delays, so it did not affect this run. With nonzero delays, the code could compile and execute while returning the wrong value. This is the kind of small conversion detail that is easy to miss and appears much later as an application error.\nTransaction control changes ownership\nThe largest architectural difference is transaction control. In Oracle Database, oecommit can issue COMMIT from inside the package when the session-level PLSQLCOMMIT flag is true. The package therefore decides when its changes become durable and increments its own commit counter at that point.\nThe converter represented the package procedures as PostgreSQL functions to preserve their callable API, but a PostgreSQL function cannot commit or roll back its surrounding transaction. The generated oecommit can preserve the instrumentation, not the transaction boundary. PostgreSQL procedures invoked with CALL can perform transaction control in specific contexts, but changing these package entry points into procedures would also change how the application calls them and how return values are handled.\nFor this migration, I chose to disable package-side commits. The Python driver calls orderentry$setplsqlcommit(&apos;false&apos;), commits each successful mutating call, and rolls back a failed call. Transaction ownership therefore moved from the stored package to the application. That is an intentional adaptation, not an equivalent syntax translation. Multi-call atomicity, retries, error handling, and connection-pool behavior must be reviewed with that new boundary in mind.\n6. Copy the reference data separately\nWithout leaving VS Code, I first checked the migrated schema, including its tables, views, and converted ORDERENTRY routines:\n\nThe migration extension converted the schema and code but did not copy the Swingbench data. For this small, specific task, it was faster to guide GitHub Copilot to generate a Python program than to switch to another migration tool. The script stayed in the repository with the connection setup and commands, making the copy reproducible and documented rather than a one-time manual operation.\nI installed its dependencies (Python 3.10 or later required) and exposed connection information through environment variables rather than embedding credentials:\npython3 -m pip install -r scripts-postgres/requirements.txt\n\nexport ORACLE_DSN=&apos;localhost:1521/FREEPDB1&apos;\nexport ORACLE_USER=&apos;soe&apos;\nexport ORACLE_PASSWORD=&apos;&amp;lt;soe-password&amp;gt;&apos;\nexport PG_DSN=&apos;host=&amp;lt;host&amp;gt; port=5432 dbname=&amp;lt;db&amp;gt; user=&amp;lt;user&amp;gt; sslmode=require&apos;\nexport PG_SCHEMA=&apos;_mig_scratch_soe&apos;\n\nThe PG_SCHEMA variable names the PostgreSQL schema created by the migration extension during validation. The scripts set search_path to this schema automatically before executing any SQL.\nI ran a clean copy with:\nbash scripts-postgres/copy_soe_data.sh --truncate\n\n\nThe program uses dependency order and PostgreSQL binary COPY. It also handles Oracle intervals and numeric values, preserves the intent of ENABLE NOVALIDATE checks, and advances the PostgreSQL sequences after loading.\nI then verified that the Oracle and PostgreSQL row counts matched:\n\nThe complete implementation is available in copy_soe_data.py.\n7. Recover and reproduce the Swingbench workload\nSwingbench is a free load generator, but it is not open source. It is distributed as compiled Java, so porting its client to PostgreSQL was neither practical nor the goal. For this server-side workload, the business logic is in the SOE.ORDERENTRY package. The Java client primarily chooses transactions, generates parameters, and calls the package.\nCalling the migrated routines with arbitrary values would test invocation, but not the real workload. I guided GitHub Copilot to inspect the files in the Swingbench container. The XML configuration provided the enabled transactions, weights, user count, delays, and timeout. I used javap to confirm the externally observable call signatures and runtime behavior needed to build a compatible validation workload. GitHub Copilot documented those findings under my direction in scripts-postgres/swingbench_calls.md.\nI then guided GitHub Copilot to create run_swingbench_workload.py. It follows the same weighted transaction selection with four persistent user connections, a start barrier, copied customer data, and the configured timeout. It reports throughput, latency, and errors without trying to reproduce the Swingbench GUI or Oracle-specific connection pool.\nAs described in Section 5, transaction ownership had to change. The driver disables package-side commits, commits successful mutating calls through Psycopg, and rolls back failed calls. I ran it with:\nexport PG_DSN=&apos;host=&amp;lt;host&amp;gt; port=5432 dbname=&amp;lt;db&amp;gt; user=&amp;lt;user&amp;gt; sslmode=require&apos;\nexport PG_SCHEMA=&apos;_mig_scratch_soe&apos;\n\nbash scripts-postgres/run_swingbench_workload.sh --duration 300\n\nBefore creating load, the program verifies that the public workload API is complete. It exits early rather than report misleading performance results for an incomplete deployment.\n8. Validate in layers\nValidation is part of the migration, not a final smoke test. Compilation proves that PostgreSQL accepts the generated objects, but not that they return the right results or preserve business effects. I directed GitHub Copilot to build four validation layers so each failure could be isolated before adding more workload complexity.\nLayer 1: catalog and query validation\nThe rollback-safe test harness begins with a preflight that checks the PostgreSQL version, required tables, five sequences, and all public workload routines. It also submits the two analytical queries to PostgreSQL with EXPLAIN before proceeding to routine calls. I separately ran those two analytical queries with EXPLAIN ANALYZE against 106,583 customers, 160,684 orders, and 482,752 order items. Both executed successfully.\nThe top-customer query completed in 424 ms. Its sequential scans were reasonable because it consumed almost all orders and items, although the aggregate spilled to temporary disk:\nSort (actual time=423.274..423.277 rows=20 loops=1)\n  Sort Key: (rank() OVER (?))\n  Sort Method: quicksort  Memory: 26kB\n  Buffers: shared hit=11220, temp read=1792 written=1953\n  -&amp;gt; WindowAgg (actual time=423.242..423.255 rows=20 loops=1)\n    Run Condition: (rank() OVER (?) &amp;lt;= 20)\n    -&amp;gt; Sort (actual time=423.236..423.240 rows=21 loops=1)\n      Sort Key: sum(oi.quantity * oi.unit_price) DESC\n      Sort Method: quicksort  Memory: 1929kB\n      -&amp;gt; HashAggregate (actual time=402.740..415.533 rows=24968 loops=1)\n        Group Key: c.customer_id\n        Batches: 9  Memory Usage: 8273kB  Disk Usage: 1480kB\n        -&amp;gt; Hash Join (actual time=60.363..279.582 rows=482718 loops=1)\n          Hash Cond: (o.customer_id = c.customer_id)\n          -&amp;gt; Hash Join (actual time=34.192..176.799 rows=482752 loops=1)\n            Hash Cond: (oi.order_id = o.order_id)\n            -&amp;gt; Seq Scan on order_items oi (rows=482752 loops=1)\n            -&amp;gt; Hash\n              -&amp;gt; Seq Scan on orders o (rows=160684 loops=1)\n          -&amp;gt; Hash\n            -&amp;gt; Seq Scan on customers c (rows=106583 loops=1)\nPlanning Time: 0.742 ms\nExecution Time: 423.895 ms\n\nVS Code with the PostgreSQL extension can visualize the plan, including buffers read by each node and the flow of rows between nodes: \nThe monthly revenue query completed in 627 ms. Its aggregate spilled into 33 batches before two in-memory window sorts, making work_mem the first tuning candidate rather than an index:\nWindowAgg (actual time=615.702..626.031 rows=27472 loops=1)\n  Buffers: shared hit=11211, temp read=1965 written=2208\n  -&amp;gt; Sort (actual time=615.698..617.253 rows=27472 loops=1)\n    Sort Key: customer_sales.customer_id, customer_sales.month_start\n    Sort Method: quicksort  Memory: 2352kB\n    -&amp;gt; WindowAgg (actual time=600.739..610.404 rows=27472 loops=1)\n      -&amp;gt; Sort (actual time=600.708..602.149 rows=27472 loops=1)\n        Sort Key: customer_sales.month_start, customer_sales.revenue\n        Sort Method: quicksort  Memory: 2137kB\n        -&amp;gt; Subquery Scan on customer_sales\n          (actual time=570.611..587.861 rows=27472 loops=1)\n          -&amp;gt; HashAggregate\n            (actual time=570.610..586.090 rows=27472 loops=1)\n            Group Key: c.customer_id,\n                 date_trunc(&apos;month&apos;, o.order_date)\n            Batches: 33  Memory Usage: 8209kB  Disk Usage: 2040kB\n            -&amp;gt; Hash Join\n              (actual time=54.823..392.870 rows=482718 loops=1)\n              Hash Cond: (o.customer_id = c.customer_id)\n              -&amp;gt; Hash Join\n                (actual time=31.672..208.840 rows=482752 loops=1)\n                Hash Cond: (oi.order_id = o.order_id)\n                -&amp;gt; Seq Scan on order_items oi (rows=482752)\n                -&amp;gt; Hash\n                  -&amp;gt; Seq Scan on orders o (rows=160684)\n              -&amp;gt; Hash\n                -&amp;gt; Seq Scan on customers c (rows=106583)\nPlanning Time: 0.266 ms\nExecution Time: 627.065 ms\n\nThese execution plans establish a PostgreSQL baseline and identify possible tuning work, such as aggregate spills and work_mem pressure. I kept those observations for the physical-design review after correctness and concurrent workload validation rather than tuning from isolated queries too early.\nLayer 2: call every public workload routine\nAfter the preflight, the same harness discovers viable values and calls all nine workload transactions plus setPLSQLCOMMIT:\nbash scripts-postgres/run_orderentry_tests.sh\n\nEach call is isolated and reports its SQLSTATE on failure. The first run exposed defects that compilation could not: composite return types did not match some rows, internal and public customer-ID types differed, package settings lacked defaults, and newOrder retained an Oracle %TYPE cast. GitHub Copilot generated schema-relative repairs, which I reviewed and applied. The implementation is available in apply_orderentry_runtime_fixes.py:\nbash scripts-postgres/apply_orderentry_runtime_fixes.sh\n\nI then ran the harness again, and all ten checks passed.\nLayer 3: verify business effects\nA successful call does not prove the correct business effect. GitHub Copilot generated a rollback-safe order workflow:\nbash scripts-postgres/run_swingbench_workload.sh --verify-only\n\nIt creates two orders for a copied customer, verifies their fields and item rows, then checks that browseandupdateorders changes one item quantity and the matching order total together. It rolls back, reconnects, and proves that both orders are absent. Only sequence values may advance because PostgreSQL sequences are nontransactional.\nLayer 4: weighted concurrent load\nOnly after the first three layers passed did I run concurrent load. Four users executed 287 calls across all nine transaction types with zero errors. This ordering separated migration defects from performance observations and avoided assuming that copied customer IDs were contiguous.\nAfter validation: review physical design\nAfter validating the migration and ensuring data accuracy, it is time to look at the physical layer, using the execution plans captured in Layer 1 together with observations from the concurrent workload. Oracle and PostgreSQL handle data patterns differently, so blindly copying Oracle optimizations can degrade performance. PostgreSQL&apos;s MVCC architecture adds write overhead to updates, so the table FILLFACTOR strategy needs a fresh look compared with Oracle&apos;s PCTFREE. PostgreSQL also provides different tuning options, including partial indexes, specialized index types, and incremental sorting.\nReproduce the complete validation\nAt the end of my run, the test setup contained:\n\nall ten workload tables populated\nall five required sequences deployed and advanced\ntwo analytical queries accepted by PostgreSQL under EXPLAIN\na complete invocation harness\na weighted Swingbench-like concurrent driver\na rollback-safe semantic order test\n\nAfter deploying the converted schema and its ORDERENTRY routines, I applied the reviewed runtime fixes and ran the checks in increasing order of scope:\nbash scripts-postgres/apply_orderentry_runtime_fixes.sh\nbash scripts-postgres/run_orderentry_tests.sh\nbash scripts-postgres/run_swingbench_workload.sh --verify-only\nbash scripts-postgres/run_swingbench_workload.sh --duration 300\n\nConclusion\nAI did not make this migration a one-click operation. The Oracle application combined packages, private helpers, collections, package state, bulk operations, transaction control, and behavior that only appears under realistic calls. A credible migration had to understand those interactions rather than only produce PostgreSQL syntax.\nThe useful change is that the migration can be approached as an integrated project from one place. In VS Code, the migration extension converted and compiled the schema. I inspected the generated code and reports, directed GitHub Copilot to generate the supporting data-copy and workload programs, reviewed and applied runtime fixes, and validated data, API calls, business effects, and concurrent load. The model accelerated code conversion and the creation of focused tools, while PostgreSQL, executable tests, and my knowledge of the application provided the evidence.\nThis is the method I would carry from assessment into a real migration: use AI to drive more of the conversion, diagnosis, repair, and validation iterations, not to hide complexity. Keep source behavior, converted code, data movement, test programs, findings, and fixes together in a reproducible workspace. This makes the first prototype useful evidence for estimating the remaining effort. A migration report measures one pipeline stage; the application is migrated only when its data, transactions, business effects, and workload work together on PostgreSQL.\nThis validation is necessary but not sufficient for production. A real go-live also requires review of edge cases, collation, NULL handling, error paths, security, and sustained performance under representative data volumes.\nBecause this walkthrough exercises preview functionality, experience reports are especially valuable. Readers trying it on other Oracle applications or PostgreSQL targets can share what converts well, what requires intervention, and which findings would make the assessment more useful in the PostgreSQL Hub Developer Forum","mainEntityOfPage":{"@type":"WebPage","@id":"https://techcommunity.microsoft.com/blog/adforpostgresql/oracle-to-postgresql-in-vs-code-assessment-conversion-and-validation/4544728"},"headline":"Oracle to PostgreSQL in VS Code: Assessment, Conversion, and Validation","image":["https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTQ0NzI4LXBPMGtlNg?revision=3"],"dateModified":"8/11/2026, 3:44:18 PM","author":{"@type":"Person","name":"FranckPachot","url":"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/dS0zNTk1MjU3LWRGM2FHTg?image-coordinates=0%2C0%2C400%2C400"},"publisher":{"@type":"Organization","name":"TECHCOMMUNITY.MICROSOFT.COM"}}</script><noscript id="__next_css__DO_NOT_USE__"></noscript><script id="prism-bootstrap" data-nscript="beforeInteractive" crossorigin="anonymous">window.Prism = window.Prism || {};Prism.manual = true;</script><link rel="preload" href="/_next/static/css/e380712fc1c35b8b.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/e380712fc1c35b8b.css" crossorigin="anonymous" data-n-g=""/><link rel="preload" href="/_next/static/css/16ca3aa1e91dea46.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/16ca3aa1e91dea46.css" crossorigin="anonymous" data-n-p=""/><link rel="preload" href="/_next/static/css/5ffe639e00adc788.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/5ffe639e00adc788.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/8ed17267209fce19.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/8ed17267209fce19.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/af4f72a0a5873a2a.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/af4f72a0a5873a2a.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/96e83c4412cdcd6d.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/96e83c4412cdcd6d.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/b90ed3dcf17a88eb.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/b90ed3dcf17a88eb.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/a87e85723550ff6c.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/a87e85723550ff6c.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/31114999931d0e03.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/31114999931d0e03.css" crossorigin="anonymou s":[]}},"canPublishArticleOnCreate":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.policy_can_publish_on_create_workflow_action.accessDenied","key":"error.lithium.policies.forums.policy_can_publish_on_create_workflow_action.accessDenied","args":[]}}},"moderationSettings":{"__typename":"ModerationSettings","aiModerationEnabled":null},"linkProperties":{"__typename":"LinkProperties","isExternalLinkWarningEnabled":false},"eventPath":"category:AzureDatabases/category:products-services/category:communities/community:gxcuf89792board:ADforPostgreSQL/"},"BlogTopicMessage:message:4544728":{"__typename":"BlogTopicMessage","uid":4544728,"subject":"Oracle to PostgreSQL in VS Code: Assessment, Conversion, and Validation","id":"message:4544728","entityType":"BLOG_ARTICLE","eventPath":"category:AzureDatabases/category:products-services/category:communities/community:gxcuf89792board:ADforPostgreSQL/message:4544728","revisionNum":3,"repliesCount":0,"author":{"__ref":"User:user:3595257"},"depth":0,"hasGivenKudo":false,"board":{"__ref":"Blog:board:ADforPostgreSQL"},"conversation":{"__ref":"Conversation:conversation:4544728"},"messagePolicies":{"__typename":"MessagePolicies","canPublishArticleOnEdit":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.policy_can_publish_on_edit_workflow_action.accessDenied","key":"error.lithium.policies.forums.policy_can_publish_on_edit_workflow_action.accessDenied","args":[]}},"canModerateSpamMessage":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.feature.moderation_spam.action.moderate_entity.allowed.accessDenied","key":"error.lithium.policies.feature.moderation_spam.action.moderate_entity.allowed.accessDenied","args":[]}},"canReply":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.message.reply_to_entity.allow.accessDenied","key":"error.lithium.policies.forums.action.message.reply_to_entity.allow.accessDenied","args":[]}},"canAcceptSolution":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.accepted_solutions.action_allow.message.mark_as_accepted_solution.accessDenied","key":"error.lithium.policies.accepted_solutions.action_allow.message.mark_as_accepted_solution.accessDenied","args":[]}},"canRejectSolution":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.accepted_solutions.action_allow.message.unmark_as_accepted_solution.accessDenied","key":"error.lithium.policies.accepted_solutions.action_allow.message.unmark_as_accepted_solution.accessDenied","args":[]}},"canTag":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.labels.action.labelableentity.set_labels.allow.accessDenied","key":"error.lithium.policies.labels.action.labelableentity.set_labels.allow.accessDenied","args":[]}},"canEdit":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action_allow.edit_message.accessDenied","key":"error.lithium.policies.forums.action_allow.edit_message.accessDenied","args":[]}},"canKudo":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.kudos.action.entity.give_kudos.allow.accessDenied","key":"error.lithium.policies.kudos.action.entity.give_kudos.allow.accessDenied","args":[]}},"canModerateEntity":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.moderation.action.moderatableentity.moderate_entity.allow.accessDenied","key":"error.lithium.policies.moderation.action.moderatableentity.moderate_entity.allow.accessDenied","args":[]}},"canDelete":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.delete_message_view.delete_message.allow.accessDenied","key":"error.lithium.policies.forums.action.delete_message_view.delete_message.allow.accessDenied","args":[]}},"canMoveMessage":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.message.move_message.allow.accessDenied","key":"error.lithium.policies.forums.action.message.move_message.allow.accessDenied","args":[]}},"canMarkMessageReadOnly":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.feature.forums.action.mark_message_readonly.allowed.accessDenied","key":"error.lithium.policies.feature.forums.action.mark_message_readonly.allowed.accessDenied","args":[]}},"canFreezeTkbArticle":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.tkb.action_can_freeze_article.accessDenied","key":"error.lithium.policies.tkb.action_can_freeze_article.accessDenied","args":[]}},"canReportAbuse":{"__typename":"PolicyResult","failureReason":null},"canDeleteDraft":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.delete_drafts.accessDenied","key":"error.lithium.policies.delete_drafts.accessDenied","args":[]}}},"contentWorkflow":{"__typename":"ContentWorkflow","state":"PUBLISH","scheduledPublishTime":null,"scheduledTimezone":null,"userContext":{"__typename":"MessageWorkflowContext","canSubmitForReview":null,"canEdit":false,"canRecall":null,"canSubmitForPublication":null,"canReturnToAuthor":null,"canPublish":null,"canReturnToReview":null,"canSchedule":false},"shortScheduledTimezone":null},"readOnly":false,"editFrozen":false,"showMoveIndicator":false,"moderationData":{"__ref":"ModerationData:moderation_data:4544728"},"teaser":"","body":"\u003cP\u003eThis article explores the possibilities opened by the\u0026nbsp;\u003cSTRONG\u003eMigrations (Preview)\u003c/STRONG\u003e workflow. It is an early evaluation, using the source and target systems I had available, rather than documentation of a supported production configuration. Preview features benefit from concrete tests and feedback: the results below show both what worked and what still needed attention, with the goal of helping the workflow evolve. They should not be read as a product support or roadmap commitment for the specific databases used here.\u003c/P\u003e\n\u003cP\u003eThe goal is to evaluate how AI assistance changes the first phases of a migration: assessing the effort, creating a first working prototype, and making the remaining technical gaps visible. This is where an integrated development environment is particularly effective. Source artifacts, generated PostgreSQL code, reports, database connections, tests, findings, and repairs can remain in one reproducible VS Code workspace.\u003c/P\u003e\n\u003cP\u003eMigrating a database is not finished when the tables compile. A useful test must also answer three harder questions:\u003c/P\u003e\n\u003cOL\u003e\n\u003cLI\u003eWas the reference data copied correctly?\u003c/LI\u003e\n\u003cLI\u003eWere the application-facing stored routines actually deployed?\u003c/LI\u003e\n\u003cLI\u003eDo those routines produce the same business effects under a realistic load?\u003c/LI\u003e\n\u003c/OL\u003e\n\u003cP\u003eThis is particularly important when business logic is embedded in proprietary database constructs such as PL/SQL packages, which are in scope for this migration. \u003cA href=\"https://www.dominicgiles.com/swingbench/#about-swingbench\" target=\"_blank\" rel=\"noopener nofollow noreferrer\"\u003eSwingbench Order Entry\u003c/A\u003e is a good example. It has two versions: one uses pure JDBC, with the business logic in Java, and the other places the logic in a PL/SQL package that uses advanced Oracle Database features. The server-side version illustrates the migration challenges found in many critical legacy applications.\u003c/P\u003e\n\u003cP\u003eIn this article, I walk through those questions using Swingbench's Sales Order Entry (SOE) schema. I ran Oracle Database and Swingbench in Docker containers and used the PostgreSQL extension for Visual Studio Code to convert the schema against an Azure HorizonDB (preview) scratch database. I then used GitHub Copilot to build the data-copy, workload-emulation, and validation programs needed to test PostgreSQL.\u003c/P\u003e\n\u003cP\u003eThis article follows the migration end to end. Readers can use individual sections independently, but I keep the complete sequence because each stage exposed issues that schema conversion alone could not reveal.\u003c/P\u003e\n\u003cP\u003eThroughout this project, I made the architectural decisions, directed the investigation, and validated results. The migration extension performed the model-assisted schema and PL/SQL conversion, while GitHub Copilot generated supporting code and tests under my direction. PostgreSQL compilation and the executable tests provided the evidence. Instead of replacing deterministic extraction, dependency analysis, and type mappings, AI participated in the iterations that traditionally follow them: contextual translation, review, diagnosis, repair, and validation. GitHub Copilot also produced the first draft of this article, which I reviewed and refined so it accurately describes what I ran, observed, and concluded.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-1364381308\"\u003eWhat was migrated\u003c/H2\u003e\n\u003cP\u003eSwingbench SOE is a compact but realistic migration target. It includes:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003ecustomers, addresses, cards, products, inventory, orders, and order items\u003c/LI\u003e\n\u003cLI\u003eprimary keys, foreign keys, checks, indexes, and sequences\u003c/LI\u003e\n\u003cLI\u003eviews and analytical queries\u003c/LI\u003e\n\u003cLI\u003ethe Oracle \u003cCODE\u003eSOE.ORDERENTRY\u003c/CODE\u003e PL/SQL package used by Swingbench, with all the application logic, leaving only the presentation layer to the frontend\u003c/LI\u003e\n\u003cLI\u003epackage state, collection types, helper routines, random choices, sleeps, transaction control, and business transactions\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eThe test environment was:\u003c/P\u003e\n\u003cDIV class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"\u003e\u003ctable border=\"1\" style=\"border-width: 1px;\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eComponent\u003c/th\u003e\u003cth\u003eVersion or image\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eOracle Database 26ai\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003egvenzl/oracle-free:slim\u003c/CODE\u003e (23.26.2)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSwingbench\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003edomgiles/swingbench:latest\u003c/CODE\u003e (2.6.1118)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePostgreSQL\u003c/td\u003e\u003ctd\u003eAzure HorizonDB (PostgreSQL 17.9)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePostgreSQL extension for Visual Studio Code\u003c/td\u003e\u003ctd\u003e1.27.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFoundry model\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003egpt-5.2\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003ccolgroup\u003e\u003ccol style=\"width: 50.00%\" /\u003e\u003ccol style=\"width: 50.00%\" /\u003e\u003c/colgroup\u003e\u003c/table\u003e\u003c/DIV\u003e\n\u003cH2 id=\"community-4544728-toc-hId--443073155\"\u003e1. Build the Oracle source environment\u003c/H2\u003e\n\u003cP\u003eI used the following \u003cCODE\u003edocker-compose.yaml\u003c/CODE\u003e to start Oracle and keep a Swingbench container available for schema creation and testing:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-yaml\"\u003e\u003ccode\u003eservices:\n  oracle:\n    image: gvenzl/oracle-free:slim\n    environment:\n      ORACLE_PASSWORD: \"\u0026lt;oracle-system-password\u0026gt;\"\n    ports:\n      - \"1521:1521\"\n    healthcheck:\n      test: [\"CMD\", \"healthcheck.sh\"]\n      interval: 10s\n      timeout: 5s\n      retries: 30\n\n  swingbench:\n    image: domgiles/swingbench:latest\n    platform: linux/amd64\n    depends_on:\n      oracle:\n        condition: service_healthy\n    entrypoint: [\"sleep\", \"infinity\"]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eI started both containers with:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003edocker compose up -d\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eOnce Oracle was healthy, I created a small SOE database with Swingbench's command-line wizard. I chose scale \u003cCODE\u003e0.1\u003c/CODE\u003e: large enough to exercise the relationships while remaining convenient for repeated migrations.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003edocker compose exec swingbench oewizard -cl -create \\\n  -cs //oracle:1521/FREEPDB1 \\\n  -dba \"sys as sysdba\" -dbap '\u0026lt;oracle-system-password\u0026gt;' \\\n  -df /opt/oracle/oradata/FREE/FREEPDB1/soe01.dbf \\\n  -u soe -p '\"\u0026lt;soe-password\u0026gt;\"' \\\n  -scale 0.1 -tc 1 -v\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eSwingbench substitutes the SOE password into \u003cCODE\u003eCREATE USER ... IDENTIFIED BY\u003c/CODE\u003e. A password containing characters that require Oracle's quoted-password syntax must be passed with the literal double quotes expected by that SQL statement.\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/01-swingbench-oewizard-soe-data-load.png\" alt=\"Swingbench OEWizard creating the SOE schema and loading data\" /\u003e\u003c/P\u003e\n\u003cP\u003eBefore migrating anything, I compiled the source package and checked for Oracle errors:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003edocker compose exec -T oracle \\\n  sqlplus -s / as sysdba \u0026lt;\u0026lt;'SQL'\nalter session set container=FREEPDB1;\nalter package SOE.ORDERENTRY compile;\nalter package SOE.ORDERENTRY compile body;\nshow errors package body SOE.ORDERENTRY\nSQL\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eI then tested the environment to be migrated by running the original Swingbench application for one minute:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-bash\"\u003e\u003ccode\u003edocker compose exec -it swingbench charbench \\\n  -cs //oracle:1521/FREEPDB1 \\\n  -dbau system -dbap '\u0026lt;oracle-system-password\u0026gt;' \\\n  -u soe -p '\u0026lt;soe-password\u0026gt;' \\\n  -rt 00:01:00 -c ../configs/SOE_Server_Side_V2.xml\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/02-swingbench-charbench-baseline-workload.png\" alt=\"Swingbench charbench baseline workload running with four users\" /\u003e\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-2044439678\"\u003e2. Prepare VS Code, HorizonDB, and Foundry\u003c/H2\u003e\n\u003cP\u003eI installed \u003cA href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVS Code\u003c/A\u003e and the \u003cA href=\"https://marketplace.visualstudio.com/items?itemName=ms-ossdata.vscode-pgsql\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePostgreSQL extension for Visual Studio Code, authored by Microsoft\u003c/A\u003e. The migration workflow is exposed under \u003cSTRONG\u003eMigrations (Preview)\u003c/STRONG\u003e in the PostgreSQL view:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/03-vscode-postgresql-migrations-create-project.png\" alt=\"PostgreSQL extension Migrations view with Create Migration Project\" /\u003e\u003c/P\u003e\n\u003cP\u003eI opened \u003cSTRONG\u003eMigrations (Preview)\u003c/STRONG\u003e and created a project.\u003c/P\u003e\n\u003cP\u003eThe first step was to name the migration project. I generated all screenshots while reviewing this article and replaying the walkthrough, so the project identifier for this run was \u003cCODE\u003ewalkthrough-validation\u003c/CODE\u003e:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/04-new-oracle-postgresql-migration-project.png\" alt=\"New Oracle to Azure Database for PostgreSQL migration project\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe second step was to connect to the source Oracle Database as a user with the DBA role and select the schema:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/05-oracle-source-connection.png\" alt=\"Connect to Oracle\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe third step was to define the destination PostgreSQL database:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/06-postgresql-scratch-database-selection.png\" alt=\"Choose an Azure Database for PostgreSQL scratch database\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe migration tool executes generated DDL there, so this must not be an application or production database.\u003c/P\u003e\n\u003cP\u003eAt the time of this test, the migration workflow expected an Azure PostgreSQL connection for compilation, either Flexible Server or HorizonDB. I used an \u003cA href=\"https://azure.microsoft.com/en-us/products/horizondb\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eAzure HorizonDB (preview)\u003c/A\u003e database as a dedicated scratch target. This was an exploratory use of the preview workflow, not a statement of official HorizonDB support. The generated code targets PostgreSQL rather than HorizonDB-specific APIs; portability to another PostgreSQL deployment still depends on its PostgreSQL version, available features, and managed-service restrictions.\u003c/P\u003e\n\u003cP\u003eI created the database service beforehand from VS Code:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/07-vscode-create-postgresql-server-connection.png\" alt=\"Create a PostgreSQL server connection\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe conversion also needed a Microsoft Foundry resource and a deployed model. I created the resource, opened Foundry, deployed \u003cCODE\u003egpt-5.2\u003c/CODE\u003e, and recorded the resource endpoint and deployment name.\u003c/P\u003e\n\u003cP\u003eI created the resource from the Azure portal:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/08-azure-openai-resource-creation.png\" alt=\"Create an Azure OpenAI resource\" /\u003e\u003c/P\u003e\n\u003cP\u003eI noted its endpoint and key:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/09-azure-openai-keys-endpoint.png\" alt=\"Keys and endpoint\" /\u003e\u003c/P\u003e\n\u003cP\u003eFrom VS Code, I opened the Foundry portal:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/10-open-microsoft-foundry-portal.png\" alt=\"Open the Foundry portal\" /\u003e\u003c/P\u003e\n\u003cP\u003eI selected GPT-5.2:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/11-select-gpt-5-2-model.png\" alt=\"Select GPT-5.2\" /\u003e\u003c/P\u003e\n\u003cP\u003eI chose to use the selected model:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/12-use-selected-foundry-model.png\" alt=\"Use the selected model\" /\u003e\u003c/P\u003e\n\u003cP\u003eI deployed the model (I used the model name as the deployment name here):\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/13-deploy-foundry-model.png\" alt=\"Deploy the model\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe fourth configuration step was to select the model deployment using its name, endpoint, and API key:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/14-select-foundry-model-deployment.png\" alt=\"Choose a Microsoft Foundry Model\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe migration project was created: \u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/15-migration-project-dashboard.png\" alt=\"Migration project dashboard before schema migration\" /\u003e\u003c/P\u003e\n\u003cP\u003eAll files, configuration, logs, and reports were stored under \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e.github/postgres-migrations\u003c/A\u003e.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-236985215\"\u003e3. Run the migration project\u003c/H2\u003e\n\u003cP\u003eThe migration workflow extracted Oracle metadata, created a dependency graph, divided the objects into dependency-aware chunks, converted each chunk, reviewed the generated SQL, compiled it against PostgreSQL, and assembled deployment artifacts.\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/16-migration-pipeline-stage-details.png\" alt=\"Migration pipeline stages from extraction through deployment\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe process resembles a compiler pipeline more than a text translator:\u003c/P\u003e\n\u003cspan class=\"lia-media-object lia-media-is-center lia-media-size-default\" data-image-alt=\"\"\u003e\u003cbutton class=\"lia-media-unstyled-btn\" type=\"button\" aria-haspopup=\"true\" aria-label=\"Enlarge Image\"\u003e\u003cimg src=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTQ0NzI4LWlhclJaWQ?image-dimensions=999x250\u0026amp;revision=3\" width=\"999\" height=\"250\" alt=\"\" /\u003e\u003c/button\u003e\u003c/span\u003e\n\u003cP\u003eIt started by extracting the metadata into\u0026nbsp;\u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/extract/ddl/SOE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eartifacts/oracle/SOE/extract/ddl\u003c/A\u003e:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/17-oracle-schema-extraction-progress.png\" alt=\"Schema extraction progress for the SOE ORDERENTRY package\" /\u003e\u003c/P\u003e\n\u003cP\u003eA \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/extract/reports/oracle_extraction_report.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ereport\u003c/A\u003e provides all details when completed:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/18-oracle-extraction-report.png\" alt=\"Oracle extraction report showing 42 extracted objects\" /\u003e\u003c/P\u003e\n\u003cP\u003eIt then started the conversion, one chunk at a time:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/19-schema-conversion-progress.png\" alt=\"Schema conversion progress after extraction completed\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/internal/logs/conversion.log\" target=\"_blank\" rel=\"noopener noreferrer\"\u003econversion log\u003c/A\u003e shows the cycle of conversion, compilation, review, test, and validation using the LLM.\u003c/P\u003e\n\u003cP\u003eHere is an example showing the level of detail the log provides:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003e16:50:16 [INFO] ossdbtoolsservice.conversion_v2.pipeline.chunk_converter.package_converter: Package ORDERENTRY: member processOrders -\u0026gt; converted in 80.0s (tokens=5232, notes=Oracle ROWNUM \u0026lt; 10 translated to LIMIT 9 (no ORDER BY in source, so row choice remains arbitrary).; Oracle (+) outer joi)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis is a good example because it goes beyond syntax, where \u003cCODE\u003eROWNUM \u0026lt; 10\u003c/CODE\u003e translates to \u003cCODE\u003eLIMIT 9\u003c/CODE\u003e. It warns that a \u003cCODE\u003eLIMIT\u003c/CODE\u003e without \u003cCODE\u003eORDER BY\u003c/CODE\u003e has a nondeterministic result that can differ between Oracle and PostgreSQL. Applications should not rely on physical row order, but a migration must still consider behavior validated by years of production use, even when that behavior originated as a side effect of an application bug.\u003c/P\u003e\n\u003cP\u003eThe PostgreSQL DDL goes into \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/postgres_ddl\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eartifacts/oracle/SOE/convert/sessions\u003c/A\u003e.\u003c/P\u003e\n\u003cP\u003eA \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/tree/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/reports\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ereport\u003c/A\u003e provides all details:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/20-conversion-report-object-types.png\" alt=\"Conversion report by object type with no failed objects\" /\u003e\u003c/P\u003e\n\u003cP\u003eSimple objects can follow deterministic paths, while complex PL/SQL receives model-assisted conversion and review. PostgreSQL compilation, rather than the model, is intended to be the final syntax and dependency check. Once the migration is complete, it lists the review tasks. The counts and classifications shown here are observations from version 1.27.3 of an evolving preview workflow. Future versions may present fewer review tasks as their focus evolves in response to feedback, including a stronger emphasis on syntax and conversion completeness:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/21-migration-complete-review-tasks.png\" alt=\"Completed migration and pending schema review tasks\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe summary also lists extensions that should be installed in the target database:\u003c/P\u003e\n\u003cP\u003e\u003cIMG style=\"max-width: 80%; border: 1px solid rgb(204, 204, 204); padding: 2px;\" src=\"https://raw.githubusercontent.com/FranckPachot/test-ora-mig/refs/heads/walkthrough-validation/images/22-required-postgresql-extensions.png\" alt=\"Required PostgreSQL extensions\" /\u003e\u003c/P\u003e\n\u003cP\u003eThe \u003cA href=\"https://github.com/orafce/orafce\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eorafce\u003c/A\u003e extension implements many functions familiar to Oracle users, including functions from Oracle DBMS packages. It can reduce the amount of code that must change during a migration. Extensions such as \u003cCODE\u003eorafce\u003c/CODE\u003e and \u003cCODE\u003eplpgsql_check\u003c/CODE\u003e can improve conversion and validation when they are available. For this experiment, however, I deliberately used a vanilla PostgreSQL target without them. I wanted to see what the workflow could produce without tying the converted application to extensions that may not be available from every managed PostgreSQL service. This makes portability a design goal of the prototype, not a claim that every PostgreSQL deployment is identical or that omitting extensions always produces the most accurate conversion.\u003c/P\u003e\n\u003cP\u003eBefore proceeding to the manual review, I inspected the fresh conversion log to separate what the pipeline had repaired automatically from what it had only flagged for attention.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId--1570469248\"\u003e4. What the migration workflow corrected, and what it could not prove\u003c/H2\u003e\n\u003cP\u003eI used GitHub Copilot to parse the \u003cA href=\"https://github.com/FranckPachot/test-ora-mig/blob/walkthrough-validation/.github/postgres-migrations/walkthough-validation/artifacts/oracle/SOE/convert/sessions/51bf8c70/internal/logs/conversion.log\" target=\"_blank\" rel=\"noopener noreferrer\"\u003econversion log\u003c/A\u003e and distinguish initial conversion, model review, compiler-driven repair, and warnings left for application review. The analysis found 37 automatic correction events: 33 during the second-pass review and four after PostgreSQL rejected generated SQL during compilation. The run finished with zero failed objects and zero fallback objects.\u003c/P\u003e\n\u003cP\u003eThe second-pass reviewer corrected 20 of the 35 generated package artifacts. The interesting changes included:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003eguarding \u003cCODE\u003ecurrent_setting()\u003c/CODE\u003e results against missing or empty values before casting them\u003c/LI\u003e\n\u003cLI\u003echanging the DML counter helpers from transaction-local to session-level GUC writes so their state can survive a commit on the same connection\u003c/LI\u003e\n\u003cLI\u003ereplacing invalid Oracle \u003cCODE\u003e%TYPE\u003c/CODE\u003e references in PostgreSQL signatures and expressions\u003c/LI\u003e\n\u003cLI\u003ereplacing invalid \u003cCODE\u003ePERFORM * FROM\u003c/CODE\u003e and Oracle cursor syntax\u003c/LI\u003e\n\u003cLI\u003eschema-qualifying table references and limiting a \u003cCODE\u003eSELECT INTO\u003c/CODE\u003e that could otherwise return multiple rows\u003c/LI\u003e\n\u003cLI\u003erepairing an incomplete generated type-creation block\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eThese were code changes, not only warnings. This is where model-assisted conversion goes beyond a fixed syntax rulebook: it reviews generated code in context and revises interactions between types, state, queries, and control flow. PostgreSQL compilation then found four remaining defects. The repair loop removed unsupported \u003cCODE\u003eDEFERRABLE\u003c/CODE\u003e clauses from two check constraints and repaired two routines before recompiling them. This is an important distinction: model review can anticipate defects, while the target database provides the exact SQLSTATE and failing statement. The pipeline then fixes and retries, much like a developer working until the code compiles.\u003c/P\u003e\n\u003cP\u003eChunking did not leave dependencies to the user. When a referenced table, index, or routine was produced by another chunk, the pipeline deferred the dependent operation and retried it after the required object existed. All such operations completed automatically in this run.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId--879907774\"\u003eStructural translations\u003c/H3\u003e\n\u003cP\u003eThe conversion itself also made deliberate structural changes that were not compiler repairs:\u003c/P\u003e\n\u003cDIV class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"\u003e\u003ctable border=\"1\" style=\"border-width: 1px;\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOracle behavior\u003c/th\u003e\u003cth\u003ePostgreSQL translation\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ePackage members\u003c/td\u003e\u003ctd\u003eSchema routines named \u003cCODE\u003eorderentry$\u0026lt;member\u0026gt;\u003c/CODE\u003e (PostgreSQL has no packages)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePackage records and collections\u003c/td\u003e\u003ctd\u003eComposite types, array domains, and set-returning functions\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePackage variables\u003c/td\u003e\u003ctd\u003eCustom settings accessed through \u003cCODE\u003eset_config()\u003c/CODE\u003e and \u003cCODE\u003ecurrent_setting()\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eDBMS_RANDOM.VALUE\u003c/CODE\u003e\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003erandom()\u003c/CODE\u003e with range arithmetic (without the \u003cCODE\u003eDBMS_RANDOM\u003c/CODE\u003e emulation provided by \u003cCODE\u003eorafce\u003c/CODE\u003e)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eDBMS_LOCK.SLEEP\u003c/CODE\u003e\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003epg_sleep()\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eDBMS_APPLICATION_INFO\u003c/CODE\u003e\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003eapplication_name\u003c/CODE\u003e or custom settings\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eBULK COLLECT\u003c/CODE\u003e\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003eRETURNS TABLE\u003c/CODE\u003e, \u003cCODE\u003eSETOF\u003c/CODE\u003e, or \u003cCODE\u003eRETURN QUERY\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eROWNUM \u0026lt; n\u003c/CODE\u003e\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003eLIMIT n - 1\u003c/CODE\u003e or \u003cCODE\u003erow_number()\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eCONNECT BY\u003c/CODE\u003e row generation\u003c/td\u003e\u003ctd\u003eRecursive CTE\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eFORALL\u003c/CODE\u003e inventory updates\u003c/td\u003e\u003ctd\u003eRow-by-row PL/pgSQL loop (PostgreSQL runs PL and SQL in the same engine)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cCODE\u003eSYSDATE\u003c/CODE\u003e and \u003cCODE\u003eSYSTIMESTAMP\u003c/CODE\u003e\u003c/td\u003e\u003ctd\u003e\u003cCODE\u003eCURRENT_TIMESTAMP\u003c/CODE\u003e, \u003cCODE\u003eclock_timestamp()\u003c/CODE\u003e, and \u003cCODE\u003edate_trunc()\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePackage procedures\u003c/td\u003e\u003ctd\u003eFunctions returning \u003cCODE\u003evoid\u003c/CODE\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePackage overloads\u003c/td\u003e\u003ctd\u003ePostgreSQL overloads with the same flattened name\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003ccolgroup\u003e\u003ccol style=\"width: 50.00%\" /\u003e\u003ccol style=\"width: 50.00%\" /\u003e\u003c/colgroup\u003e\u003c/table\u003e\u003c/DIV\u003e\n\u003cH3 id=\"community-4544728-toc-hId-1607605059\"\u003eWhat still requires attention\u003c/H3\u003e\n\u003cP\u003eSuccessful compilation proves syntax and dependency consistency, not behavioral equivalence. The fresh review report classifies 34 of 78 objects as auto-approved and leaves 44 non-blocking behavioral divergences for application review. The most important are:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003eOracle \u003cCODE\u003eENABLE NOVALIDATE\u003c/CODE\u003e primary keys do not validate existing rows, while PostgreSQL primary-key creation does. Eight tables therefore require clean source data before deployment.\u003c/LI\u003e\n\u003cLI\u003eFive Oracle reverse-key indexes became normal PostgreSQL btree indexes, which can change insertion hot spots and access behavior.\u003c/LI\u003e\n\u003cLI\u003ePackage state is stored as text in custom GUCs. Although the reviewer changed the counter helpers to session-level writes, the emitted routines still use different key prefixes and a mixture of session-level and transaction-local settings. Initialization, pooling, commits, and casts need runtime tests.\u003c/LI\u003e\n\u003cLI\u003ePostgreSQL functions cannot reproduce Oracle package-side \u003cCODE\u003eCOMMIT\u003c/CODE\u003e. The caller must own transaction boundaries.\u003c/LI\u003e\n\u003cLI\u003e\u003cCODE\u003eROWNUM\u003c/CODE\u003e conversions without \u003cCODE\u003eORDER BY\u003c/CODE\u003e preserve nondeterministic selection, but they do not guarantee that Oracle and PostgreSQL choose the same rows.\u003c/LI\u003e\n\u003cLI\u003e\u003cCODE\u003eBULK COLLECT\u003c/CODE\u003e collections became row sets, and \u003cCODE\u003eFORALL\u003c/CODE\u003e became a loop. Empty collection behavior, ordering, locking, and performance can differ.\u003c/LI\u003e\n\u003cLI\u003eRandom-number boundaries, numeric casts, exception behavior, and \u003cCODE\u003eSYSDATE\u003c/CODE\u003e/\u003cCODE\u003eSYSTIMESTAMP\u003c/CODE\u003e timing and timezone semantics remain database-specific.\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eNone of these 44 findings blocked deployment in this run. They define the work for the runtime validation in the following sections rather than automatic fixes that the migration report can prove.\u003c/P\u003e\n\u003cH2 id=\"community-4544728-toc-hId-1597101955\"\u003e5. Examples from the generated \u003cCODE\u003eORDERENTRY\u003c/CODE\u003e package\u003c/H2\u003e\n\u003cP\u003eThe package conversion shows why this is more than syntax replacement. The pipeline emitted all 34 executable package-body members, including private helpers, and represented Oracle procedures as PostgreSQL functions returning \u003cCODE\u003evoid\u003c/CODE\u003e. Because PostgreSQL has no equivalent of package visibility, every member became a schema routine named \u003cCODE\u003eorderentry$\u0026lt;member\u0026gt;\u003c/CODE\u003e. Applications should keep calling only the former public API, with privileges used to preserve the old visibility boundary.\u003c/P\u003e\n\u003cP\u003eThe harder transformations preserved the shape of the business logic without pretending that Oracle and PostgreSQL use the same programming model. For example, \u003cCODE\u003eBULK COLLECT\u003c/CODE\u003e collections became set-returning functions. Indexed collection access became operations over those row sets. The \u003cCODE\u003eFORALL\u003c/CODE\u003e inventory update in \u003cCODE\u003eorderentry$neworder\u003c/CODE\u003e became a PL/pgSQL loop, and the \u003cCODE\u003eCONNECT BY\u003c/CODE\u003e row generator used for warehouse activity became a recursive CTE. Package helpers using \u003cCODE\u003eDBMS_RANDOM\u003c/CODE\u003e, \u003cCODE\u003eDBMS_LOCK.SLEEP\u003c/CODE\u003e, and \u003cCODE\u003eDBMS_APPLICATION_INFO\u003c/CODE\u003e became calls to \u003cCODE\u003erandom()\u003c/CODE\u003e, \u003cCODE\u003epg_sleep()\u003c/CODE\u003e, and PostgreSQL settings.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId--2007303867\"\u003eA small conversion with a large consequence\u003c/H3\u003e\n\u003cP\u003eI verified that \u003cCODE\u003efrom_mills_to_secs\u003c/CODE\u003e was already a private Oracle function rather than a helper invented during migration:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003efunction from_mills_to_secs(value integer) return float is\n  real_value float := 0;\nbegin\n  real_value := value/1000;\n  return real_value;\nexception\n  when zero_divide then\n    real_value := 0;\n    return real_value;\nend from_mills_to_secs;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eDespite the shortened name, “mills” means milliseconds here. The \u003cCODE\u003eZERO_DIVIDE\u003c/CODE\u003e branch is defensive but cannot normally be reached because the divisor is the constant 1000.\u003c/P\u003e\n\u003cP\u003eI compared it with the generated PostgreSQL function, which keeps the operation but explicitly converts to floating point to avoid integer division:\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-sql\"\u003e\u003ccode\u003eCREATE OR REPLACE FUNCTION soe.orderentry$from_mills_to_secs(value integer)\nRETURNS double precision\nLANGUAGE plpgsql\nIMMUTABLE\nAS $$\nDECLARE\n  real_value double precision := 0;\nBEGIN\n  real_value := value::double precision / 1000.0;\n  RETURN real_value;\nEXCEPTION\n  WHEN division_by_zero THEN\n    real_value := 0;\n    RETURN real_value;\nEND;\n$$;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003e\u003cCODE\u003eorderentry$sleep\u003c/CODE\u003e calls this helper for the fixed or randomly selected delay, maps \u003cCODE\u003eDBMS_LOCK.SLEEP\u003c/CODE\u003e to \u003cCODE\u003epg_sleep\u003c/CODE\u003e, and updates a package counter. Here the review found a subtle semantic issue: the generated helper calculates elapsed milliseconds but adds the selected delay in seconds to the counter. The supplied workload uses zero delays, so it did not affect this run. With nonzero delays, the code could compile and execute while returning the wrong value. This is the kind of small conversion detail that is easy to miss and appears much later as an application error.\u003c/P\u003e\n\u003cH3 id=\"community-4544728-toc-hId-480208966\"\u003eTransaction control changes ownership\u003c/H3\u003e\n\u003cP\u003eThe largest architectural difference is transaction control. In Oracle Database, \u003cCODE\u003eoecommit\u003c/CODE\u003e can issue \u003cCODE\u003eCOMMIT\u003c/CODE\u003e from inside the package when the session-level \u003cCODE\u003ePLSQLCOMMIT\u003c/CODE\u003e flag is true. The package therefore decides when its changes become durable and increments its own commit counter at that point.\u003c/P\u003e\n\u003cP\u003eThe converter repres
