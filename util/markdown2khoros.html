  <title>Markdown → HTML + li-code</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 1200px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      font-family: Consolas, monospace;
    }

    #input {
      height: 250px;
      margin-bottom: 15px;
    }

    #output {
      height: 300px;
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
    }

    input[type="text"],
    input[type="number"] {
      padding: 4px;
    }
  </style>
</head>
<body>

  <h2>Markdown → HTML (li-code)</h2>

  <textarea id="input" placeholder="Collez votre Markdown ici..."></textarea>

  <div class="controls">
    <button onclick="convert()">Convertir</button>

    <label>
      Langage par défaut :
      <input id="codeLang" type="text" value="sql" style="width:120px">
    </label>

    <label>
      Taille image (%) :
      <input id="imageSize" type="number" value="80" min="1" max="100" style="width:60px">
    </label>

    <label>
      Bordure :
      <input id="imageBorder" type="text" value="#cccccc" style="width:90px">
    </label>

    <button onclick="copyOutput()">Copier résultat</button>
  </div>

  <h3>Résultat</h3>

  <textarea id="output"></textarea>

  <script>

      const md = document.getElementById("input").value;
      const defaultLang = document.getElementById("codeLang").value.trim() || "text";
      const imageSize = document.getElementById("imageSize").value || 80;
      const imageBorder = document.getElementById("imageBorder").value || "#cccccc";

      // en <li-code lang="xxx">...</li-code>
