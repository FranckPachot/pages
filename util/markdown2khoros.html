<meta charset="UTF-8">
<title>Markdown → HTML + li-code</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

textarea {
    width: 100%;
    height: 250px;
    font-family: Consolas, monospace;
    margin-bottom: 15px;
}

button {
    padding: 8px 16px;
    margin-right: 10px;
}

#output {
    width: 100%;
    height: 300px;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<h2>Markdown → HTML (li-code)</h2>

<textarea id="input" placeholder="Colle ton markdown ici..."></textarea>

<br>

<button onclick="convert()">Convertir</button>
<label>
    Langage du code :
    <input id="codeLang" value="sql" style="width:120px;">
</label>
<button onclick="copy()">Copier le résultat</button>

<h3>Résultat</h3>

<textarea id="output"></textarea>

<script>

function convert() {

    let md = document.getElementById("input").value;

    let html = marked.parse(md);

    // Remplace <pre><code class="language-xxx">...</code></pre>


    const codeLang =
       document.getElementById("codeLang").value.trim();

    html = html.replace(
        /<pre><code(?: class="language-([^"]+)")?>([\s\S]*?)<\/code><\/pre>/g,
        (_, lang, code) => {
            return `<li-code lang="${codeLang || lang || 'text'}">\n${code}\n</li-code>`;
       }
);

    document.getElementById("output").value = html;
}

function copy() {
    navigator.clipboard.writeText(
        document.getElementById("output").value
    );
}

window.addEventListener("paste", e => {
    if (document.activeElement !== document.getElementById("input")) {
        e.preventDefault();
        document.getElementById("input").value =
            e.clipboardData.getData("text");
    }
});

</script>

</body>
</html>
