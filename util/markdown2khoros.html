<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Khoros HTML</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    max-width: 1400px;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: Consolas, monospace;
}

#input {
    height: 300px;
}

#output {
    height: 300px;
}

.controls {
    margin: 15px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
}

input {
    padding: 4px;
}

button {
    padding: 8px 16px;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>Markdown → HTML (Khoros li-code)</h2>

<textarea id="input" placeholder="Collez votre Markdown ici..."></textarea>

<div class="controls">

    <button id="convertBtn">Convertir</button>

    <label>
        Langage par défaut :
        <input id="codeLang" value="sql">
    </label>

    <label>
        Taille image (%) :
        <input id="imageSize" type="number" value="80" min="1" max="100">
    </label>

    <label>
        Bordure :
        <input id="imageBorder" value="#cccccc">
    </label>

    <button id="copyBtn">Copier résultat</button>

</div>

<h3>Résultat</h3>

<textarea id="output"></textarea>

<script>

function convert() {

    const md = document.getElementById("input").value;

    const defaultLang =
        document.getElementById("codeLang").value.trim() || "text";

    const imageSize =
        document.getElementById("imageSize").value || "80";

    const imageBorder =
        document.getElementById("imageBorder").value || "#cccccc";

    let html = marked.parse(md);

    const temp = document.createElement("div");
    temp.innerHTML = html;

    temp.querySelectorAll("pre > code").forEach(codeBlock => {

        let lang = defaultLang;

        const className = codeBlock.className || "";

        const match = className.match(/language-([a-zA-Z0-9_-]+)/);

        if (match) {
            lang = match[1];
        }

        const liCode = document.createElement("li-code");

        liCode.setAttribute("lang", lang);

        liCode.textContent = codeBlock.textContent;

        codeBlock.parentElement.replaceWith(liCode);
    });

    temp.querySelectorAll("img").forEach(img => {

        img.style.maxWidth = imageSize + "%";
        img.style.border = "1px solid " + imageBorder;
        img.style.padding = "2px";
    });

    document.getElementById("output").value = temp.innerHTML;
}

function copyOutput() {

    navigator.clipboard.writeText(
        document.getElementById("output").value
    );
}

document
    .getElementById("convertBtn")
    .addEventListener("click", convert);

document
    .getElementById("copyBtn")
    .addEventListener("click", copyOutput);

document
    .getElementById("input")
    .addEventListener("paste", function (e) {

        e.preventDefault();

        const text =
            (e.clipboardData || window.clipboardData)
            .getData("text");

        this.value = text;
    });

</script>

</body>
</html>
